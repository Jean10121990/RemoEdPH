<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/admin-standalone-redirect.js"></script>
    <script src="js/admin-embed-init.js"></script>
    <title>User profile (admin) - RemoEdPH</title>
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6fbff; margin: 0; min-height: 100vh; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(28,167,231,0.08); padding: 20px 22px; border: 1px solid #e8f4fd; }
        h1 { color: #1ca7e7; font-size: 1.25rem; margin: 0 0 16px; font-weight: 700; }
        .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.92rem; }
        .row:last-child { border-bottom: none; }
        .k { color: #64748b; font-weight: 600; flex: 0 0 42%; }
        .v { color: #0f172a; text-align: right; word-break: break-word; }
        .back { display: inline-flex; align-items: center; gap: 8px; color: #1ca7e7; text-decoration: none; font-weight: 600; margin-bottom: 16px; font-size: 0.95rem; }
        .back:hover { text-decoration: underline; }
        .err { color: #c0392b; padding: 16px; background: #fdecea; border-radius: 8px; }
        .muted { font-size: 0.8rem; color: #94a3b8; margin-top: 12px; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
        .actions a { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; text-decoration: none; }
        .actions a.primary { background: #1ca7e7; color: #fff; }
        .actions a.secondary { background: #f1f5f9; color: #334155; }
        .personality-block { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
        .personality-block h2 { margin: 0 0 4px; font-size: 1rem; color: #0f172a; font-weight: 700; }
        .personality-block .sub { font-size: 0.8rem; color: #64748b; margin: 0 0 12px; }
        .personality-overall { font-weight: 700; color: #0f172a; margin-bottom: 14px; font-size: 0.95rem; }
        .meter-section { margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; background: #f8fafc; }
        .meter-section-title { font-weight: 700; color: #334155; margin-bottom: 10px; font-size: 0.9rem; }
        .meter-grid { display: grid; gap: 10px; }
        .commitment-meter-header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; font-weight: 600; color: #334155; font-size: 0.88rem; }
        .commitment-pct { font-variant-numeric: tabular-nums; font-weight: 700; color: #475569; white-space: nowrap; }
        .commitment-bar { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .commitment-bar-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%); }
        .commitment-meter.is-pass .commitment-bar-fill { background: linear-gradient(90deg, #34d399 0%, #10b981 100%); }
        .commitment-meter.is-pass .commitment-pct { color: #047857; }
        .commitment-meter.is-empty .commitment-pct { color: #94a3b8; font-weight: 600; }
        .empty-personality { color: #64748b; font-size: 0.9rem; padding: 8px 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="admin-users.html">← Back to User Management</a>
        <div id="root" class="card">
            <div style="color:#64748b;">Loading…</div>
        </div>
    </div>
    <script src="js/admin-session.js"></script>
    <script src="js/assessment-answer-key-data.js"></script>
    <script>
        function adminApiFetchInit(init) {
            var o = init && typeof init === 'object' ? Object.assign({}, init) : {};
            var token = (window.RemoedAdminSession && RemoedAdminSession.getAuthToken ? RemoedAdminSession.getAuthToken() : (localStorage.getItem('remoed_admin_token')||localStorage.getItem('remoed_admin_auth')||localStorage.getItem('adminToken')||'')) || '';
            var headers = Object.assign({}, o.headers || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            o.headers = headers;
            o.credentials = 'include';
            return o;
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        var COMMITMENT_PASS_PERCENT = 60;
        var HEART_METERS = [
            { label: 'H - Hospitality', category: 'Interpersonal Communication' },
            { label: 'E - Excellence', category: 'Professionalism' },
            { label: 'A - Affection', category: 'Student Engagement' },
            { label: 'R - Respect', category: 'Cultural Awareness' },
            { label: 'T - Togetherness', category: 'Technology Use' }
        ];
        var HONOR_METERS = [
            { label: 'Avoid False Witness (Honesty)', category: 'Professionalism' },
            { label: 'No Gossip or Politics', category: 'Cultural Awareness' },
            { label: 'Integrity & Speech', category: 'Interpersonal Communication' },
            { label: 'Good Attitude (Anti-Greed)', category: 'Student Engagement' },
            { label: 'Financial Stewardship', category: 'Technology Use' }
        ];

        function deriveCategoryScoresFromAnswers(answers) {
            if (!answers || typeof answers !== 'object') return null;
            if (window.AssessmentAnswerKey && typeof AssessmentAnswerKey.computePersonalityCategoryScores === 'function') {
                var categoryScores = AssessmentAnswerKey.computePersonalityCategoryScores(answers);
                var anyNew = Object.keys(categoryScores).some(function (category) {
                    return categoryScores[category].total > 0;
                });
                return anyNew ? categoryScores : null;
            }
            var categoryScores = {};
            var any = false;
            Object.keys(answers).forEach(function (category) {
                var items = Array.isArray(answers[category]) ? answers[category] : [];
                if (!items.length) return;
                any = true;
                var correct = 0;
                items.forEach(function (val) {
                    if (val === category) correct += 1;
                });
                categoryScores[category] = { correct: correct, total: items.length };
            });
            return any ? categoryScores : null;
        }

        function resolvePersonalityCategoryScores(personality) {
            if (!personality) return null;
            if (personality.categoryScores && Object.keys(personality.categoryScores).length) {
                return personality.categoryScores;
            }
            return deriveCategoryScoresFromAnswers(personality.answers);
        }

        function categoryPercent(categoryScores, category) {
            if (!categoryScores || !category) return null;
            var score = categoryScores[category];
            if (!score || !score.total) return null;
            return Math.round((Number(score.correct || 0) / Number(score.total)) * 100);
        }

        function renderMeterRow(label, pct) {
            var hasScore = pct !== null && pct !== undefined && !isNaN(Number(pct));
            var value = hasScore ? Math.max(0, Math.min(100, Math.round(Number(pct)))) : 0;
            var cls = 'commitment-meter' + (hasScore && value >= COMMITMENT_PASS_PERCENT ? ' is-pass' : '') + (!hasScore ? ' is-empty' : '');
            return '<div class="' + cls + '">' +
                '<div class="commitment-meter-header"><span>' + esc(label) + '</span><span class="commitment-pct">' +
                (hasScore ? (value + '%') : 'Not assessed') + '</span></div>' +
                '<div class="commitment-bar"><div class="commitment-bar-fill" style="width:' + (hasScore ? value : 0) + '%;"></div></div>' +
                '</div>';
        }

        function renderPersonalitySection(teacher) {
            var personality = teacher && teacher.assessmentTests && teacher.assessmentTests.personality
                ? teacher.assessmentTests.personality
                : null;
            var html = '<div class="personality-block">';
            html += '<h2>Personality assessment</h2>';
            html += '<p class="sub">From Career Growth · H.E.A.R.T. &amp; Code of Honor (60%+ highlighted)</p>';

            if (!personality || (personality.score == null && personality.total == null && !personality.answers && !personality.categoryScores)) {
                html += '<div class="empty-personality">No personality assessment results yet.</div></div>';
                return html;
            }

            var categoryScores = resolvePersonalityCategoryScores(personality) || {};
            var percent = personality.percent;
            if (percent == null && personality.score != null && personality.total) {
                percent = Math.round((Number(personality.score) / Number(personality.total)) * 100);
            }
            if (percent == null && Object.keys(categoryScores).length) {
                var correctSum = 0;
                var totalSum = 0;
                Object.keys(categoryScores).forEach(function (k) {
                    correctSum += Number(categoryScores[k].correct || 0);
                    totalSum += Number(categoryScores[k].total || 0);
                });
                if (totalSum) percent = Math.round((correctSum / totalSum) * 100);
            }

            var scoreLabel = (personality.score != null && personality.total != null)
                ? ('Score: ' + personality.score + ' / ' + personality.total + (percent != null ? ' (' + percent + '%)' : ''))
                : (percent != null ? ('Score: ' + percent + '%') : 'Score unavailable');
            html += '<div class="personality-overall">' + esc(scoreLabel) + '</div>';

            html += '<div class="meter-section"><div class="meter-section-title">The H.E.A.R.T. Framework</div><div class="meter-grid">';
            HEART_METERS.forEach(function (item) {
                html += renderMeterRow(item.label, categoryPercent(categoryScores, item.category));
            });
            html += '</div></div>';

            html += '<div class="meter-section"><div class="meter-section-title">RemoEd Code of Honor</div><div class="meter-grid">';
            HONOR_METERS.forEach(function (item) {
                html += renderMeterRow(item.label, categoryPercent(categoryScores, item.category));
            });
            html += '</div></div></div>';
            return html;
        }

        if (localStorage.getItem('userType') !== 'admin') {
            document.getElementById('root').innerHTML = '<div class="err">Access denied.</div>';
        } else {
            (function () {
                var params = new URLSearchParams(window.location.search);
                var type = String(params.get('type') || '').toLowerCase();
                var id = String(params.get('id') || '').trim();
                var root = document.getElementById('root');

                if ((type !== 'student' && type !== 'admin' && type !== 'teacher') || !id) {
                    root.innerHTML = '<div class="err">Missing or invalid profile link. Use View Profile from User Management.</div>';
                    return;
                }

                fetch('/api/admin/user/' + encodeURIComponent(id) + '?type=' + encodeURIComponent(type), adminApiFetchInit())
                    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
                    .then(function (res) {
                        if (!res.ok || res.j.error) {
                            root.innerHTML = '<div class="err">' + esc(res.j.error || 'Could not load user') + '</div>';
                            return;
                        }
                        var u = res.j;
                        var title = type === 'student' ? 'Student profile' : type === 'teacher' ? 'Teacher profile' : 'Admin profile';
                        var rows = [];

                        if (type === 'student') {
                            var name = [u.firstName, u.middleName, u.lastName].filter(Boolean).join(' ').trim() || '—';
                            rows.push(['Display name', name]);
                            rows.push(['Username', u.username || '—']);
                            rows.push(['Email', u.email || '—']);
                            rows.push(['Student code', u.studentCode || '—']);
                            rows.push(['Level', u.level || u.cefrLevel || '—']);
                            rows.push(['Status', u.status || '—']);
                            rows.push(['Account status', u.accountStatus || '—']);
                            rows.push(['Joined', u.createdAt ? new Date(u.createdAt).toLocaleString() : '—']);
                        } else if (type === 'teacher') {
                            var credCount = [u.payoutCred1, u.payoutCred2, u.payoutCred3].filter(Boolean).length;
                            var tierLabel = u.payoutTierBase ? ('₱' + u.payoutTierBase + '/hr base') : '—';
                            if (credCount) tierLabel += ' · ' + credCount + ' credential' + (credCount === 1 ? '' : 's');
                            var certs = Array.isArray(u.certifications) ? u.certifications.length : 0;
                            var trainingDone = Array.isArray(u.trainingProgress)
                                ? u.trainingProgress.filter(function (t) { return t && (t.status === 'completed' || t.percent >= 100); }).length
                                : 0;
                            rows.push(['Username', u.username || '—']);
                            rows.push(['Email', u.email || '—']);
                            rows.push(['Teacher ID', u.teacherId || '—']);
                            rows.push(['Status', u.status || '—']);
                            rows.push(['Payout tier', tierLabel]);
                            rows.push(['Rate (25 min)', u.hourlyRate != null ? ('₱' + Number(u.hourlyRate).toFixed(2)) : '—']);
                            rows.push(['Certifications', String(certs)]);
                            rows.push(['Training courses completed', String(trainingDone)]);
                            rows.push(['Joined', u.createdAt ? new Date(u.createdAt).toLocaleString() : '—']);
                        } else {
                            var roleMap = { super_admin: 'Super-Admin', admin_hr: 'HR', admin_accounting: 'Accounting', admin_qa: 'QA' };
                            rows.push(['Username', u.username || '—']);
                            rows.push(['Email', u.email || '—']);
                            rows.push(['Role', roleMap[u.adminRole] || u.adminRole || '—']);
                            rows.push(['Status', u.status || '—']);
                            rows.push(['Joined', u.createdAt ? new Date(u.createdAt).toLocaleString() : '—']);
                        }

                        var html = '<h1>' + esc(title) + '</h1>';
                        rows.forEach(function (pair) {
                            html += '<div class="row"><span class="k">' + esc(pair[0]) + '</span><span class="v">' + esc(pair[1]) + '</span></div>';
                        });
                        if (type === 'teacher') {
                            html += renderPersonalitySection(u);
                        }
                        if (type === 'teacher' && u.teacherId) {
                            html += '<div class="actions">';
                            html += '<a class="primary" href="admin-teacher-schedule.html?teacherId=' + encodeURIComponent(u.teacherId) + '">View schedule</a>';
                            html += '<a class="secondary" href="/teachers?teacherId=' + encodeURIComponent(u.teacherId) + '" target="_blank" rel="noopener noreferrer">Public profile</a>';
                            html += '</div>';
                        }
                        html += '<p class="muted">Read-only summary for administrators. Sensitive fields may be omitted or encrypted at rest.</p>';
                        root.innerHTML = html;
                    })
                    .catch(function () {
                        root.innerHTML = '<div class="err">Network error loading profile.</div>';
                    });
            })();
        }
    </script>
</body>
</html>
