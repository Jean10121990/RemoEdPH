<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/remoed-gtag.js?v=ga-1"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free trial lessons - RemoEdPH</title>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:#00aeef; --blue-deep:#008fc4; --green:#00a82d; --yellow:#fdd835;
      --pink:#FF5C8A; --navy:#1a3a4a; --ink:#1a3a4a; --tint:#e8f7fc;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; overflow-x:hidden; }
    body {
      min-height:100vh; color:var(--ink);
      font-family:"Quicksand","Segoe UI",sans-serif; font-weight:700; font-size:20px;
      background:linear-gradient(#7ec8f8 0%, #c5ecff 42%, #b6e39a 42%, #7dce63 100%);
    }
    .sky { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .cloud { position:absolute; background:#fff; border-radius:40px; opacity:.85; height:36px; }
    .cloud:before, .cloud:after { content:""; position:absolute; background:#fff; border-radius:50%; }
    .cloud:before { width:40px; height:40px; top:-18px; left:16px; }
    .cloud:after { width:56px; height:56px; top:-28px; left:42px; }
    .c1 { width:120px; top:8%; left:-10%; animation:drift 36s linear infinite; }
    .c2 { width:90px; top:18%; left:20%; animation:drift 48s linear infinite; }
    .c3 { width:140px; top:6%; left:55%; animation:drift 42s linear infinite; }
    .hill { position:absolute; left:-10%; right:-10%; bottom:-20px; height:140px; background:#5cbf4a; border-radius:50% 50% 0 0; }
    .hill.b { bottom:20px; height:90px; background:#7dce63; left:20%; right:-20%; }
    .flower { position:absolute; bottom:36px; width:14px; height:14px; border-radius:50%; background:var(--pink); box-shadow:16px -10px 0 var(--yellow), -14px -6px 0 var(--blue); }
    .flower:after { content:""; position:absolute; left:5px; top:12px; width:4px; height:22px; background:#1FA324; }
    @keyframes drift { from { transform:translateX(0); } to { transform:translateX(110vw); } }
    .top { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .top img { height:44px; width:auto; }
    #sound { min-width:64px; min-height:48px; border:2px solid var(--blue); border-radius:999px; background:#fff; color:var(--blue-deep); box-shadow:0 6px 16px rgba(0,174,239,.18); font-family:Fredoka,Quicksand,sans-serif; font-weight:700; cursor:pointer; }
    .wrap { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:12px 20px 28px; }
    .lesson {
      display:grid; grid-template-columns:150px 1fr; gap:18px; align-items:center;
      background:#fff; border:none; border-radius:28px;
      box-shadow:0 18px 40px rgba(0,174,239,.16);
      padding:28px 32px 24px; min-height:560px; position:relative; overflow:hidden;
    }
    .lesson:before {
      content:""; position:absolute; left:0; right:0; top:0; height:6px;
      background:linear-gradient(90deg, var(--green), var(--blue) 55%, var(--yellow));
    }
    .cast { position:relative; }
    .cast img { width:108px; height:auto; }
    .mascot { display:block; animation:bob 2.4s ease-in-out infinite; }
    .mascot.is-talking { animation:wiggle .35s ease-in-out infinite; }
    .mascot.is-jump { animation:jump .45s ease; }
    .friend, .teacher { display:none; }
    body[data-scene="bye"] .mascot, body[data-scene="report"] .mascot { display:none; }
    body[data-scene="bye"] .friend { display:block; animation:bob 2s ease-in-out infinite; }
    body[data-scene="report"] .teacher { display:block; }
    @keyframes bob { 50% { transform:translateY(-8px); } }
    @keyframes wiggle { 50% { transform:rotate(-4deg) translateY(-4px); } }
    @keyframes jump { 40% { transform:translateY(-18px); } 100% { transform:translateY(0); } }
    .bubble {
      background:var(--tint); border:none; border-radius:20px; padding:12px 16px;
      box-shadow:none; color:var(--ink); min-height:52px; margin:0 0 12px;
    }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:0; margin:8px 0 16px; position:relative; }
    .bar:before { content:""; position:absolute; left:8%; right:8%; top:50%; border-top:4px dotted #b7e6f6; z-index:0; }
    .bar button {
      position:relative; z-index:1; width:56px; height:56px; min-height:56px; padding:0;
      border-radius:50%; border:none; background:#e8f7fc; color:#7aa8bc;
      font-family:Fredoka,Quicksand,sans-serif; font-weight:700; font-size:22px; cursor:pointer;
      box-shadow:0 4px 0 #d3eef8;
    }
    .bar button.is-done { background:var(--yellow); color:var(--ink); box-shadow:0 4px 0 #e6c200; }
    .bar button.is-on { width:68px; height:68px; background:var(--blue); color:#fff; box-shadow:0 4px 0 var(--blue-deep); animation:pulse 1.2s ease-in-out infinite; }
    .bar button.is-lock { opacity:.55; }
    @keyframes pulse { 50% { transform:scale(1.08); } }
    .stage { background:transparent; border-radius:24px; padding:8px 0 12px; min-height:320px; text-align:center; }
    .stage.is-in { animation:slide .3s ease; }
    @keyframes slide { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .note { min-height:0; margin:2px 0 0; text-align:center; color:var(--navy); }
    h1,h2,.big,.tap,button,.plan { font-family:Fredoka,Quicksand,sans-serif; font-weight:700; }
    .big { font-size:clamp(4.2rem,12vw,7.5rem); line-height:1.05; margin:8px 0; }
    .wave span { display:inline-block; animation:wave .6s ease both; }
    @keyframes wave { from { transform:translateY(10px); opacity:0; } to { transform:none; opacity:1; } }
    .row { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .tap {
      min-height:96px; min-width:120px; border:none; border-radius:999px;
      background:var(--yellow); color:var(--ink); font-size:28px; margin:8px; padding:14px 28px;
      box-shadow:0 6px 0 #e6c200; cursor:pointer;
    }
    .tap:active { transform:translateY(4px); box-shadow:0 2px 0 #e6c200; }
    .tap.green { background:var(--green); color:#fff; box-shadow:0 6px 0 #008a24; }
    .tap.green:active { box-shadow:0 2px 0 #008a24; }
    .tap.blue { background:var(--blue); color:#fff; box-shadow:0 6px 0 var(--blue-deep); }
    .tap.blue:active { box-shadow:0 2px 0 var(--blue-deep); }
    .tap.choice {
      display:flex; align-items:center; justify-content:center;
      width:180px; height:180px; min-width:180px; min-height:180px;
      border-radius:28px; background:#fff; padding:8px;
      border:3px solid #b7e6f6; box-shadow:0 10px 0 #d7f1fa;
    }
    .tap.choice .emoji { font-size:104px; }
    .tap.choice:active { box-shadow:0 4px 0 #d7f1fa; }
    .tap.mood { display:flex; flex-direction:column; align-items:center; justify-content:center; width:180px; min-height:180px; border-radius:28px; background:#fff; border:3px solid #b7e6f6; box-shadow:0 10px 0 #d7f1fa; }
    .tap.mood .emoji { font-size:64px; line-height:1; }
    .tap.mood.is-picked { background:var(--yellow); box-shadow:0 0 0 6px #fff3a8, 0 6px 0 #e6c200; animation:jump .4s ease; }
    .tap.bubble, .tap.food { display:flex; flex-direction:column; align-items:center; justify-content:center; width:156px; height:156px; border-radius:50%; padding:8px; background:#fff; border:3px solid #b7e6f6; box-shadow:0 8px 0 #d7f1fa; }
    .tap.bubble { animation:bob 2.2s ease-in-out infinite; }
    .tap.food { cursor:grab; touch-action:none; }
    .tap .emoji { font-size:72px; line-height:1; }
    .tap .word { font-size:16px; line-height:1.1; }
    .tap.dragging { position:fixed; z-index:20; margin:0; pointer-events:none; opacity:.9; }
    .heard { margin:4px 0 8px; font-size:18px; }
    .tap.bubble.pop { animation:pop .25s ease forwards; }
    @keyframes pop { to { transform:scale(1.4); opacity:0; } }
    .monster {
      width:190px; height:160px; margin:4px auto 10px; position:relative;
      background:linear-gradient(180deg, #7ee894 0%, #00a82d 70%);
      border:4px solid #008a24; border-radius:96px 96px 88px 88px;
      box-shadow:0 10px 0 #b7ebc4, inset 0 -12px 0 rgba(0,90,30,.08);
      animation:bob 2.4s ease-in-out infinite;
    }
    .monster:before {
      content:""; position:absolute; width:42px; height:18px; left:32px; top:18px;
      background:rgba(255,255,255,.5); border-radius:20px; transform:rotate(-16deg);
    }
    .monster .eye {
      position:absolute; top:42px; width:34px; height:36px; background:#fff; border-radius:50%;
      box-shadow:inset 0 -2px 0 rgba(0,138,36,.12);
    }
    .monster .eye.left { left:40px; }
    .monster .eye.right { right:40px; }
    .monster .eye:after {
      content:""; position:absolute; width:16px; height:18px; left:10px; top:12px;
      background:#1a3a4a; border-radius:50%;
    }
    .monster .eye:before {
      content:""; position:absolute; width:7px; height:7px; left:16px; top:14px; z-index:1;
      background:#fff; border-radius:50%;
    }
    .monster.is-open .eye, .monster.is-chomp .eye { height:16px; top:52px; border-radius:16px; }
    .monster.is-open .eye:after, .monster.is-chomp .eye:after,
    .monster.is-open .eye:before, .monster.is-chomp .eye:before { display:none; }
    .monster .cheek { position:absolute; top:86px; width:26px; height:16px; background:#ff8fab; border-radius:50%; opacity:.9; }
    .monster .cheek.left { left:16px; }
    .monster .cheek.right { right:16px; }
    .monster .mouth {
      position:absolute; left:58px; right:58px; bottom:28px; height:22px;
      background:transparent; border:5px solid #1a3a4a; border-top:0; border-radius:0 0 40px 40px;
      transition:height .2s, background .2s, border-radius .2s;
    }
    .monster.is-open .mouth, .monster.is-chomp .mouth {
      height:46px; background:#1B2447; border:none; border-radius:12px 12px 28px 28px;
    }
    .home { width:150px; height:110px; margin:8px auto; background:#0A7FD4; border:4px solid var(--navy); border-radius:8px; position:relative; }
    .home:before { content:""; position:absolute; left:8px; right:8px; top:-34px; height:36px; background:#FF5C8A; border:4px solid var(--navy); clip-path:polygon(50% 0, 100% 100%, 0 100%); }
    .home.is-open { background:#FFE82E; }
    .cam { width:min(100%, 640px); height:360px; object-fit:cover; border:none; border-radius:20px; background:#0f172a; box-shadow:0 10px 24px rgba(0,174,239,.2); transform:scaleX(-1); }
    .lock-note { background:#f8fafc; border-radius:16px; padding:12px; }
    a.plan { display:inline-flex; align-items:center; justify-content:center; min-height:80px; padding:0 22px; border-radius:999px; border:none; background:var(--blue); color:#fff; text-decoration:none; box-shadow:0 6px 0 var(--blue-deep); }
    .ready-banner {
      display:block; margin:18px auto 14px; max-width:520px; padding:12px 18px;
      border-radius:999px; background:#e8f7fc; color:#008fc4;
      font-family:Fredoka,Quicksand,sans-serif; font-weight:700; font-size:1.15rem; line-height:1.35; text-align:center;
    }
    button:disabled, a.disabled { opacity:.45; pointer-events:none; }
    video { width:100%; max-height:400px; background:#0f172a; border-radius:16px; }
    .pulse { outline:4px solid var(--green); }
    .wobble { animation:wob .35s ease; }
    @keyframes wob { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
    .cert { border:none; border-radius:28px; padding:16px; background:#fff8dc; box-shadow:0 10px 0 #ffe566; }
    .cheers { display:flex; justify-content:center; gap:12px; }
    .cheers img { width:100px; height:auto; }
    .stickers span { display:inline-block; font-size:40px; animation:drop .4s ease both; }
    .stickers span:nth-child(2) { animation-delay:.15s; }
    .stickers span:nth-child(3) { animation-delay:.3s; }
    @keyframes drop { from { transform:translateY(-20px); opacity:0; } to { transform:none; opacity:1; } }
    .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
    .tile { background:var(--tint); border:none; border-radius:20px; padding:12px; box-shadow:0 6px 0 #d3eef8; }
    .tile b { display:block; font-size:32px; font-family:Fredoka,Quicksand,sans-serif; color:var(--blue-deep); }
    .gate-card { margin-top:12px; padding:16px; border:none; border-radius:24px; background:#fff; box-shadow:0 10px 24px rgba(0,174,239,.16); }
    #gate { min-height:64px; font-size:28px; width:80px; text-align:center; border:3px solid var(--navy); border-radius:16px; }
    .toast { position:fixed; left:50%; top:18%; transform:translateX(-50%) scale(.8); background:var(--yellow); color:var(--ink); border:none; border-radius:999px; padding:10px 18px; font-family:Fredoka,Quicksand,sans-serif; font-weight:700; font-size:24px; opacity:0; pointer-events:none; z-index:5; box-shadow:0 8px 20px rgba(253,216,53,.45); }
    .toast.show { animation:toast .9s ease; }
    @keyframes toast { 30% { opacity:1; transform:translateX(-50%) scale(1); } 100% { opacity:0; } }
    .confetti { position:fixed; inset:0; pointer-events:none; z-index:4; overflow:hidden; }
    .confetti i { position:absolute; top:-12px; width:10px; height:14px; border-radius:2px; animation:fall .9s linear forwards; }
    @keyframes fall { to { transform:translateY(100vh) rotate(180deg); opacity:.2; } }
    .flyer { position:fixed; z-index:6; font-size:28px; pointer-events:none; animation:fly .6s ease forwards; }
    @keyframes fly { to { transform:translate(var(--dx), var(--dy)) scale(.4); opacity:.2; } }
    :focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    @media (max-width:700px) {
      .lesson { grid-template-columns:1fr; min-height:0; padding:16px; }
      .stage { min-height:0; }
      .cast { display:flex; justify-content:center; }
      .cast img { width:110px; }
      .bar button, .bar button.is-on { width:40px; height:40px; font-size:16px; }
      .cam { height:220px; }
      .big { font-size:4.2rem; }
      .tap.bubble, .tap.food { width:120px; height:120px; }
      .tap.choice { width:132px; height:132px; min-width:132px; min-height:132px; }
      .tap.choice .emoji { font-size:76px; }
      .tiles { grid-template-columns:1fr; }
      .ready-banner { border-radius:20px; font-size:1.05rem; padding:12px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, .mascot, .cloud, .tap.bubble, .stage.is-in, .wave span, .stickers span { animation:none !important; transition:none !important; }
    }
  </style>
</head>
<body data-scene="hello">
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="hill b"></div><div class="hill"></div>
    <div class="flower" style="left:8%"></div>
    <div class="flower" style="left:46%;background:#FFE82E"></div>
    <div class="flower" style="right:10%"></div>
  </div>
  <header class="top">
    <img id="logo" src="images/logo.png" alt="RemoEdPH" width="120" height="44" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='images/remoed-logo-new.png';}else{this.outerHTML='<strong style=&quot;font-family:Baloo 2,sans-serif;font-size:28px&quot;>RemoEdPH</strong>';}">
    <button type="button" id="sound" aria-label="Sound on">Sound on</button>
  </header>
  <main class="wrap">
    <div class="lesson">
      <div class="cast">
        <img id="mascot" class="mascot" src="images/mascot.png" alt="" width="140" height="160" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='images/remo-green.png';}else{this.hidden=true;}">
        <img class="friend" src="images/boy.png" alt="" width="100" height="120" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='images/ed-boy.png';}else{this.hidden=true;}">
        <img class="friend" src="images/girl.png" alt="" width="100" height="120" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='images/sophia-peeking.png';}else{this.hidden=true;}">
        <img class="teacher" src="images/teacher.png" alt="" width="140" height="160" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='images/grace-teacher.png';}else{this.hidden=true;}">
      </div>
      <div>
        <p class="bubble" id="bubble">Let’s learn!</p>
        <div class="bar" id="bar"></div>
        <p class="note" id="msg"></p>
        <div class="stage" id="stage"></div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script src="trial-client.js?v=trial-save-1"></script>
  <script src="trial.js?v=trial-face-1"></script>
</body>
</html>
