<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/admin-standalone-redirect.js"></script>
    <script src="js/admin-embed-init.js"></script>
    <title>Payroll Management - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css?v=app-shell-3">
    <link rel="stylesheet" href="css/portal-chrome-compact.css?v=app-shell-3">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-admin-payroll">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-sidebar.js?v=app-shell-4"></script>
        <script>if (!window.__ADMIN_EMBED__) { AdminSidebar.render('admin-sidebar-root', 'payroll'); }</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Bi-weekly Salary Disbursement</div>
                <div style="margin: 6px 0 14px 0; color: #64748b; font-size: 0.85rem;">
                    Pay periods: <strong>1st–15th</strong> (1st cut-off, salary date the <strong>15th</strong>) and <strong>16th–end of month</strong> (2nd cut-off, salary date the last day).
                </div>
                
                <!-- Period Navigation Controls -->
                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="previousPeriod()" style="padding: 8px 16px; font-size: 14px;">
                        ← Previous Period
                    </button>
                    
                    <div style="text-align: center; flex: 1; min-width: 200px;">
                        <strong>Selected Period:</strong> <span id="current-week-display">Loading...</span>
                    </div>
                    
                    <button class="btn btn-primary" onclick="nextPeriod()" style="padding: 8px 16px; font-size: 14px;">
                        Next Period →
                    </button>
                    
                    <button class="btn btn-success" onclick="goToCurrentPeriod()" style="padding: 8px 16px; font-size: 14px; background: #28a745;">
                        📅 Current Period
                    </button>
                </div>
                
                <button type="button" class="btn btn-success" id="btn-load-teachers" onclick="loadTeachersSalaries()">Load Teachers</button>
                <button class="btn btn-danger" id="dispense-btn" onclick="dispenseAllSalaries()" style="display: none;">Dispense All Salaries</button>
                
                <div id="disbursement-status" style="margin-top: 10px; font-weight: 600;"></div>
                
                <div id="teachers-list-container" style="margin-top: 20px; display: none;">
                    <h3 style="color: #1ca7e7; margin-bottom: 15px;">Teachers Bi-weekly Salaries</h3>
                    <div id="teachers-list">
                        <!-- Teachers will be loaded here -->
                    </div>
                </div>
            </div>
            
            <div class="remoed-section">
                <div class="remoed-section-title">Payment History Management</div>
                
                <div style="margin-bottom: 20px;">
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <label for="teacher-filter" style="font-weight: 600; color: #333;">Filter by Teacher:</label>
                        <select id="teacher-filter" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; min-width: 200px;">
                            <option value="">All Teachers</option>
                        </select>
                        
                        <label for="status-filter" style="font-weight: 600; color: #333;">Filter by Status:</label>
                        <select id="status-filter" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px;">
                            <option value="">All Status</option>
                            <option value="Success">Paid</option>
                            <option value="Pending">Pending</option>
                        </select>
                        
                        <button type="button" class="btn btn-primary" id="btn-load-payment-history" onclick="loadPaymentHistory()">🔍 Load Records</button>
                        <button class="btn btn-success" onclick="exportPaymentHistory()">📊 Export CSV</button>
                    </div>
                </div>
                
                <div id="payment-history-container" style="margin-top: 20px; display: none;">
                    <h3 style="color: #1ca7e7; margin-bottom: 15px;">Payment Records</h3>
                    <div id="payment-history-list">
                        <!-- Payment records will be loaded here -->
                    </div>
                </div>
                
                <div id="payment-history-status" style="margin-top: 10px; font-weight: 600;"></div>
            </div>
        </div>
    </div>

    <script>
        // Role-based access control
        const userType = localStorage.getItem('userType');
        if (userType !== 'admin') {
            alert('Access denied. This page is for administrators only.');
            window.location.href = 'index.html';
        }
        
        /** Admin APIs accept session cookie and/or Bearer adminToken (see admin-login). */
        function adminApiFetch(url, init) {
            init = init || {};
            var headers = new Headers(init.headers || {});
            var token = (window.RemoedAdminSession && RemoedAdminSession.getAuthToken ? RemoedAdminSession.getAuthToken() : (localStorage.getItem('remoed_admin_token')||localStorage.getItem('remoed_admin_auth')||localStorage.getItem('adminToken')||''));
            if (token) headers.set('Authorization', 'Bearer ' + token);
            return fetch(url, Object.assign({}, init, { credentials: 'include', headers: headers }));
        }

        function apiErrorMessage(data, fallback) {
            if (!data || typeof data !== 'object') return fallback || 'Request failed';
            return data.message || data.error || fallback || 'Request failed';
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.AdminSidebar && typeof AdminSidebar.applyGreetingFromStorage === 'function') {
                AdminSidebar.applyGreetingFromStorage();
            }

            // Display current pay period
            displayCurrentPeriod();
            
            // Load teacher list for filter
            loadTeacherFilterOptions();
        });

        // Global variable to track selected pay period
        // periodKey format: YYYY-MM-1 (1st–15th) or YYYY-MM-2 (16th–end)
        let selectedPeriodKey = null;

        function getPeriodKeyForDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const half = d.getDate() <= 15 ? '1' : '2';
            return `${year}-${month}-${half}`;
        }

        function parsePeriodKey(key) {
            const m = String(key || '').match(/^(\d{4})-(\d{2})-(1|2)$/);
            if (!m) return null;
            return { year: Number(m[1]), month: Number(m[2]), half: Number(m[3]) };
        }

        function getPeriodBounds(key) {
            const p = parsePeriodKey(key);
            if (!p) return null;
            const start = new Date(p.year, p.month - 1, p.half === 1 ? 1 : 16);
            const end = p.half === 1
                ? new Date(p.year, p.month - 1, 15)
                : new Date(p.year, p.month, 0); // last day of month
            return { start, end };
        }

        function displayCurrentPeriod() {
            if (!selectedPeriodKey) {
                selectedPeriodKey = getPeriodKeyForDate(new Date());
            }
            const bounds = getPeriodBounds(selectedPeriodKey);
            if (!bounds) {
                document.getElementById('current-week-display').textContent = 'Invalid period';
                return;
            }
            const { start, end } = bounds;
            const display = `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
            document.getElementById('current-week-display').textContent = display;
        }

        function previousPeriod() {
            if (!selectedPeriodKey) selectedPeriodKey = getPeriodKeyForDate(new Date());
            const p = parsePeriodKey(selectedPeriodKey);
            if (!p) return;

            // Move to previous half-month
            if (p.half === 2) {
                selectedPeriodKey = `${p.year}-${String(p.month).padStart(2, '0')}-1`;
            } else {
                const prevMonthDate = new Date(p.year, p.month - 2, 1);
                const py = prevMonthDate.getFullYear();
                const pm = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
                selectedPeriodKey = `${py}-${pm}-2`;
            }
            displayCurrentPeriod();
            
            // Reload teachers if they were already loaded
            if (document.getElementById('teachers-list-container').style.display !== 'none') {
                loadTeachersSalaries();
            }
        }

        function nextPeriod() {
            if (!selectedPeriodKey) selectedPeriodKey = getPeriodKeyForDate(new Date());
            const p = parsePeriodKey(selectedPeriodKey);
            if (!p) return;

            if (p.half === 1) {
                selectedPeriodKey = `${p.year}-${String(p.month).padStart(2, '0')}-2`;
            } else {
                const nextMonthDate = new Date(p.year, p.month, 1);
                const ny = nextMonthDate.getFullYear();
                const nm = String(nextMonthDate.getMonth() + 1).padStart(2, '0');
                selectedPeriodKey = `${ny}-${nm}-1`;
            }
            displayCurrentPeriod();
            
            // Reload teachers if they were already loaded
            if (document.getElementById('teachers-list-container').style.display !== 'none') {
                loadTeachersSalaries();
            }
        }

        function goToCurrentPeriod() {
            selectedPeriodKey = getPeriodKeyForDate(new Date());
            displayCurrentPeriod();
            
            // Reload teachers if they were already loaded
            if (document.getElementById('teachers-list-container').style.display !== 'none') {
                loadTeachersSalaries();
            }
        }

        async function loadTeachersSalaries() {
            var loadBtn = document.getElementById('btn-load-teachers');
            try {
                if (!selectedPeriodKey) {
                    selectedPeriodKey = getPeriodKeyForDate(new Date());
                }
                if (loadBtn) {
                    loadBtn.disabled = true;
                    loadBtn.textContent = 'Loading…';
                }
                document.getElementById('disbursement-status').textContent = 'Loading teacher payroll…';
                document.getElementById('disbursement-status').style.color = '#64748b';

                const response = await adminApiFetch(`/api/admin/teachers-weekly-salaries?period=${encodeURIComponent(selectedPeriodKey)}`);
                const data = await response.json();
                
                if (response.ok && data.success) {
                    displayTeachersList(data.teachers);
                    document.getElementById('teachers-list-container').style.display = 'block';
                    document.getElementById('dispense-btn').style.display = 'inline-block';
                    
                    // Check if any teachers have been paid
                    const paidTeachers = data.teachers.filter(teacher => teacher.paymentStatus === 'Paid');
                    if (paidTeachers.length > 0) {
                        document.getElementById('dispense-btn').disabled = true;
                        document.getElementById('dispense-btn').textContent = 'Salaries Dispersed';
                        document.getElementById('dispense-btn').style.background = '#95a5a6';
                    } else {
                        document.getElementById('dispense-btn').disabled = false;
                        document.getElementById('dispense-btn').textContent = 'Dispense All Salaries';
                        document.getElementById('dispense-btn').style.background = '#e74c3c';
                    }
                    
                    document.getElementById('disbursement-status').textContent = `Loaded ${data.teachers.length} teachers`;
                    document.getElementById('disbursement-status').style.color = '#27ae60';
                    
                    setTimeout(() => {
                        document.getElementById('disbursement-status').textContent = '';
                    }, 3000);
                } else {
                    alert('Error loading teachers: ' + apiErrorMessage(data, 'Please sign in again or refresh.'));
                }
            } catch (error) {
                console.error('Error loading teachers:', error);
                alert('Error loading teachers. Please try again.');
            } finally {
                if (loadBtn) {
                    loadBtn.disabled = false;
                    loadBtn.textContent = 'Load Teachers';
                }
            }
        }

        function displayTeachersList(teachers) {
            const container = document.getElementById('teachers-list');
            
            if (teachers.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888;">No teachers found</p>';
                return;
            }
            
            const tableHTML = `
                <table class="payroll-table">
                    <thead>
                        <tr>
                            <th>Teacher Account</th>
                            <th>Completed Classes</th>
                            <th>Student Absent</th>
                            <th>Rate per Class</th>
                            <th>Base Fee</th>
                            <th>Bonus / Incentive</th>
                            <th>Student Absent Fee</th>
                            <th>Deductions</th>
                            <th>Net Payable</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${teachers.map(teacher => {
                            const life = teacher.payoutLifecycle || '';
                            let statusText = 'Pending';
                            let statusColor = '#888';
                            if (life === 'disbursed') {
                                statusText = 'Released';
                                statusColor = '#1ca7e7';
                            } else if (life === 'withdrawal_requested') {
                                statusText = 'Processing withdraw';
                                statusColor = '#f59e0b';
                            } else if (life === 'completed' || teacher.paymentStatus === 'Paid') {
                                statusText = life === 'completed' ? '✓ Completed' : '✓ Released';
                                statusColor = '#27ae60';
                            }
                            const totalDeductions = (teacher.lateDeductions || 0) + (teacher.teacherAbsentDeductions || 0);
                            const bonus = Number(teacher.bonusIncentive) || 0;
                            const tid = teacher.teacherCode || teacher.email || '';
                            const mongoId = teacher.teacherId || '';
                            const locked = teacher.paymentStatus === 'Paid';
                            
                            return `
                                <tr data-teacher-code="${tid}" data-mongo-id="${mongoId}">
                                    <td>${teacher.email}</td>
                                    <td>${teacher.completedClasses}</td>
                                    <td>${teacher.studentAbsentClasses || 0}</td>
                                    <td>₱${teacher.rate.toFixed(2)}</td>
                                    <td>₱${teacher.baseWeeklyFee.toFixed(2)}</td>
                                    <td>
                                      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                                        <input type="number" min="0" step="0.01" class="bonus-incentive-input"
                                          value="${bonus.toFixed(2)}"
                                          data-teacher-code="${tid}"
                                          data-mongo-id="${mongoId}"
                                          ${locked ? 'readonly disabled' : ''}
                                          style="width:96px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;"
                                          title="Referral bonus, internet aid, or other Founder-approved incentive for this cut-off only" />
                                        ${locked ? '' : `<button type="button" class="btn btn-primary bonus-incentive-save" style="padding:4px 8px;font-size:12px;" data-teacher-code="${tid}" data-mongo-id="${mongoId}">Save</button>`}
                                      </div>
                                    </td>
                                    <td>₱${teacher.studentAbsentPayment.toFixed(2)}</td>
                                    <td style="color: #e74c3c;">-₱${totalDeductions.toFixed(2)}</td>
                                    <td style="font-weight: 600; color: #27ae60;" class="net-payable-cell">₱${teacher.weeklySalary.toFixed(2)}</td>
                                    <td style="color: ${statusColor}; font-weight: 600;">${statusText}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
                <p style="margin:10px 0 0;color:#64748b;font-size:0.82rem;">
                  <strong>Bonus / Incentive</strong> is not monthly pay. Enter referral or other Founder-approved amounts for this cut-off only, then Save. Included in Net Payable and Teaching Fee / payslip.
                </p>
            `;
            
            container.innerHTML = tableHTML;
            container.querySelectorAll('.bonus-incentive-save').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    saveTeacherBonusIncentive(btn);
                });
            });
        }

        async function saveTeacherBonusIncentive(btn) {
            const row = btn.closest('tr');
            const input = row && row.querySelector('.bonus-incentive-input');
            if (!input || !selectedPeriodKey) return;
            const amount = Math.max(0, Number(input.value) || 0);
            const teacherCode = btn.getAttribute('data-teacher-code') || '';
            const mongoId = btn.getAttribute('data-mongo-id') || '';
            const prev = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Saving…';
            try {
                const response = await adminApiFetch('/api/admin/teacher-period-incentive', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        periodKey: selectedPeriodKey,
                        amount: amount,
                        teacherCode: teacherCode,
                        mongoId: mongoId,
                        note: ''
                    })
                });
                const data = await response.json().catch(function () { return {}; });
                if (!response.ok || !data.success) {
                    throw new Error(apiErrorMessage(data, 'Could not save bonus/incentive'));
                }
                document.getElementById('disbursement-status').textContent = 'Bonus/Incentive saved for ' + (teacherCode || 'teacher');
                document.getElementById('disbursement-status').style.color = '#27ae60';
                await loadTeachersSalaries();
            } catch (err) {
                alert(err.message || 'Save failed');
            } finally {
                btn.disabled = false;
                btn.textContent = prev;
            }
        }

        async function dispenseAllSalaries() {
            if (!confirm('Are you sure you want to dispense salaries to all teachers? This action cannot be undone.')) {
                return;
            }
            
            try {
                if (!selectedPeriodKey) {
                    selectedPeriodKey = getPeriodKeyForDate(new Date());
                }
                
                const response = await adminApiFetch('/api/admin/dispense-salaries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ period: selectedPeriodKey })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('disbursement-status').textContent = `Successfully dispensed salaries to ${data.dispensedTeachers.length} teachers!`;
                    document.getElementById('disbursement-status').style.color = '#27ae60';
                    
                    // Disable the dispense button
                    document.getElementById('dispense-btn').disabled = true;
                    document.getElementById('dispense-btn').textContent = 'Salaries Dispersed';
                    document.getElementById('dispense-btn').style.background = '#95a5a6';
                    
                    // Reload the teachers list
                    setTimeout(() => {
                        loadTeachersSalaries();
                    }, 1000);
                    
                    setTimeout(() => {
                        document.getElementById('disbursement-status').textContent = '';
                    }, 5000);
                } else {
                    alert('Error dispensing salaries: ' + data.message);
                }
            } catch (error) {
                console.error('Error dispensing salaries:', error);
                alert('Error dispensing salaries. Please try again.');
            }
        }

        // Payment History Management Functions
        async function loadTeacherFilterOptions() {
            try {
                console.log('🔍 Loading teacher filter options...');
                
                const response = await adminApiFetch('/api/admin/teachers-filter-list');
                console.log('🔍 Teachers list response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('🔍 Teachers list data:', data);
                
                if (data.success) {
                    const teacherFilter = document.getElementById('teacher-filter');
                    teacherFilter.innerHTML = '<option value="">All Teachers</option>';
                    
                    data.teachers.forEach(teacher => {
                        const option = document.createElement('option');
                        option.value = teacher.email;
                        option.textContent = teacher.email;
                        teacherFilter.appendChild(option);
                    });
                    
                    console.log(`✅ Loaded ${data.teachers.length} teachers for filter dropdown`);
                } else {
                    console.error('❌ Failed to load teachers list:', data.message);
                }
            } catch (error) {
                console.error('❌ Error loading teacher filter options:', error);
            }
        }

        async function loadPaymentHistory() {
            var recBtn = document.getElementById('btn-load-payment-history');
            try {
                if (recBtn) {
                    recBtn.disabled = true;
                    recBtn.textContent = 'Loading…';
                }
                document.getElementById('payment-history-status').textContent = 'Loading payment records…';
                document.getElementById('payment-history-status').style.color = '#64748b';

                const teacherFilter = document.getElementById('teacher-filter').value;
                const statusFilter = document.getElementById('status-filter').value;
                
                let url = '/api/admin/payment-history';
                const params = new URLSearchParams();
                
                if (teacherFilter) params.append('teacherEmail', teacherFilter);
                if (statusFilter) params.append('status', statusFilter);
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                console.log('🔍 Making request to:', url);
                
                const response = await adminApiFetch(url);
                console.log('🔍 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('🔍 Response data:', data);
                
                if (data.success) {
                    displayPaymentHistory(data.payments);
                    document.getElementById('payment-history-container').style.display = 'block';
                    document.getElementById('payment-history-status').textContent = `Loaded ${data.payments.length} payment records`;
                    document.getElementById('payment-history-status').style.color = '#27ae60';
                    
                    setTimeout(() => {
                        document.getElementById('payment-history-status').textContent = '';
                    }, 3000);
                } else {
                    const errorMessage = data.message || 'Unknown error occurred';
                    console.error('❌ API Error:', errorMessage);
                    alert('Error loading payment history: ' + errorMessage);
                }
            } catch (error) {
                console.error('❌ Error loading payment history:', error);
                alert('Error loading payment history: ' + error.message);
            } finally {
                if (recBtn) {
                    recBtn.disabled = false;
                    recBtn.textContent = '🔍 Load Records';
                }
            }
        }

        function displayPaymentHistory(payments) {
            const container = document.getElementById('payment-history-list');
            
            if (payments.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888;">No payment records found</p>';
                return;
            }
            
            const tableHTML = `
                <table class="payroll-table">
                    <thead>
                        <tr>
                            <th>Teacher</th>
                            <th>Period</th>
                            <th>Issue Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${payments.map(payment => {
                            const st = String(payment.status || '');
                            let statusText = '⏳ Pending';
                            let statusColor = '#f39c12';
                            if (st === 'Success' || st === 'COMPLETED' || st === 'Completed') {
                                statusText = '✅ Completed';
                                statusColor = '#27ae60';
                            } else if (st === 'DISBURSED' || st === 'Disbursed') {
                                statusText = 'Released';
                                statusColor = '#1ca7e7';
                            } else if (st === 'WITHDRAWAL_REQUESTED' || st === 'WithdrawalRequested') {
                                statusText = 'Processing withdraw';
                                statusColor = '#f59e0b';
                            }
                            const canComplete = st === 'WITHDRAWAL_REQUESTED' || st === 'WithdrawalRequested';
                            const masked = payment.payoutReference && payment.payoutReference.maskedAccountNumber
                                ? payment.payoutReference.maskedAccountNumber
                                : '';
                            
                            return `
                                <tr>
                                    <td>${payment.teacherEmail || payment.teacherUsername || 'N/A'}</td>
                                    <td>${payment.period || payment.duration || 'N/A'}${masked ? '<br><span style="font-size:0.75rem;color:#94a3b8;">MariBank ' + masked + '</span>' : ''}</td>
                                    <td>${payment.issueDate ? new Date(payment.issueDate).toLocaleDateString('en-US', { 
                                        month: 'short', 
                                        day: 'numeric', 
                                        year: 'numeric' 
                                    }) : 'N/A'}</td>
                                    <td style="font-weight: 600; color: #e74c3c;">₱${(payment.amount || 0).toFixed(2)}</td>
                                    <td style="color: ${statusColor}; font-weight: 600;">${statusText}</td>
                                    <td>
                                        ${canComplete ? `<button class="btn btn-success" style="padding: 4px 8px; font-size: 12px; margin-right: 5px; border-radius:6px;" onclick="completeTeacherPayment('${payment._id}')">Mark Completed</button>` : ''}
                                        <button class="btn btn-primary" style="padding: 4px 8px; font-size: 12px; margin-right: 5px;" onclick="editPayment('${payment._id}')">✏️ Edit</button>
                                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deletePayment('${payment._id}')">🗑️ Delete</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHTML;
        }

        async function completeTeacherPayment(paymentId) {
            if (!confirm('Mark this MariBank payout as completed? Only do this after the bank transfer is done.')) return;
            try {
                const response = await adminApiFetch('/api/admin/payroll/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    throw new Error(apiErrorMessage(data, 'Could not mark completed'));
                }
                alert(data.message || 'Marked completed');
                if (typeof loadPaymentHistory === 'function') loadPaymentHistory();
            } catch (e) {
                alert(e.message || 'Complete failed');
            }
        }

        async function editPayment(paymentId) {
            try {
                // First, get the payment details
                const response = await adminApiFetch(`/api/admin/payment/${paymentId}`);
                const data = await response.json();
                
                if (!data.success) {
                    alert('Error loading payment details: ' + data.message);
                    return;
                }
                
                const payment = data.payment;
                
                // Create edit form
                const newAmount = prompt(`Edit payment amount for ${payment.teacherEmail || 'Teacher'} (Period: ${payment.period || payment.duration || 'N/A'})\n\nCurrent amount: ₱${(payment.amount || 0).toFixed(2)}\n\nEnter new amount:`, (payment.amount || 0).toFixed(2));
                
                if (newAmount === null) return; // User cancelled
                
                const amount = parseFloat(newAmount);
                if (isNaN(amount) || amount < 0) {
                    alert('Please enter a valid amount (positive number)');
                    return;
                }
                
                // Update the payment
                const updateResponse = await adminApiFetch(`/api/admin/payment/${paymentId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount })
                });
                
                const updateData = await updateResponse.json();
                
                if (updateData.success) {
                    alert(`Payment updated successfully!\nNew amount: ₱${amount.toFixed(2)}`);
                    loadPaymentHistory(); // Reload the list
                } else {
                    alert('Error updating payment: ' + updateData.message);
                }
            } catch (error) {
                console.error('Error editing payment:', error);
                alert('Error editing payment. Please try again.');
            }
        }

        async function deletePayment(paymentId) {
            if (!confirm('Are you sure you want to delete this payment record? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await adminApiFetch(`/api/admin/payment/${paymentId}/delete`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Payment record deleted successfully!');
                    loadPaymentHistory(); // Reload the list
                } else {
                    alert('Error deleting payment: ' + data.message);
                }
            } catch (error) {
                console.error('Error deleting payment:', error);
                alert('Error deleting payment. Please try again.');
            }
        }

        async function exportPaymentHistory() {
            try {
                const teacherFilter = document.getElementById('teacher-filter').value;
                const statusFilter = document.getElementById('status-filter').value;
                
                let url = '/api/admin/payment-history/export';
                const params = new URLSearchParams();
                
                if (teacherFilter) params.append('teacherEmail', teacherFilter);
                if (statusFilter) params.append('status', statusFilter);
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const response = await adminApiFetch(url);
                if (!response.ok) {
                    const errText = await response.text().catch(() => '');
                    alert('Export failed: HTTP ' + response.status + (errText ? ' — ' + errText.slice(0, 120) : ''));
                    return;
                }
                const blob = await response.blob();
                
                // Create download link
                const url2 = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url2;
                a.download = `payment_history_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url2);
                document.body.removeChild(a);
                
                document.getElementById('payment-history-status').textContent = 'Payment history exported successfully!';
                document.getElementById('payment-history-status').style.color = '#27ae60';
                
                setTimeout(() => {
                    document.getElementById('payment-history-status').textContent = '';
                }, 3000);
            } catch (error) {
                console.error('Error exporting payment history:', error);
                alert('Error exporting payment history. Please try again.');
            }
        }
    </script>
