<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-admin-messages">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-sidebar.js"></script>
        <script>AdminSidebar.render('admin-sidebar-root', 'messages');</script>
        <div class="remoed-content">
            <div class="messenger" id="messenger">
                <aside class="chat-list">
                    <div class="chat-list-header"><h1>Messages</h1></div>
                    <div class="chat-search"><input id="msg-search" placeholder="Search by user ID or name..." /></div>
                    <div id="msg-status" style="padding:8px 16px;color:#64748b;font-size:0.82rem;">Loading users...</div>
                    <div class="chat-items" id="chat-items">
                        <div style="padding:16px;color:#64748b;">Loading users...</div>
                    </div>
                </aside>
                <section class="chat-pane">
                    <div class="chat-pane-header">
                        <div class="avatar" id="pane-avatar">?</div>
                        <div class="pane-title">
                            <div class="name" id="pane-name">Select a user</div>
                            <div class="sub" id="pane-sub">Search and click a user to start messaging.</div>
                        </div>
                    </div>
                    <div class="chat-scroll" id="chat-scroll">
                        <div class="empty-pane">Choose a user from the left to open conversation.</div>
                    </div>
                    <div class="composer" id="composer" style="display:none;">
                        <textarea id="composer-text" placeholder="Type a message..."></textarea>
                        <button class="send-btn" id="send-btn">Send</button>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var token = localStorage.getItem('adminToken');
            if (!token) {
                window.location.href = (function(){ try { var p = localStorage.getItem('remoedAdminEntryPath'); if (p && p.charAt(0) === '/') return p; } catch(e){} return 'index.html'; })();
                return;
            }
            if (window.AdminSidebar && typeof AdminSidebar.applyGreetingFromStorage === 'function') {
                AdminSidebar.applyGreetingFromStorage();
            }

            var me = 'admin:' + String(localStorage.getItem('adminUsername') || 'admin').toLowerCase();
            var searchInput = document.getElementById('msg-search');
            var statusEl = document.getElementById('msg-status');
            var chatItemsEl = document.getElementById('chat-items');
            var chatScrollEl = document.getElementById('chat-scroll');
            var paneAvatarEl = document.getElementById('pane-avatar');
            var paneNameEl = document.getElementById('pane-name');
            var paneSubEl = document.getElementById('pane-sub');
            var composerEl = document.getElementById('composer');
            var composerTextEl = document.getElementById('composer-text');
            var sendBtnEl = document.getElementById('send-btn');
            var debounceTimer = null;
            var users = [];
            var activeUser = null;

            function esc(s) {
                if (s == null) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            }

            function fmtDate(ts) {
                if (!ts) return '—';
                var d = new Date(ts);
                if (isNaN(d.getTime())) return '—';
                return d.toLocaleString();
            }

            function fmtShort(ts) {
                if (!ts) return '';
                var d = new Date(ts);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function renderUserList(rows) {
                if (!rows || !rows.length) {
                    chatItemsEl.innerHTML = '<div style="padding:16px;color:#64748b;">No result found.</div>';
                    return;
                }
                chatItemsEl.innerHTML = rows.map(function (u) {
                    var initial = (u.name || 'U')[0].toUpperCase();
                    var active = activeUser && String(activeUser.userId) === String(u.userId) ? 'active' : '';
                    return (
                        '<div class="chat-item ' + active + '" data-user-id="' + esc(u.userId) + '">' +
                        '  <div class="avatar">' + esc(initial) + '</div>' +
                        '  <div class="chat-item-main">' +
                        '    <div class="chat-item-top"><div class="chat-name">' + esc(u.name || u.userId) + '</div><div class="chat-time">' + esc(fmtShort(u.lastMessageAt)) + '</div></div>' +
                        '    <div class="chat-type">' + esc((u.userType || '').toUpperCase()) + ' • ' + esc(u.userId || '') + '</div>' +
                        '    <div class="chat-snippet">' + esc(u.lastMessage || 'No messages yet') + '</div>' +
                        '  </div>' +
                        '</div>'
                    );
                }).join('');
                chatItemsEl.querySelectorAll('.chat-item').forEach(function (el) {
                    el.addEventListener('click', function () {
                        var uid = el.getAttribute('data-user-id');
                        var user = users.find(function (x) { return String(x.userId) === String(uid); });
                        if (user) openConversation(user);
                    });
                });
            }

            async function loadUsers() {
                var q = (searchInput.value || '').trim();
                statusEl.textContent = 'Loading...';
                try {
                    var url = '/api/admin/messages/users';
                    if (q) url += '?q=' + encodeURIComponent(q);
                    var res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
                    if (res.status === 404) {
                        // Fallback for servers not yet restarted with /messages/users route.
                        var fallbackRows = await loadUsersFallback(q);
                        users = fallbackRows;
                        statusEl.textContent = fallbackRows.length + ' user(s)';
                        renderUserList(fallbackRows);
                        return;
                    }
                    var data = await res.json().catch(function () { return {}; });
                    if (!res.ok) throw new Error(data.message || data.error || 'Failed to load users');
                    var rows = Array.isArray(data.users) ? data.users : [];
                    users = rows;
                    statusEl.textContent = rows.length + ' user(s)';
                    renderUserList(rows);
                } catch (e) {
                    statusEl.textContent = e.message || String(e);
                    chatItemsEl.innerHTML = '<div style="padding:16px;color:#64748b;">Failed to load users.</div>';
                }
            }

            async function loadUsersFallback(q) {
                var headers = { Authorization: 'Bearer ' + token };
                var responses = await Promise.all([
                    fetch('/api/admin/teachers-list', { headers: headers }),
                    fetch('/api/admin/students-list', { headers: headers })
                ]);
                var tRes = responses[0];
                var sRes = responses[1];
                var teachers = tRes.ok ? await tRes.json().catch(function () { return []; }) : [];
                var students = sRes.ok ? await sRes.json().catch(function () { return []; }) : [];

                var rows = [];
                (Array.isArray(teachers) ? teachers : []).forEach(function (t) {
                    var name = ((t.firstName || '') + ' ' + (t.lastName || '')).trim() || t.fullname || t.username || t.teacherId || 'Teacher';
                    rows.push({
                        userType: 'teacher',
                        userId: t.teacherId || t.username || '',
                        username: t.username || '',
                        name: name,
                        email: t.email || '',
                        lastMessage: '',
                        lastMessageAt: null
                    });
                });
                (Array.isArray(students) ? students : []).forEach(function (s) {
                    var name = ((s.firstName || '') + ' ' + (s.lastName || '')).trim() || s.username || 'Student';
                    rows.push({
                        userType: 'student',
                        userId: s.username || '',
                        username: s.username || '',
                        name: name,
                        email: s.email || '',
                        lastMessage: '',
                        lastMessageAt: null
                    });
                });

                var needle = String(q || '').trim().toLowerCase();
                if (!needle) return rows;
                return rows.filter(function (u) {
                    var hay = (u.userId + ' ' + u.username + ' ' + u.name + ' ' + u.email + ' ' + u.userType).toLowerCase();
                    return hay.indexOf(needle) !== -1;
                });
            }

            function triggerDebouncedLoad() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(loadUsers, 220);
            }

            function renderMessages(messages) {
                if (!messages || !messages.length) {
                    chatScrollEl.innerHTML = '<div class="empty-pane">No messages yet. Start the conversation.</div>';
                    return;
                }
                chatScrollEl.innerHTML = messages.map(function (m) {
                    var isMe = String(m.senderId || '') === String(me);
                    return (
                        '<div class="message-wrap">' +
                        '  <div class="bubble ' + (isMe ? 'message-sent' : 'message-received') + '">' + esc(m.message || '') + '</div>' +
                        '  <div class="bubble-meta ' + (isMe ? 'meta-sent' : 'meta-received') + '">' + esc(fmtDate(m.createdAt)) + '</div>' +
                        '</div>'
                    );
                }).join('');
                chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
            }

            async function openConversation(user) {
                activeUser = user;
                paneNameEl.textContent = user.name || user.userId;
                paneSubEl.textContent = (user.userType || 'user') + ' • ' + (user.userId || '');
                paneAvatarEl.textContent = (user.name || user.userId || 'U')[0].toUpperCase();
                composerEl.style.display = '';
                renderUserList(users);

                var res = await fetch('/api/admin/messages/thread/' + encodeURIComponent(user.userId), {
                    headers: { Authorization: 'Bearer ' + token }
                });
                var data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error(data.message || data.error || 'Failed to load messages');
                renderMessages(Array.isArray(data.messages) ? data.messages : []);
            }

            async function sendMessage() {
                if (!activeUser) return;
                var msg = String(composerTextEl.value || '').trim();
                if (!msg) return;
                sendBtnEl.disabled = true;
                var res = await fetch('/api/admin/messages/send', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipientId: activeUser.userId, message: msg })
                });
                var data = await res.json().catch(function () { return {}; });
                sendBtnEl.disabled = false;
                if (!res.ok || !data.success) throw new Error(data.message || data.error || 'Failed to send');
                composerTextEl.value = '';
                await openConversation(activeUser);
                await loadUsers();
            }

            searchInput.addEventListener('input', triggerDebouncedLoad);
            searchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loadUsers();
                }
            });
            sendBtnEl.addEventListener('click', function () {
                sendMessage().catch(function (e) { alert(e.message || String(e)); });
            });
            composerTextEl.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage().catch(function (err) { alert(err.message || String(err)); });
                }
            });

            loadUsers();
        })();
    </script>
</body>
</html>
