<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Growth</title>
  <style>
    :root { --ink:#1a365d; --muted:#64748b; --line:#e2e8f0; --blue:#1ca7e7; --teal:#0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; color: var(--ink); background: #f8fafc; }
    .page { padding: 16px; }
    h1 { margin: 0 0 4px; font-size: 1.25rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .err { color: #b91c1c; font-weight: 700; }
    .chart { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
    .chart h2 { margin: 0 0 10px; font-size: 0.95rem; }
    .bar-row { display: grid; grid-template-columns: 140px 1fr 36px; gap: 8px; align-items: center; margin: 6px 0; font-size: 0.85rem; }
    .track { height: 14px; background: #e8f4fd; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #1ca7e7, #0f766e); border-radius: 999px; min-width: 0; }
    .fill.soft { background: #94a3b8; }
    .cols { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .col { flex: 0 0 200px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
    .col h3 { margin: 0 0 8px; font-size: 0.85rem; display: flex; justify-content: space-between; }
    .count { background: #e8f4fd; color: #0369a1; border-radius: 999px; padding: 0 8px; font-size: 0.75rem; }
    .card { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    button, select, input, textarea { font: inherit; }
    button { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
    button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    input, select, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; margin: 4px 0 8px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .thread { max-height: 280px; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    .bubble { margin: 6px 0; padding: 8px 10px; border-radius: 10px; max-width: 80%; }
    .bubble.in { background: #e8f4fd; }
    .bubble.out { background: #ecfdf5; margin-left: auto; }
    .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    table.leads { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    table.leads th, table.leads td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; vertical-align: top; }
    table.leads th { background: #f8fafc; font-size: 0.8rem; }
    .interactive-count { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0 0; font-size: 1rem; }
    .interactive-count strong { display: block; font-size: 0.95rem; }
    .interactive-count span { font-size: 1.75rem; font-weight: 800; color: var(--teal); }
    @media (max-width: 800px) { .split { grid-template-columns: 1fr; } .bar-row { grid-template-columns: 110px 1fr 28px; } }
  </style>
</head>
<body>
  <div class="page" id="app">Loading…</div>
  <script src="js/admin-session.js"></script>
  <script>
    var tab = new URLSearchParams(location.search).get('tab') || 'leads';  
    function token() {
      try {
        if (window.RemoedAdminSession && RemoedAdminSession.getAuthToken) {
          var t = RemoedAdminSession.getAuthToken();
          if (t) return t;
        }
      } catch (e) {}
      return localStorage.getItem('remoed_admin_token') || localStorage.getItem('adminToken') || '';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    async function api(path, opts) {
      var res = await fetch(path, Object.assign({
        headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' }
      }, opts || {}));
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || data.success === false) {
        var err = new Error(data.error || data.message || ('Request failed (' + res.status + ')'));
        err.status = res.status;
        throw err;
      }
      return data;
    }
    function bars(title, rows, empty) {
      var max = rows.reduce(function (m, r) { return Math.max(m, r.count); }, 0);
      var body = rows.length ? rows.map(function (r) {
        var pct = max ? Math.round((r.count / max) * 100) : 0;
        return '<div class="bar-row"><span>' + esc(r.name) + '</span><div class="track"><div class="fill' + (r.count ? '' : ' soft') + '" style="width:' + (r.count ? Math.max(pct, 4) : 0) + '%"></div></div><strong>' + r.count + '</strong></div>';
      }).join('') : '<p class="muted">' + esc(empty || 'No data yet.') + '</p>';
      return '<section class="chart"><h2>' + esc(title) + '</h2>' + body + '</section>';
    }
    function fail(err) {
      document.getElementById('app').innerHTML = '<p class="err">' + esc(err.message || err) + '</p>';
    }

    function leadDetail(lead) {
      var bits = [];
      if (lead.email) bits.push(lead.email);
      if (lead.phone) bits.push(lead.phone);
      if (lead.source === 'facebook') bits.push(lead.formName || 'Facebook');
      else if (lead.source) bits.push(lead.source);
      return bits.join(' · ');
    }
    async function loadLeads(opts) {
      opts = opts || {};
      var data = await api('/api/admin/growth/leads');
      var stages = data.stages || [];
      var leads = data.leads || [];
      var counts = stages.map(function (stage) {
        return { name: stage, count: leads.filter(function (l) { return l.stage === stage; }).length };
      });
      var sources = {};
      leads.forEach(function (l) { var k = l.source || 'manual'; sources[k] = (sources[k] || 0) + 1; });
      var sourceRows = Object.keys(sources).map(function (name) { return { name: name, count: sources[name] }; })
        .sort(function (a, b) { return b.count - a.count; });
      document.getElementById('app').innerHTML =
        '<h1>Leads</h1><p class="muted">' + leads.length + ' people, including Facebook Page leads. Move a card with the stage menu.</p>' +
        '<button type="button" id="fb-sync">Sync Facebook leads</button><p id="fb-msg" class="muted">' + esc(opts.syncNote || '') + '</p>' +
        bars('Pipeline', counts, 'No leads yet. New assessments, chats, and Facebook forms land in Inquiry.') +
        bars('Where they came from', sourceRows, 'Sources appear after the first lead.') +
        '<div class="cols">' + stages.map(function (stage) {
          var cards = leads.filter(function (l) { return l.stage === stage; }).map(function (l) {
            return '<div class="card"><strong>' + esc(l.name || l.email || 'Lead') + '</strong><br><span class="muted">' + esc(leadDetail(l)) + '</span>' +
              '<select data-move="' + esc(l._id) + '">' + stages.map(function (s) {
                return '<option' + (s === l.stage ? ' selected' : '') + '>' + esc(s) + '</option>';
              }).join('') + '</select></div>';
          }).join('') || '<p class="muted">Empty</p>';
          var n = leads.filter(function (l) { return l.stage === stage; }).length;
          return '<div class="col"><h3>' + esc(stage) + ' <span class="count">' + n + '</span></h3>' + cards + '</div>';
        }).join('') + '</div>';
      document.querySelectorAll('[data-move]').forEach(function (sel) {
        sel.addEventListener('change', async function () {
          try {
            await api('/api/admin/growth/leads/' + encodeURIComponent(sel.getAttribute('data-move')), {
              method: 'PATCH', body: JSON.stringify({ stage: sel.value })
            });
            loadLeads({ skipSync: true }).catch(fail);
          } catch (err) { fail(err); }
        });
      });
      document.getElementById('fb-sync').addEventListener('click', function () {
        syncFacebookLeads();
      });
      if (!opts.skipSync) syncFacebookLeads();
    }
    async function syncFacebookLeads() {
      var btn = document.getElementById('fb-sync');
      var msg = document.getElementById('fb-msg');
      if (!btn || !msg) return;
      btn.disabled = true;
      msg.textContent = 'Syncing Facebook leads…';
      try {
        var synced = await api('/api/marketing/facebook-leads');
        var note = 'Synced ' + (synced.synced || 0) + ' from ' + (synced.forms || 0) + ' form' + ((synced.forms === 1) ? '' : 's') + '.';
        await loadLeads({ skipSync: true, syncNote: note });
      } catch (err) {
        msg.textContent = err.message || String(err);
        btn.disabled = false;
      }
    }

    function when(value) {
      if (!value) return '';
      var date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('en-PH', { timeZone: 'Asia/Manila' });
    }
    async function loadInbox() {
      var data = await api('/api/admin/growth/inbox');
      var rows = (data.conversations || []).filter(function (c) { return c.channel === 'messenger'; });
      document.getElementById('app').innerHTML =
        '<h1>Messages</h1><p class="muted">Facebook Page conversations. A reply is sent to that person and saved in this thread.</p>' +
        '<div class="split"><div id="inbox-list">' + (rows.length ? rows.map(function (c) {
          return '<button type="button" class="ghost" style="display:block;width:100%;text-align:left;margin-bottom:8px;" data-open="' + esc(c._id) + '"><strong>Messenger</strong> · ' + esc(c.status) + '<br><span class="muted">' + esc(when(c.lastMessageAt)) + '</span></button>';
        }).join('') : '<p class="muted">No Page messages yet. They show up when someone messages the RemoEd Facebook Page.</p>') +
        '</div><div><div class="thread" id="thread"><p class="muted">Choose a conversation.</p></div><textarea id="reply" rows="3" placeholder="Write a reply"></textarea><button type="button" id="send-reply" disabled>Send reply</button><p id="reply-msg" class="muted"></p></div></div>';
      var current = '';
      async function openThread(id) {
        current = id;
        document.getElementById('send-reply').disabled = false;
        var msgs = await api('/api/admin/growth/inbox/' + encodeURIComponent(id) + '/messages');
        var list = msgs.messages || [];
        document.getElementById('thread').innerHTML = list.length ? list.map(function (m) {
          return '<div class="bubble ' + (m.direction === 'out' ? 'out' : 'in') + '">' + esc(m.text) + '</div>';
        }).join('') : '<p class="muted">No messages in this thread yet.</p>';
      }
      document.querySelectorAll('[data-open]').forEach(function (btn) {
        btn.addEventListener('click', function () { openThread(btn.getAttribute('data-open')).catch(fail); });
      });
      document.getElementById('send-reply').addEventListener('click', async function () {
        var text = document.getElementById('reply').value.trim();
        if (!current || !text) return;
        var replyMsg = document.getElementById('reply-msg');
        replyMsg.textContent = 'Sending…';
        try {
          await api('/api/marketing/messenger/reply', {
            method: 'POST', body: JSON.stringify({ conversationId: current, text: text })
          });
          document.getElementById('reply').value = '';
          replyMsg.textContent = '';
          await openThread(current);
        } catch (err) {
          replyMsg.textContent = err.message || String(err);
        }
      });
    }

    function accountLine(accounts, platform, fallback) {
      var row = (accounts || []).filter(function (a) { return a.platform === platform; })[0] || {};
      if (row.connected) return '<strong>' + esc(row.accountName || platform) + '</strong> · connected';
      return esc(fallback);
    }
    async function loadPosts() {
      var data = await api('/api/admin/growth/posts');
      var social = await api('/api/admin/growth/social-accounts');
      var rows = data.posts || [];
      var accounts = social.accounts || [];
      var byStatus = ['draft', 'scheduled', 'published', 'failed', 'manual'].map(function (name) {
        return { name: name, count: rows.filter(function (p) { return p.status === name; }).length };
      });
      var flash = '';
      try {
        flash = sessionStorage.getItem('remoed_meta_connect') || '';
        if (flash) sessionStorage.removeItem('remoed_meta_connect');
      } catch (e) {}
      var fb = accounts.filter(function (a) { return a.platform === 'facebook'; })[0] || {};
      var fbConnected = !!fb.connected;
      var fbNote = !social.facebookAppReady
        ? 'The server still needs FACEBOOK_APP_ID and FACEBOOK_APP_SECRET.'
        : (fbConnected
          ? 'RemoEd PH is connected. A post you publish below goes to that Page.'
          : 'Open Facebook as an admin of the RemoEd PH Page and allow the Page permissions. Your RemoEd email does not connect the Page by itself.');
      document.getElementById('app').innerHTML =
        '<h1>Posts</h1>' +
        (flash ? '<p class="muted">' + esc(flash) + '</p>' : '') +
        '<section class="chart"><h2>Facebook Page</h2>' +
        '<p>Facebook · ' + accountLine(accounts, 'facebook', 'not connected') + '</p>' +
        '<div class="row-actions">' +
        (fbConnected
          ? '<button type="button" class="ghost" id="meta-connect">Reconnect</button><button type="button" class="ghost" id="meta-disconnect">Disconnect</button>'
          : '<button type="button" id="meta-connect">Connect Facebook</button>') +
        '</div>' +
        '<p class="muted" id="meta-note">' + fbNote + '</p></section>' +
        bars('Posts by status', byStatus) +
        '<section class="chart"><h2>New post</h2><textarea id="post-body" rows="4" placeholder="Write the post"></textarea>' +
        '<label>Image URL (optional, https)</label><input id="post-image" placeholder="https://…">' +
        '<div class="row-actions"><button type="button" id="post-publish">Publish to Facebook Page</button></div>' +
        '<p id="post-msg" class="muted"></p></section>' +
        (rows.length ? rows.map(function (p) {
          var notes = (p.results || []).map(function (r) {
            return esc(r.platform) + ': ' + esc(r.status) + (r.error ? ' — ' + esc(r.error) : '');
          }).join('<br>');
          return '<div class="card"><strong>' + esc(p.language || 'en') + '</strong> · ' + esc(p.status) +
            (p.affiliateKit ? ' · kit' : '') + '<br>' + esc(p.body) +
            (notes ? '<br><span class="muted">' + notes + '</span>' : '') +
            '<div class="row-actions" style="margin-top:8px;"><button type="button" data-pub="' + esc(p._id) + '">Publish</button></div></div>';
        }).join('') : '<p class="muted">No posts yet.</p>');
      var connectEl = document.getElementById('meta-connect');
      if (connectEl) connectEl.addEventListener('click', async function () {
        var note = document.getElementById('meta-note');
        note.textContent = 'Opening Facebook…';
        try {
          var started = await api('/api/admin/growth/social/meta/start');
          var target = window.top && window.top.location ? window.top : window;
          target.location.href = started.url;
        } catch (err) { note.textContent = err.message || String(err); }
      });
      var disconnectEl = document.getElementById('meta-disconnect');
      if (disconnectEl) disconnectEl.addEventListener('click', async function () {
        if (!window.confirm('Disconnect the Facebook Page from Marketing Hub?')) return;
        await api('/api/admin/growth/social-accounts/disconnect', { method: 'POST', body: JSON.stringify({ platform: 'facebook' }) });
        loadPosts().catch(fail);
      });
      document.getElementById('post-publish').addEventListener('click', async function () {
        var body = document.getElementById('post-body').value.trim();
        var imageUrl = document.getElementById('post-image').value.trim();
        var msg = document.getElementById('post-msg');
        if (!body && !imageUrl) { msg.textContent = 'Write a post or add an image.'; return; }
        msg.textContent = 'Publishing…';
        try {
          var published = await api('/api/marketing/publish-fb', {
            method: 'POST',
            body: JSON.stringify({ text: body, imageUrl: imageUrl })
          });
          msg.textContent = published.id ? 'Published. ' + published.id : 'Published.';
          loadPosts().catch(fail);
        } catch (err) { msg.textContent = err.message || String(err); }
      });
      document.querySelectorAll('[data-pub]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          btn.disabled = true;
          await api('/api/admin/growth/posts/' + encodeURIComponent(btn.getAttribute('data-pub')) + '/publish', { method: 'POST', body: '{}' });
          loadPosts().catch(fail);
        });
      });
    }

    async function loadCampaigns() {
      document.getElementById('app').innerHTML =
        '<h1>Campaigns</h1><p class="muted">Sends through Brevo. Every message keeps the unsubscribe link. The daily cap is 300.</p>' +
        '<section class="chart"><h2>Send a campaign</h2>' +
        '<label>Subject</label><input id="c-subject" placeholder="A note from RemoEd">' +
        '<label>Message</label><textarea id="c-html" rows="5" placeholder="Short email body"></textarea>' +
        '<label>Parent emails, one per line</label><textarea id="c-emails" rows="4" placeholder="parent@email.com"></textarea>' +
        '<button type="button" id="c-send">Queue send</button><p id="c-msg" class="muted"></p></section>';
      document.getElementById('c-send').addEventListener('click', async function () {
        var msg = document.getElementById('c-msg');
        var emails = document.getElementById('c-emails').value.split(/[\s,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
        if (!emails.length) { msg.textContent = 'Add at least one email.'; return; }
        msg.textContent = 'Sending…';
        try {
          var data = await api('/api/admin/growth/campaigns/send', {
            method: 'POST',
            body: JSON.stringify({
              subject: document.getElementById('c-subject').value.trim() || 'RemoEd',
              html: document.getElementById('c-html').value.trim(),
              emails: emails
            })
          });
          msg.textContent = 'Queued ' + (data.queued || 0) + '. Skipped ' + (data.skipped || 0) + '.' + (data.reason ? ' ' + data.reason : '');
        } catch (err) { msg.textContent = err.message || String(err); }
      });
    }

    async function loadReports() {
      var data = await api('/api/admin/growth/reports');
      var stages = data.stages || [];
      var sources = data.sources || [];
      var weeks = (data.weeks || []).map(function (w) { return { name: w.label, count: w.count }; });
      var interactiveDone = Number(data.interactiveLessonsCompleted);
      if (!isFinite(interactiveDone) || interactiveDone < 0) interactiveDone = 0;
      document.getElementById('app').innerHTML =
        '<h1>Reports</h1><p class="muted">' + esc(data.note || '') + '</p>' +
        '<p class="interactive-count"><strong>Free interactive lessons completed</strong><span>' + interactiveDone + '</span></p>' +
        bars('Funnel', stages, 'No level assessments yet. They show up here when a family finishes the quiz in HR Hub → Level Assessment.') +
        '<div class="split">' + bars('New assessments by week', weeks) + bars('Source', sources, 'No source mix yet.') + '</div>';
    }

    function loadSpecialist() {
      document.getElementById('app').innerHTML =
        '<h1>RemoEdPH AI Marketing Specialist</h1><p class="muted">Draft a Facebook post, a parent email, or an ad. The copy describes live classes with real teachers.</p>' +
        '<section class="chart"><label>Content type</label>' +
        '<select id="aiContentType"><option>Facebook Group Post</option><option>Parent Email Outreach</option><option>Social Media Ad Copy</option></select>' +
        '<label>Target region</label>' +
        '<select id="aiTargetMarket"><option>Taiwan</option><option>Japan</option><option>South Korea</option><option>General International (Asia)</option></select>' +
        '<label>Key topic</label>' +
        '<textarea id="aiTopicDetails" rows="3" placeholder="Free level assessment, a live one-on-one class, and real teachers."></textarea>' +
        '<div class="row-actions"><button type="button" id="btnGenerateAi">Generate marketing copy</button>' +
        '<button type="button" class="ghost" id="btnCopyText">Copy</button></div>' +
        '<label>Generated copy</label>' +
        '<textarea id="aiOutputBox" rows="8" readonly placeholder="Choose a content type, add the topic, then generate."></textarea>' +
        '<p id="ai-msg" class="muted"></p></section>';
      document.getElementById('btnGenerateAi').addEventListener('click', async function () {
        var btn = document.getElementById('btnGenerateAi');
        var outputBox = document.getElementById('aiOutputBox');
        var msg = document.getElementById('ai-msg');
        var topicDetails = document.getElementById('aiTopicDetails').value.trim();
        msg.textContent = '';
        if (!topicDetails) {
          msg.textContent = 'Add a topic first.';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Generating…';
        outputBox.value = '';
        try {
          var res = await fetch('/api/admin/marketing/ai-generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
            body: JSON.stringify({
              contentType: document.getElementById('aiContentType').value,
              targetMarket: document.getElementById('aiTargetMarket').value,
              topicDetails: topicDetails
            })
          });
          var data = await res.json().catch(function () { return {}; });
          if (data.success) outputBox.value = data.content || '';
          else msg.textContent = data.message || data.error || 'Could not generate the copy.';
        } catch (err) {
          msg.textContent = 'Could not reach the server.';
        }
        btn.disabled = false;
        btn.textContent = 'Generate marketing copy';
      });
      document.getElementById('btnCopyText').addEventListener('click', function () {
        var outputBox = document.getElementById('aiOutputBox');
        var btn = document.getElementById('btnCopyText');
        if (!outputBox.value.trim()) return;
        navigator.clipboard.writeText(outputBox.value).then(function () {
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = 'Copy'; }, 2000);
        }).catch(function () {});
      });
    }

    var runners = { specialist: loadSpecialist, leads: loadLeads, 'facebook-leads': loadLeads, inbox: loadInbox, messages: loadInbox, posts: loadPosts, campaigns: loadCampaigns, reports: loadReports };
    (runners[tab] || loadLeads)().catch(fail);
  </script>
</body>
</html>
