<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Chrome Debug</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-test-login">
    <div class="test-form">
        <h2>Chrome Login Test</h2>
        <p>This page helps debug login issues in Chrome.</p>
        
        <form id="test-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
        </div>
            <button type="submit" id="submit-btn">Test Login</button>
        </form>
        
        <div id="result" class="result" style="display: none;"></div>
        
        <div style="margin-top: 20px;">
            <h3>Test Results:</h3>
            <div id="test-results"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('test-form');
        const result = document.getElementById('result');
        const testResults = document.getElementById('test-results');
        const submitBtn = document.getElementById('submit-btn');

        function showResult(message, type = 'info') {
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }

        function addTestResult(test, status, details = '') {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${test}:</strong> <span style="color: ${status === 'PASS' ? 'green' : 'red'}">${status}</span>${details ? ` - ${details}` : ''}`;
            testResults.appendChild(div);
        }

        // Test server connectivity
        async function testServerConnectivity() {
            try {
                const response = await fetch('/api/health');
                addTestResult('Server Connectivity', 'PASS', `Status: ${response.status}`);
                return true;
            } catch (error) {
                addTestResult('Server Connectivity', 'FAIL', error.message);
                return false;
            }
        }

        // Test fetch API
        async function testFetchAPI() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'test', password: 'test' })
                });
                addTestResult('Fetch API', 'PASS', `Status: ${response.status}`);
                return true;
            } catch (error) {
                addTestResult('Fetch API', 'FAIL', error.message);
                return false;
            }
        }

        // Test localStorage
        function testLocalStorage() {
            try {
                localStorage.setItem('test', 'value');
                const value = localStorage.getItem('test');
                localStorage.removeItem('test');
                if (value === 'value') {
                    addTestResult('LocalStorage', 'PASS');
                    return true;
                } else {
                    addTestResult('LocalStorage', 'FAIL', 'Value not stored correctly');
                    return false;
                }
            } catch (error) {
                addTestResult('LocalStorage', 'FAIL', error.message);
                return false;
            }
        }

        // Run all tests
        async function runTests() {
            testResults.innerHTML = '';
            addTestResult('Browser', 'INFO', navigator.userAgent);
            
            await testServerConnectivity();
            await testFetchAPI();
            testLocalStorage();
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Testing...';
            
            showResult('Testing login...', 'info');
            
            try {
                console.log('Testing login with:', { username, password });
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.success) {
                    showResult(`Login successful!\nToken: ${data.token.substring(0, 20)}...\nTeacher ID: ${data.teacherId}`, 'success');
                } else {
                    showResult(`Login failed: ${data.message}`, 'error');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showResult(`Error: ${error.message}`, 'error');
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = 'Test Login';
        });

        // Run tests on page load
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
