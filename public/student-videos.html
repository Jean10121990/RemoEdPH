<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/security-guard.js?v=1"></script>
  <title>Video library - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
  <link rel="stylesheet" href="css/teacher-sidebar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/student-portal-layout.css">
  <link rel="stylesheet" href="css/student-sidebar.css">
  <script src="js/user-session.js"></script>
  <style>
    .page-student-videos .sv-wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 32px; }
    .page-student-videos .sv-hero {
      margin-bottom: 1.5rem;
      padding: 1.25rem 1.35rem;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(90, 103, 216, 0.12) 0%, rgba(129, 140, 248, 0.08) 100%);
      border: 1px solid rgba(90, 103, 216, 0.2);
    }
    .page-student-videos .sv-hero h1 {
      margin: 0 0 0.35rem;
      font-size: 1.65rem;
      font-weight: 800;
      color: #4338ca;
    }
    .page-student-videos .sv-hero p { margin: 0; color: #4b5563; line-height: 1.55; font-size: 0.95rem; }
    .page-student-videos .sv-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .page-student-videos .sv-refresh {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid #c7d2fe;
      background: #fff;
      color: #4338ca;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .page-student-videos .sv-refresh:hover { background: #eef2ff; }
    .page-student-videos .sv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .page-student-videos .sv-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-student-videos .sv-card-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      cursor: pointer;
    }
    .page-student-videos .sv-card-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      vertical-align: top;
    }
    .page-student-videos .sv-card-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.35);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .page-student-videos .sv-card-thumb:hover .sv-card-play { opacity: 1; }
    .page-student-videos .sv-card-play span {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #4338ca;
      font-size: 1.35rem;
      line-height: 56px;
      text-align: center;
      padding-left: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .page-student-videos .sv-card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
    .page-student-videos .sv-card-title { font-weight: 800; font-size: 1.05rem; color: #1e293b; margin: 0 0 6px; line-height: 1.3; }
    .page-student-videos .sv-card-desc { font-size: 0.88rem; color: #64748b; margin: 0 0 12px; line-height: 1.45; flex: 1; }
    .page-student-videos .sv-card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .page-student-videos .sv-btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
    }
    .page-student-videos .sv-btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; }
    .page-student-videos .sv-btn-ghost { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .page-student-videos .sv-empty, .page-student-videos .sv-error, .page-student-videos .sv-loading {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #64748b;
      font-size: 1rem;
    }
    .page-student-videos .sv-error { color: #be123c; }
    #sv-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(15, 23, 42, 0.82);
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    #sv-modal.sv-open { display: flex; }
    #sv-modal-inner {
      width: 100%;
      max-width: 960px;
      background: #0f172a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    #sv-modal-inner video { width: 100%; max-height: min(78vh, 540px); display: block; vertical-align: top; }
    #sv-modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      font-weight: 300;
    }
    #sv-modal-caption { padding: 12px 16px 16px; background: #1e293b; color: #e2e8f0; }
    #sv-modal-caption h2 { margin: 0 0 6px; font-size: 1.1rem; color: #fff; }
    #sv-modal-caption p { margin: 0; font-size: 0.9rem; color: #94a3b8; line-height: 1.45; }
  </style>
</head>
<body class="student-portal page-student-videos">
  <div class="remoed-main">
    <div id="student-sidebar-root"></div>
    <script src="js/student-sidebar.js"></script>
    <script>StudentSidebar.render('student-sidebar-root', 'videos');</script>
    <div class="remoed-content">
      <div class="sv-wrap">
        <div class="sv-hero">
          <h1>Video library</h1>
          <p>
            Lesson clips and reference videos from your school. Tap a thumbnail to watch in a larger player, or use Watch here on the card.
            Same videos appear in live class under the Videos tab.
          </p>
        </div>
        <div class="sv-toolbar">
          <span class="muted" style="font-size:0.9rem;color:#64748b;">Thumbnails load a preview frame; sound plays when you press play.</span>
          <button type="button" class="sv-refresh" id="sv-refresh">Refresh list</button>
        </div>
        <div id="sv-status" class="sv-loading" role="status">Loading videos…</div>
        <div id="sv-grid" class="sv-grid" style="display:none;" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div id="sv-modal" aria-modal="true" role="dialog" aria-labelledby="sv-modal-title">
    <div id="sv-modal-inner">
      <button type="button" id="sv-modal-close" aria-label="Close">&times;</button>
      <video id="sv-modal-video" controls playsinline preload="metadata"></video>
      <div id="sv-modal-caption">
        <h2 id="sv-modal-title"></h2>
        <p id="sv-modal-desc"></p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function getToken() {
        return localStorage.getItem('studentToken') || localStorage.getItem('token') || '';
      }

      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function thumbSrc(url) {
        if (!url) return '';
        var u = String(url);
        if (u.indexOf('#') !== -1) return u;
        return u + '#t=0.1';
      }

      var gridEl = document.getElementById('sv-grid');
      var statusEl = document.getElementById('sv-status');
      var modal = document.getElementById('sv-modal');
      var modalVideo = document.getElementById('sv-modal-video');
      var modalTitle = document.getElementById('sv-modal-title');
      var modalDesc = document.getElementById('sv-modal-desc');
      var modalClose = document.getElementById('sv-modal-close');

      function closeModal() {
        modal.classList.remove('sv-open');
        try {
          modalVideo.pause();
          modalVideo.removeAttribute('src');
          modalVideo.load();
        } catch (e) {}
      }

      function openModal(url, title, description) {
        if (!url) return;
        modalTitle.textContent = title || 'Video';
        modalDesc.textContent = description || '';
        modalVideo.src = url;
        modal.classList.add('sv-open');
        modalVideo.play().catch(function () {});
      }

      modalClose.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('sv-open')) closeModal();
      });

      function renderVideos(videos) {
        if (!videos.length) {
          statusEl.className = 'sv-empty';
          statusEl.style.display = 'block';
          statusEl.textContent = 'No videos in the library yet. Check back after your team adds lesson clips.';
          gridEl.style.display = 'none';
          gridEl.innerHTML = '';
          return;
        }
        statusEl.style.display = 'none';
        gridEl.style.display = 'grid';
        gridEl.innerHTML = videos.map(function (v) {
          var url = v.url || '';
          var title = v.title || 'Untitled';
          var desc = v.description || '';
          var id = String(v.id || '');
          return (
            '<article class="sv-card" data-video-id="' + escHtml(id) + '">' +
              '<div class="sv-card-thumb" role="button" tabindex="0" data-action="modal" aria-label="Play ' + escHtml(title) + ' larger">' +
                '<video muted playsinline preload="metadata" src="' + escHtml(thumbSrc(url)) + '"></video>' +
                '<div class="sv-card-play" aria-hidden="true"><span>&#9654;</span></div>' +
              '</div>' +
              '<div class="sv-card-body">' +
                '<h2 class="sv-card-title">' + escHtml(title) + '</h2>' +
                (desc ? '<p class="sv-card-desc">' + escHtml(desc) + '</p>' : '<p class="sv-card-desc">&nbsp;</p>') +
                '<div class="sv-card-actions">' +
                  '<button type="button" class="sv-btn sv-btn-primary" data-action="modal">Watch larger</button>' +
                  '<button type="button" class="sv-btn sv-btn-ghost" data-action="scroll">Watch here</button>' +
                '</div>' +
                '<div class="sv-inline-player-wrap" style="margin-top:12px;display:none;">' +
                  '<video class="sv-inline-video" controls playsinline preload="metadata" style="width:100%;border-radius:10px;max-height:240px;background:#000;"></video>' +
                '</div>' +
              '</div>' +
            '</article>'
          );
        }).join('');

        gridEl.querySelectorAll('.sv-card').forEach(function (card) {
          var url = '';
          var title = '';
          var desc = '';
          var tEl = card.querySelector('.sv-card-title');
          var dEl = card.querySelector('.sv-card-desc');
          var thumb = card.querySelector('.sv-card-thumb video');
          if (tEl) title = tEl.textContent || '';
          if (dEl) desc = dEl.textContent.replace(/\u00a0/g, '').trim();
          if (thumb && thumb.getAttribute('src')) {
            url = thumb.getAttribute('src').split('#')[0];
          }

          function onModal() {
            openModal(url, title, desc);
          }

          card.querySelector('.sv-card-thumb').addEventListener('click', onModal);
          card.querySelector('.sv-card-thumb').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              onModal();
            }
          });

          card.querySelectorAll('[data-action="modal"]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              onModal();
            });
          });

          var inlineWrap = card.querySelector('.sv-inline-player-wrap');
          var inlineVideo = card.querySelector('.sv-inline-video');
          var hereBtn = card.querySelector('[data-action="scroll"]');
          hereBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!inlineWrap || !inlineVideo) return;
            var show = inlineWrap.style.display === 'none';
            inlineWrap.style.display = show ? 'block' : 'none';
            hereBtn.textContent = show ? 'Hide player' : 'Watch here';
            if (show) {
              inlineVideo.src = url;
              inlineWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              inlineVideo.play().catch(function () {});
            } else {
              try {
                inlineVideo.pause();
                inlineVideo.removeAttribute('src');
                inlineVideo.load();
              } catch (err) {}
            }
          });
        });
      }

      async function loadVideos() {
        var token = getToken();
        if (!token) {
          window.location.href = 'student-login.html';
          return;
        }
        statusEl.className = 'sv-loading';
        statusEl.style.display = 'block';
        statusEl.textContent = 'Loading videos…';
        gridEl.style.display = 'none';
        try {
          var res = await fetch('/api/student/portal-videos', {
            headers: { Authorization: 'Bearer ' + token },
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok || !data.success) {
            throw new Error(data.message || 'Could not load videos');
          }
          renderVideos(Array.isArray(data.videos) ? data.videos : []);
        } catch (err) {
          statusEl.className = 'sv-error';
          statusEl.style.display = 'block';
          statusEl.textContent = err.message || 'Something went wrong.';
          gridEl.style.display = 'none';
        }
      }

      document.getElementById('sv-refresh').addEventListener('click', loadVideos);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadVideos);
      } else {
        loadVideos();
      }
    })();
  </script>
</body>
</html>
