<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/student-portal-layout.css?v=portal-brand-5">
</head>
<body class="page-forgot-password">
  <div class="forgot-container">
    <div class="remoed-logo">
      <img src="images/remoed-logo-new.png" alt="RemoEdPH Logo" onerror="this.src='images/remoed-logo.png'">
      <div class="brand-text">
        <span class="remoed-title">RemoEdPH</span>
        <div class="remoed-subtitle">Account recovery</div>
      </div>
    </div>

    <div class="forgot-title">Forgot Password</div>
    <p class="forgot-lead">Enter the email for your account. We’ll send a link so you can set a new password right away — we do not email a temporary password.</p>

    <form class="forgot-form" id="forgot-form">
      <label class="forgot-label" for="forgot-email">Email</label>
      <input type="email" id="forgot-email" placeholder="you@example.com" required autocomplete="email">
      <button type="submit" id="forgot-btn">Reset Password</button>
    </form>

    <div class="forgot-message" id="forgot-message" hidden></div>

    <div class="links-container">
      <a class="forgot-return-btn" href="/login/">Return to login</a>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').onsubmit = async function (e) {
      e.preventDefault();
      var emailInput = document.getElementById('forgot-email');
      var email = emailInput.value.trim();
      var msg = document.getElementById('forgot-message');
      var btn = document.getElementById('forgot-btn');
      var form = document.getElementById('forgot-form');
      msg.hidden = true;
      emailInput.setCustomValidity('');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.setCustomValidity('Enter a valid email address');
        emailInput.reportValidity();
        emailInput.focus();
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        var response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        var data = await response.json();

        if (data.success) {
          if (data.resetUrl) {
            window.location.replace(data.resetUrl);
            return;
          }
          form.style.display = 'none';
          msg.innerHTML =
            '<div class="forgot-alert">' +
            '<strong>Check your email</strong><br>' +
            (data.message || 'If an account exists for that email or username, we sent a link to set a new password.') +
            '<br><small>Open the link (it expires in 1 hour) and choose your new password. Then return to login.</small>' +
            '</div>';
          msg.className = 'forgot-message success';
          msg.hidden = false;
          btn.textContent = 'Done';
        } else {
          msg.textContent = data.message || 'An error occurred. Please try again.';
          msg.className = 'forgot-message error';
          msg.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (error) {
        console.error('Error:', error);
        msg.textContent = 'An error occurred. Please try again.';
        msg.className = 'forgot-message error';
        msg.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    };
  </script>
</body>
</html>
