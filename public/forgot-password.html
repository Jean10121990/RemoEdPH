<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/student-portal-layout.css?v=portal-brand-5">
</head>
<body class="page-forgot-password">
  <div class="forgot-container">
    <div class="remoed-logo">
      <img src="images/remoed-logo-new.png" alt="RemoEdPH Logo" onerror="this.src='images/remoed-logo.png'">
      <div class="brand-text">
        <span class="remoed-title">RemoEdPH</span>
        <div class="remoed-subtitle">Account recovery</div>
      </div>
    </div>

    <div class="forgot-title">Forgot Password</div>
    <p class="forgot-lead">Enter the email or username for your account. We’ll send a new password if a match is found.</p>

    <form class="forgot-form" id="forgot-form">
      <label class="forgot-label" for="forgot-email">Email or username</label>
      <input type="text" id="forgot-email" placeholder="Enter your email or username" required autocomplete="username">
      <button type="submit" id="forgot-btn">Reset Password</button>
    </form>

    <div class="forgot-message" id="forgot-message" hidden></div>

    <div class="links-container">
      <a class="forgot-return-btn" href="/login/">Return to login</a>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').onsubmit = async function (e) {
      e.preventDefault();
      var email = document.getElementById('forgot-email').value.trim();
      var msg = document.getElementById('forgot-message');
      var btn = document.getElementById('forgot-btn');
      var form = document.getElementById('forgot-form');
      msg.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        var response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        var data = await response.json();

        if (data.success) {
          form.style.display = 'none';
          if (data.newPassword) {
            msg.innerHTML =
              '<div class="forgot-alert">' +
              '<strong>New password generated</strong><br>' +
              'Your new password is: <code class="forgot-temp-pw">' +
              String(data.newPassword).replace(/</g, '&lt;') +
              '</code><br>' +
              '<small>Email service not configured. Save this password and change it after logging in.</small>' +
              '</div>';
          } else {
            msg.innerHTML =
              '<div class="forgot-alert">' +
              '<strong>Request submitted</strong><br>' +
              (data.message || 'If an account exists for that email or username, a new password has been sent.') +
              '<br><small>Check your inbox and spam folder, then return to login.</small>' +
              '</div>';
          }
          msg.className = 'forgot-message success';
          msg.hidden = false;
          btn.textContent = 'Done';
        } else {
          msg.textContent = data.message || 'An error occurred. Please try again.';
          msg.className = 'forgot-message error';
          msg.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (error) {
        console.error('Error:', error);
        msg.textContent = 'An error occurred. Please try again.';
        msg.className = 'forgot-message error';
        msg.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    };
  </script>
</body>
</html>
