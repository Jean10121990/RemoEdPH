<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Hub - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="css/portal-chrome-compact.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/admin-hub-shell.css">
</head>
<body class="admin-hub-page page-admin-accounting-hub">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-page-header.js"></script>
        <script src="js/admin-sidebar.js"></script>
        <script src="js/admin-hub-guard.js" data-hub="accounting"></script>
        <script>AdminSidebar.render('admin-sidebar-root', 'accounting-hub');</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Accounting Hub</div>
                <p class="muted" style="margin-top:0;margin-bottom:16px;">Payroll, unique link commissions, and student subscriptions in one place.</p>

                <div class="hub-tabs" role="tablist" aria-label="Accounting Hub sections">
                    <button type="button" class="hub-tab hub-tab--active" role="tab" id="acct-tab-payroll" aria-selected="true" aria-controls="acct-panel-payroll">Payroll Management</button>
                    <button type="button" class="hub-tab" role="tab" id="acct-tab-commissions" aria-selected="false" aria-controls="acct-panel-commissions">Unique Link Commissions</button>
                    <button type="button" class="hub-tab" role="tab" id="acct-tab-subscriptions" aria-selected="false" aria-controls="acct-panel-subscriptions">Student Subscriptions</button>
                </div>

                <div id="acct-panel-payroll" class="hub-panel" role="tabpanel" aria-labelledby="acct-tab-payroll">
                    <iframe id="iframe-acct-payroll" class="hub-iframe" title="Payroll Management"></iframe>
                </div>
                <div id="acct-panel-commissions" class="hub-panel" role="tabpanel" aria-labelledby="acct-tab-commissions" hidden>
                    <iframe id="iframe-acct-commissions" class="hub-iframe" title="Unique Link Commissions"></iframe>
                </div>
                <div id="acct-panel-subscriptions" class="hub-panel" role="tabpanel" aria-labelledby="acct-tab-subscriptions" hidden>
                    <iframe id="iframe-acct-subscriptions" class="hub-iframe" title="Student Subscriptions"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var IFRAMES = {
                payroll: { id: 'iframe-acct-payroll', src: '/admin/admin-payroll.html?adminEmbed=1&embedVer=2' },
                commissions: { id: 'iframe-acct-commissions', src: '/admin/admin-unique-link-commission.html?adminEmbed=1&embedVer=2' },
                subscriptions: { id: 'iframe-acct-subscriptions', src: '/admin/admin-student-subscriptions.html?adminEmbed=1&embedVer=1' }
            };

            function checkAuth() {
                var token = (window.RemoedAdminSession && RemoedAdminSession.getAuthToken ? RemoedAdminSession.getAuthToken() : (localStorage.getItem('remoed_admin_token')||localStorage.getItem('remoed_admin_auth')||localStorage.getItem('adminToken')||''));
                if (!token) {
                    window.location.href = (function () {
                        try {
                            var p = localStorage.getItem('remoedAdminEntryPath');
                            if (p && p.charAt(0) === '/') return p;
                        } catch (e) {}
                        return 'index.html';
                    })();
                    return false;
                }
                if (window.AdminSidebar && typeof AdminSidebar.applyGreetingFromStorage === 'function') {
                    AdminSidebar.applyGreetingFromStorage();
                }
                return true;
            }

            function ensureIframe(key) {
                var cfg = IFRAMES[key];
                if (!cfg) return;
                var el = document.getElementById(cfg.id);
                if (!el || el.getAttribute('data-loaded')) return;
                el.src = cfg.src;
                el.setAttribute('data-loaded', '1');
            }

            function setHash(tab) {
                try {
                    var h = tab === 'commissions' ? '#commissions' : tab === 'subscriptions' ? '#subscriptions' : '#payroll';
                    if (window.location.hash !== h) {
                        history.replaceState(null, '', 'admin-accounting-hub.html' + h);
                    }
                } catch (e) {}
            }

            function showTab(tab) {
                var map = [
                    { key: 'payroll', t: 'acct-tab-payroll', p: 'acct-panel-payroll' },
                    { key: 'commissions', t: 'acct-tab-commissions', p: 'acct-panel-commissions' },
                    { key: 'subscriptions', t: 'acct-tab-subscriptions', p: 'acct-panel-subscriptions' }
                ];
                map.forEach(function (row) {
                    var on = row.key === tab;
                    var tEl = document.getElementById(row.t);
                    var pEl = document.getElementById(row.p);
                    if (tEl) {
                        tEl.classList.toggle('hub-tab--active', on);
                        tEl.setAttribute('aria-selected', on);
                    }
                    if (pEl) pEl.hidden = !on;
                });
                setHash(tab);
                ensureIframe(tab);
            }

            document.addEventListener('DOMContentLoaded', function () {
                if (!checkAuth()) return;
                function bindTab(id, key) {
                    var el = document.getElementById(id);
                    if (el) el.addEventListener('click', function () { showTab(key); });
                }
                bindTab('acct-tab-payroll', 'payroll');
                bindTab('acct-tab-commissions', 'commissions');
                bindTab('acct-tab-subscriptions', 'subscriptions');
                function applyHash() {
                    var h = window.location.hash;
                    if (h === '#commissions') showTab('commissions');
                    else if (h === '#subscriptions') showTab('subscriptions');
                    else showTab('payroll');
                }
                applyHash();
                window.addEventListener('hashchange', applyHash);
            });
        })();
    </script>
</body>
</html>
