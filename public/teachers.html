<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Teachers — RemoEdPH</title>
    <script>
        window.__teachersLandingPrefetch = fetch('/api/teachers/landing?limit=6&offset=0').then(function (r) {
            if (!r.ok) return Promise.reject(r);
            return r.json();
        });
    </script>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="child-friendly-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="landing-brand.css">
    <link rel="stylesheet" href="css/site-i18n.css">
</head>
<body class="page-teachers">
    <nav class="navbar">
        <a href="/" class="logo-section">
            <img src="/images/remoed-logo-new.png" alt="RemoEdPH Logo" />
            <span>RemoEdPH</span>
        </a>
        <div class="nav-buttons">
            <a href="/teachers" class="nav-btn">Our Teachers</a>
            <a href="/#assessment" class="nav-btn">Free Assessment</a>
            <a href="/#plans" class="nav-btn">Plans</a>
            <a href="/application-form" class="nav-btn">Apply Now</a>
            <a href="/login/" class="nav-btn primary">Login</a>
            <select
                class="site-lang-switcher"
                id="nav-lang-switcher"
                aria-label="Language"
            ></select>
        </div>
    </nav>

    <header class="page-hero">
        <h1>👩‍🏫 Meet Our Teachers</h1>
        <p>Caring, qualified educators who make English fun for young learners. Tap a card to see more — then book a class in one click.</p>
    </header>

    <section class="teachers-section">
        <div id="teachers-status" class="loading-state">Loading teachers…</div>
        <div id="teachers-grid" class="teachers-grid" style="display: none;"></div>
        <div id="teachers-more-wrap" class="teachers-more-wrap" style="display: none; text-align: center; margin: 1.75rem 0 0;">
            <button type="button" id="teachers-view-all" class="nav-btn primary">View All Teachers</button>
        </div>
    </section>

    <div id="teacher-modal-overlay" class="t-modal-overlay" aria-hidden="true">
        <div class="t-modal" role="dialog" aria-modal="true" aria-labelledby="t-modal-title">
            <div class="t-modal__head">
                <button type="button" class="t-modal__close" id="t-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="t-modal__body" id="t-modal-body"></div>
            <div class="t-modal__footer">
                <button type="button" class="t-modal__book" id="t-modal-book">Book a Class</button>
            </div>
        </div>
    </div>

    <script>
        let directoryTeachers = [];
        let landingState = { hasMore: false, nextOffset: 0 };
        let modalTeacher = null;

        function photoUrl(photo) {
            if (!photo) return '';
            if (/^https?:\/\//i.test(photo) || /^data:/i.test(photo)) return photo;
            const base = window.location.origin;
            return base + (photo.startsWith('/') ? photo : '/' + photo);
        }

        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        /** Same-origin .webp URLs: picture + source(webp) + img(png); WebP may be missing on disk. */
        function shouldUseWebpWithPngFallback(absUrl) {
            if (!absUrl || /^data:/i.test(absUrl)) return false;
            try {
                const u = new URL(absUrl, window.location.origin);
                if (u.origin !== window.location.origin) return false;
                return /\.webp($|[?#])/i.test(u.pathname);
            } catch (_e) {
                return /\.webp($|\?|#)/i.test(String(absUrl));
            }
        }

        function webpUrlToPngFallback(absUrl) {
            return String(absUrl).replace(/\.webp(?=$|[?#])/i, '.png');
        }

        function teacherPhotoHtml(absUrl, alt, imgClass) {
            if (!absUrl) return '';
            const a = esc(alt || '');
            const c = esc(imgClass || '');
            const onerr =
                ' onerror="this.onerror=null;this.src=\'/images/placeholder-avatar.png\'"';
            if (shouldUseWebpWithPngFallback(absUrl)) {
                const webp = esc(absUrl);
                const png = esc(webpUrlToPngFallback(absUrl));
                return (
                    '<picture>' +
                    '<source srcset="' +
                    webp +
                    '" type="image/webp" loading="lazy">' +
                    '<img class="' +
                    c +
                    '" src="' +
                    png +
                    '" alt="' +
                    a +
                    '" loading="lazy"' +
                    onerr +
                    '>' +
                    '</picture>'
                );
            }
            return (
                '<img class="' +
                c +
                '" src="' +
                esc(absUrl) +
                '" alt="' +
                a +
                '" loading="lazy"' +
                onerr +
                '>'
            );
        }

        function appendTeacherPhoto(wrap, absUrl, alt, imgClass) {
            if (!absUrl) return false;
            if (shouldUseWebpWithPngFallback(absUrl)) {
                const picture = document.createElement('picture');
                const source = document.createElement('source');
                source.srcset = absUrl;
                source.type = 'image/webp';
                source.setAttribute('loading', 'lazy');
                const img = document.createElement('img');
                img.src = webpUrlToPngFallback(absUrl);
                img.alt = alt || '';
                img.loading = 'lazy';
                img.className = imgClass || '';
                img.addEventListener('error', function () {
                    this.onerror = null;
                    if (!/\/placeholder-avatar\.png$/i.test(this.src)) {
                        this.src = '/images/placeholder-avatar.png';
                    }
                });
                picture.appendChild(source);
                picture.appendChild(img);
                wrap.appendChild(picture);
                return true;
            }
            const img = document.createElement('img');
            img.src = absUrl;
            img.alt = alt || '';
            img.loading = 'lazy';
            img.className = imgClass || '';
            img.addEventListener('error', function () {
                this.onerror = null;
                if (!/\/placeholder-avatar\.png$/i.test(this.src)) {
                    this.src = '/images/placeholder-avatar.png';
                }
            });
            wrap.appendChild(img);
            return true;
        }

        function openModal(t) {
            modalTeacher = t;
            const overlay = document.getElementById('teacher-modal-overlay');
            const body = document.getElementById('t-modal-body');
            const bookBtn = document.getElementById('t-modal-book');
            const display = t.displayName || t.name || t.teacherId;
            const rating = t.rating != null ? Number(t.rating).toFixed(1) : '4.9';
            const intro = (t.intro || t.bioSnippet || '').trim() || 'This teacher loves helping kids grow in confidence and English skills.';
            const certs = Array.isArray(t.certifications) ? t.certifications : [];
            const subjects = Array.isArray(t.subjects) ? t.subjects : ['English for Kids', 'Phonics'];

            const p = photoUrl(t.photo);
            const leftPhoto = p
                ? teacherPhotoHtml(p, display, 't-modal__photo-lg')
                : `<div class="t-modal__photo-lg-ph" aria-hidden="true">👤</div>`;

            let videoHtml = '';
            const v = t.videoIntroduction;
            if (v && (String(v).startsWith('http') || String(v).startsWith('data:') || String(v).startsWith('/'))) {
                const vs = photoUrl(v) || v;
                videoHtml = `<div class="t-modal__video" style="padding:0;border-style:solid;border-color:rgba(28,167,231,0.2);"><video controls playsinline preload="metadata" src="${esc(vs)}"></video></div>`;
            } else {
                videoHtml = `<div class="t-modal__video">
                    <div class="t-modal__video-play" aria-hidden="true">▶</div>
                    <div>Intro video<br><span style="font-size:0.78rem;opacity:0.85">Your teacher may add a clip here soon.</span></div>
                </div>`;
            }

            const certPills = certs.length
                ? `<div class="t-modal__pills">${certs.map((c) => `<span class="t-modal__pill">${esc(c)}</span>`).join('')}</div>`
                : `<div class="t-modal__pills"><span class="t-modal__pill">TESOL</span><span class="t-modal__pill">TEYL</span></div>`;

            const subjHtml = subjects.map((s) => `<span class="t-modal__subject">${esc(s)}</span>`).join('');

            body.innerHTML = `
                <div class="t-modal__left">
                    ${leftPhoto}
                    ${videoHtml}
                </div>
                <div class="t-modal__right">
                    <h2 id="t-modal-title">${esc(display)}</h2>
                    <div class="t-rating">⭐️ ${esc(rating)} <span style="font-weight:500;color:#94a3b8;font-size:0.85rem;">(${t.reviewCount || 0} reviews)</span></div>
                    <div class="t-modal__section">
                        <h3>Full bio</h3>
                        <div class="t-modal__bio">${esc(intro)}</div>
                    </div>
                    <div class="t-modal__section">
                        <h3>Certifications</h3>
                        ${certPills}
                    </div>
                    <div class="t-modal__section">
                        <h3>Subjects taught</h3>
                        <div class="t-modal__subjects">${subjHtml}</div>
                    </div>
                </div>`;

            bookBtn.textContent = 'Book a Class with ' + display;
            overlay.classList.add('is-open');
            overlay.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            const overlay = document.getElementById('teacher-modal-overlay');
            if (!overlay) return;
            overlay.querySelectorAll('video').forEach((el) => {
                try { el.pause(); } catch (e) {}
            });
            overlay.classList.remove('is-open');
            overlay.setAttribute('aria-hidden', 'true');
            modalTeacher = null;
        }

        function goBookWithTeacher(t) {
            if (!t || !t.teacherId) return;
            try {
                sessionStorage.setItem('prefillPreferredTeacherId', String(t.teacherId).trim());
            } catch (e) {}
            window.location.href = 'student-book.html?preferredTeacher=' + encodeURIComponent(t.teacherId);
        }

        function updateViewAllVisibility() {
            const wrap = document.getElementById('teachers-more-wrap');
            if (!wrap) return;
            wrap.style.display = landingState.hasMore ? 'block' : 'none';
        }

        function isSlimLandingTeacher(t) {
            return t && t.bioSnippet === undefined && t.intro === undefined;
        }

        async function openModalFromCard(t) {
            let tForModal = t;
            if (isSlimLandingTeacher(t)) {
                const id = t.teacherId;
                if (!id) return;
                try {
                    const r = await fetch('/api/teacher/public/profile/' + encodeURIComponent(id));
                    if (!r.ok) throw new Error('profile');
                    const d = await r.json();
                    tForModal = d.teacher;
                } catch (e) {
                    console.error(e);
                    return;
                }
            }
            openModal(tForModal);
        }

        function renderGrid(teachers) {
            const grid = document.getElementById('teachers-grid');
            const status = document.getElementById('teachers-status');
            const frag = document.createDocumentFragment();
            teachers.forEach((t) => {
                const display = t.displayName || t.name || t.teacherId;
                const rating = t.rating != null ? Number(t.rating).toFixed(1) : '4.9';
                const bio =
                    t.specialization ||
                    t.bioSnippet ||
                    t.intro ||
                    'Phonics expert who makes learning fun!';
                const p = photoUrl(t.profilePic || t.photo);

                const card = document.createElement('article');
                card.className = 'teacher-card';
                const imgWrap = document.createElement('div');
                imgWrap.className = 'teacher-card__photo-wrap';
                if (p) {
                    appendTeacherPhoto(imgWrap, p, display, '');
                } else {
                    const ph = document.createElement('div');
                    ph.className = 'teacher-card__placeholder';
                    ph.textContent = '👤';
                    imgWrap.appendChild(ph);
                }
                const name = document.createElement('div');
                name.className = 'teacher-card__name';
                name.textContent = display;
                const rat = document.createElement('div');
                rat.className = 'teacher-card__rating';
                rat.textContent = '⭐️ ' + rating;
                const bioEl = document.createElement('p');
                bioEl.className = 'teacher-card__bio';
                bioEl.textContent = bio;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'teacher-card__btn';
                btn.textContent = 'View Full Profile';
                btn.addEventListener('click', () => openModalFromCard(t));

                card.appendChild(imgWrap);
                card.appendChild(name);
                card.appendChild(rat);
                card.appendChild(bioEl);
                card.appendChild(btn);
                frag.appendChild(card);
            });
            grid.replaceChildren();
            grid.appendChild(frag);
            status.style.display = 'none';
            grid.style.display = 'grid';
        }

        async function fetchTeachersLanding(limit, offset) {
            const qs = `limit=${encodeURIComponent(String(limit))}&offset=${encodeURIComponent(String(offset))}`;
            const urls = [`/api/teachers/landing?${qs}`, `/api/teacher/public/landing?${qs}`];
            let lastStatus = 0;
            for (const url of urls) {
                const res = await fetch(url);
                lastStatus = res.status;
                if (res.ok) return res.json();
            }
            const err = new Error('Failed to load teachers');
            err.status = lastStatus;
            throw err;
        }

        async function loadTeachers() {
            const status = document.getElementById('teachers-status');
            try {
                let data;
                const pref = window.__teachersLandingPrefetch;
                if (pref) {
                    try {
                        data = await pref;
                    } catch (_e) {
                        data = await fetchTeachersLanding(6, 0);
                    }
                    window.__teachersLandingPrefetch = null;
                } else {
                    data = await fetchTeachersLanding(6, 0);
                }
                directoryTeachers = data.teachers || [];
                landingState = {
                    hasMore: !!data.hasMore,
                    nextOffset: typeof data.nextOffset === 'number' ? data.nextOffset : directoryTeachers.length,
                };
                if (directoryTeachers.length === 0) {
                    status.className = 'error-state';
                    status.textContent = 'No teachers to show yet. Please check back soon!';
                    return;
                }
                renderGrid(directoryTeachers);
                updateViewAllVisibility();
            } catch (e) {
                console.error(e);
                status.className = 'error-state';
                status.textContent = 'We couldn’t load teachers. Please refresh or try again later.';
            }
        }

        async function loadRemainingTeachers() {
            const btn = document.getElementById('teachers-view-all');
            if (!btn || !landingState.hasMore) return;
            btn.disabled = true;
            const prev = btn.textContent;
            btn.textContent = 'Loading…';
            try {
                const data = await fetchTeachersLanding(500, landingState.nextOffset);
                const more = data.teachers || [];
                directoryTeachers = directoryTeachers.concat(more);
                landingState = {
                    hasMore: !!data.hasMore,
                    nextOffset: typeof data.nextOffset === 'number' ? data.nextOffset : directoryTeachers.length,
                };
                renderGrid(directoryTeachers);
                updateViewAllVisibility();
            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = prev;
            }
        }

        document.getElementById('teachers-view-all').addEventListener('click', loadRemainingTeachers);

        document.getElementById('t-modal-close').addEventListener('click', closeModal);
        document.getElementById('teacher-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'teacher-modal-overlay') closeModal();
        });
        document.getElementById('t-modal-book').addEventListener('click', () => {
            if (modalTeacher) goBookWithTeacher(modalTeacher);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadTeachers();
    </script>
    <script src="js/site-i18n.js"></script>
    <script>
        if (window.SiteI18n) SiteI18n.init();
    </script>
</body>
</html>
