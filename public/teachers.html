<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Teachers — RemoEdPH</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="child-friendly-styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #E8F8F5 50%, #FFF9E6 100%);
            background-attachment: fixed;
            color: #1E3A5F;
            line-height: 1.6;
            min-height: 100vh;
        }
        .navbar {
            background: white;
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(28, 167, 231, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }
        .logo-section img { height: 50px; }
        .logo-section span {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1CA7E7;
            text-shadow: 2px 2px 4px rgba(28, 167, 231, 0.2);
        }
        .nav-buttons { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .nav-btn {
            padding: 12px 22px;
            border-radius: 50px;
            border: 2px solid #1CA7E7;
            background: white;
            color: #1CA7E7;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            background: #1CA7E7;
            color: white;
            transform: translateY(-2px);
        }
        .nav-btn.primary {
            background: linear-gradient(135deg, #1CA7E7, #5CB3FF);
            color: white;
            border: 2px solid #FFD700;
        }
        .nav-btn.active-nav {
            background: rgba(28, 167, 231, 0.12);
            border-color: #1CA7E7;
        }

        .page-hero {
            text-align: center;
            padding: 48px 24px 32px;
            max-width: 900px;
            margin: 0 auto;
        }
        .page-hero h1 {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 800;
            color: #1CA7E7;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(28, 167, 231, 0.15);
        }
        .page-hero p {
            font-size: 1.1rem;
            color: #334155;
        }

        .teachers-section {
            padding: 0 24px 80px;
            max-width: 1280px;
            margin: 0 auto;
        }
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px;
        }
        @media (max-width: 1100px) {
            .teachers-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .teachers-grid { grid-template-columns: 1fr; gap: 24px; }
            .navbar { padding: 16px 20px; }
        }

        .teacher-card {
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 28px 22px 24px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .teacher-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, 0.85);
            box-shadow: 0 12px 32px rgba(28, 167, 231, 0.2);
        }
        .teacher-card__photo-wrap {
            width: min(200px, 72vw);
            height: min(200px, 72vw);
            max-width: 220px;
            max-height: 220px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 16px;
            border: 4px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 28px rgba(28, 167, 231, 0.25);
            background: linear-gradient(135deg, #e8ecf7, #dbe4ff);
        }
        .teacher-card__photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .teacher-card__placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .teacher-card__name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1CA7E7;
            margin-bottom: 6px;
        }
        .teacher-card__rating {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .teacher-card__bio {
            font-size: 0.95rem;
            color: #1E3A5F;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.8em;
            margin-bottom: 18px;
            flex: 1;
        }
        .teacher-card__btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1CA7E7, #5CB3FF);
            color: white;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            border: 2px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 4px 14px rgba(28, 167, 231, 0.35);
            transition: transform 0.2s, filter 0.2s;
        }
        .teacher-card__btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.1rem;
        }

        /* Glass modal */
        .t-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(30, 41, 59, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s;
        }
        .t-modal-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }
        .t-modal {
            width: 100%;
            max-width: 920px;
            max-height: min(92vh, 720px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 25px 60px rgba(30, 41, 59, 0.25);
        }
        .t-modal__head {
            display: flex;
            justify-content: flex-end;
            padding: 12px 16px 0;
        }
        .t-modal__close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.55);
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
            line-height: 1;
        }
        .t-modal__close:hover { background: rgba(255,255,255,0.9); color: #1e293b; }
        .t-modal__body {
            display: grid;
            grid-template-columns: minmax(240px, 320px) 1fr;
            gap: 24px;
            padding: 8px 28px 24px;
            overflow-y: auto;
            min-height: 0;
        }
        @media (max-width: 720px) {
            .t-modal__body {
                grid-template-columns: 1fr;
                padding: 8px 18px 20px;
            }
        }
        .t-modal__left {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .t-modal__photo-lg {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.9);
            box-shadow: 0 12px 36px rgba(28, 167, 231, 0.2);
        }
        .t-modal__photo-lg-ph {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c7d2fe, #e9d5ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
        }
        .t-modal__video {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 16/9;
            border-radius: 16px;
            background: rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px dashed rgba(28, 167, 231, 0.35);
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            padding: 12px;
        }
        .t-modal__video-play {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1CA7E7, #5CB3FF);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            padding-left: 4px;
            box-shadow: 0 6px 20px rgba(28, 167, 231, 0.4);
        }
        .t-modal__video video {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            object-fit: cover;
        }
        .t-modal__right h2 {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .t-modal__right .t-rating {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .t-modal__section {
            margin-bottom: 18px;
        }
        .t-modal__section h3 {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 8px;
        }
        .t-modal__bio {
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.55;
        }
        .t-modal__pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .t-modal__pill {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.18);
            color: #4338ca;
            font-weight: 700;
        }
        .t-modal__subjects {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .t-modal__subject {
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(28, 167, 231, 0.12);
            color: #0e7490;
            font-weight: 700;
            border: 1px solid rgba(28, 167, 231, 0.25);
        }
        .t-modal__footer {
            padding: 16px 28px 24px;
            border-top: 1px solid rgba(148, 163, 184, 0.3);
        }
        @media (max-width: 720px) {
            .t-modal__footer { padding: 14px 18px 20px; }
        }
        .t-modal__book {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(34, 197, 94, 0.35);
            transition: filter 0.2s, transform 0.2s;
            white-space: normal;
            line-height: 1.35;
        }
        .t-modal__book:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-section">
            <img src="remoed-logo.png" alt="RemoEdPH Logo">
            <span>RemoEdPH</span>
        </a>
        <div class="nav-buttons">
            <a href="/teachers" class="nav-btn active-nav">Our Teachers</a>
            <a href="/#assessment" class="nav-btn">Free Assessment</a>
            <a href="/#plans" class="nav-btn">Plans</a>
            <a href="teacher-login.html" class="nav-btn">Teacher Login</a>
            <a href="student-login.html" class="nav-btn primary">Student Login</a>
        </div>
    </nav>

    <header class="page-hero">
        <h1>👩‍🏫 Meet Our Teachers</h1>
        <p>Caring, qualified educators who make English fun for young learners. Tap a card to see more — then book a class in one click.</p>
    </header>

    <section class="teachers-section">
        <div id="teachers-status" class="loading-state">Loading teachers…</div>
        <div id="teachers-grid" class="teachers-grid" style="display: none;"></div>
    </section>

    <div id="teacher-modal-overlay" class="t-modal-overlay" aria-hidden="true">
        <div class="t-modal" role="dialog" aria-modal="true" aria-labelledby="t-modal-title">
            <div class="t-modal__head">
                <button type="button" class="t-modal__close" id="t-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="t-modal__body" id="t-modal-body"></div>
            <div class="t-modal__footer">
                <button type="button" class="t-modal__book" id="t-modal-book">Book a Class</button>
            </div>
        </div>
    </div>

    <script>
        let directoryTeachers = [];
        let modalTeacher = null;

        function photoUrl(photo) {
            if (!photo) return '';
            if (/^https?:\/\//i.test(photo) || /^data:/i.test(photo)) return photo;
            const base = window.location.origin;
            return base + (photo.startsWith('/') ? photo : '/' + photo);
        }

        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function openModal(t) {
            modalTeacher = t;
            const overlay = document.getElementById('teacher-modal-overlay');
            const body = document.getElementById('t-modal-body');
            const bookBtn = document.getElementById('t-modal-book');
            const display = t.displayName || t.name || t.teacherId;
            const rating = t.rating != null ? Number(t.rating).toFixed(1) : '4.9';
            const intro = (t.intro || t.bioSnippet || '').trim() || 'This teacher loves helping kids grow in confidence and English skills.';
            const certs = Array.isArray(t.certifications) ? t.certifications : [];
            const subjects = Array.isArray(t.subjects) ? t.subjects : ['English for Kids', 'Phonics'];

            const p = photoUrl(t.photo);
            const leftPhoto = p
                ? `<img class="t-modal__photo-lg" src="${esc(p)}" alt="">`
                : `<div class="t-modal__photo-lg-ph" aria-hidden="true">👤</div>`;

            let videoHtml = '';
            const v = t.videoIntroduction;
            if (v && (String(v).startsWith('http') || String(v).startsWith('data:') || String(v).startsWith('/'))) {
                const vs = photoUrl(v) || v;
                videoHtml = `<div class="t-modal__video" style="padding:0;border-style:solid;border-color:rgba(28,167,231,0.2);"><video controls playsinline preload="metadata" src="${esc(vs)}"></video></div>`;
            } else {
                videoHtml = `<div class="t-modal__video">
                    <div class="t-modal__video-play" aria-hidden="true">▶</div>
                    <div>Intro video<br><span style="font-size:0.78rem;opacity:0.85">Your teacher may add a clip here soon.</span></div>
                </div>`;
            }

            const certPills = certs.length
                ? `<div class="t-modal__pills">${certs.map((c) => `<span class="t-modal__pill">${esc(c)}</span>`).join('')}</div>`
                : `<div class="t-modal__pills"><span class="t-modal__pill">TESOL</span><span class="t-modal__pill">TEYL</span></div>`;

            const subjHtml = subjects.map((s) => `<span class="t-modal__subject">${esc(s)}</span>`).join('');

            body.innerHTML = `
                <div class="t-modal__left">
                    ${leftPhoto}
                    ${videoHtml}
                </div>
                <div class="t-modal__right">
                    <h2 id="t-modal-title">${esc(display)}</h2>
                    <div class="t-rating">⭐️ ${esc(rating)} <span style="font-weight:500;color:#94a3b8;font-size:0.85rem;">(${t.reviewCount || 0} reviews)</span></div>
                    <div class="t-modal__section">
                        <h3>Full bio</h3>
                        <div class="t-modal__bio">${esc(intro)}</div>
                    </div>
                    <div class="t-modal__section">
                        <h3>Certifications</h3>
                        ${certPills}
                    </div>
                    <div class="t-modal__section">
                        <h3>Subjects taught</h3>
                        <div class="t-modal__subjects">${subjHtml}</div>
                    </div>
                </div>`;

            bookBtn.textContent = 'Book a Class with ' + display;
            overlay.classList.add('is-open');
            overlay.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            const overlay = document.getElementById('teacher-modal-overlay');
            if (!overlay) return;
            overlay.querySelectorAll('video').forEach((el) => {
                try { el.pause(); } catch (e) {}
            });
            overlay.classList.remove('is-open');
            overlay.setAttribute('aria-hidden', 'true');
            modalTeacher = null;
        }

        function goBookWithTeacher(t) {
            if (!t || !t.teacherId) return;
            try {
                sessionStorage.setItem('prefillPreferredTeacherId', String(t.teacherId).trim());
            } catch (e) {}
            window.location.href = 'student-book.html?preferredTeacher=' + encodeURIComponent(t.teacherId);
        }

        function renderGrid(teachers) {
            const grid = document.getElementById('teachers-grid');
            const status = document.getElementById('teachers-status');
            grid.innerHTML = '';
            teachers.forEach((t) => {
                const display = t.displayName || t.name || t.teacherId;
                const rating = t.rating != null ? Number(t.rating).toFixed(1) : '4.9';
                const bio = t.bioSnippet || t.intro || 'Phonics expert who makes learning fun!';
                const p = photoUrl(t.photo);

                const card = document.createElement('article');
                card.className = 'teacher-card';
                const imgWrap = document.createElement('div');
                imgWrap.className = 'teacher-card__photo-wrap';
                if (p) {
                    const img = document.createElement('img');
                    img.src = p;
                    img.alt = display;
                    img.loading = 'lazy';
                    imgWrap.appendChild(img);
                } else {
                    const ph = document.createElement('div');
                    ph.className = 'teacher-card__placeholder';
                    ph.textContent = '👤';
                    imgWrap.appendChild(ph);
                }
                const name = document.createElement('div');
                name.className = 'teacher-card__name';
                name.textContent = display;
                const rat = document.createElement('div');
                rat.className = 'teacher-card__rating';
                rat.textContent = '⭐️ ' + rating;
                const bioEl = document.createElement('p');
                bioEl.className = 'teacher-card__bio';
                bioEl.textContent = bio;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'teacher-card__btn';
                btn.textContent = 'View Full Profile';
                btn.addEventListener('click', () => openModal(t));

                card.appendChild(imgWrap);
                card.appendChild(name);
                card.appendChild(rat);
                card.appendChild(bioEl);
                card.appendChild(btn);
                grid.appendChild(card);
            });
            status.style.display = 'none';
            grid.style.display = 'grid';
        }

        async function loadTeachers() {
            const status = document.getElementById('teachers-status');
            try {
                const res = await fetch('/api/teacher/public/directory');
                if (!res.ok) throw new Error('Failed to load');
                const data = await res.json();
                directoryTeachers = data.teachers || [];
                if (directoryTeachers.length === 0) {
                    status.className = 'error-state';
                    status.textContent = 'No teachers to show yet. Please check back soon!';
                    return;
                }
                renderGrid(directoryTeachers);
            } catch (e) {
                console.error(e);
                status.className = 'error-state';
                status.textContent = 'We couldn’t load teachers. Please refresh or try again later.';
            }
        }

        document.getElementById('t-modal-close').addEventListener('click', closeModal);
        document.getElementById('teacher-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'teacher-modal-overlay') closeModal();
        });
        document.getElementById('t-modal-book').addEventListener('click', () => {
            if (modalTeacher) goBookWithTeacher(modalTeacher);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadTeachers();
    </script>
</body>
</html>
