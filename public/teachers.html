<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Teachers — RemoEdPH</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="child-friendly-styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-teachers">
    <nav class="navbar">
        <a href="/" class="logo-section">
            <img src="remoed-logo.png" alt="RemoEdPH Logo">
            <span>RemoEdPH</span>
        </a>
        <div class="nav-buttons">
            <a href="/teachers" class="nav-btn active-nav">Our Teachers</a>
            <a href="/#assessment" class="nav-btn">Free Assessment</a>
            <a href="/#plans" class="nav-btn">Plans</a>
            <a href="teacher-login.html" class="nav-btn">Teacher Login</a>
            <a href="student-login.html" class="nav-btn primary">Student Login</a>
        </div>
    </nav>

    <header class="page-hero">
        <h1>👩‍🏫 Meet Our Teachers</h1>
        <p>Caring, qualified educators who make English fun for young learners. Tap a card to see more — then book a class in one click.</p>
    </header>

    <section class="teachers-section">
        <div id="teachers-status" class="loading-state">Loading teachers…</div>
        <div id="teachers-grid" class="teachers-grid" style="display: none;"></div>
    </section>

    <div id="teacher-modal-overlay" class="t-modal-overlay" aria-hidden="true">
        <div class="t-modal" role="dialog" aria-modal="true" aria-labelledby="t-modal-title">
            <div class="t-modal__head">
                <button type="button" class="t-modal__close" id="t-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="t-modal__body" id="t-modal-body"></div>
            <div class="t-modal__footer">
                <button type="button" class="t-modal__book" id="t-modal-book">Book a Class</button>
            </div>
        </div>
    </div>

    <script>
        let directoryTeachers = [];
        let modalTeacher = null;

        function photoUrl(photo) {
            if (!photo) return '';
            if (/^https?:\/\//i.test(photo) || /^data:/i.test(photo)) return photo;
            const base = window.location.origin;
            return base + (photo.startsWith('/') ? photo : '/' + photo);
        }

        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function openModal(t) {
            modalTeacher = t;
            const overlay = document.getElementById('teacher-modal-overlay');
            const body = document.getElementById('t-modal-body');
            const bookBtn = document.getElementById('t-modal-book');
            const display = t.displayName || t.name || t.teacherId;
            const rating = t.rating != null ? Number(t.rating).toFixed(1) : '4.9';
            const intro = (t.intro || t.bioSnippet || '').trim() || 'This teacher loves helping kids grow in confidence and English skills.';
            const certs = Array.isArray(t.certifications) ? t.certifications : [];
            const subjects = Array.isArray(t.subjects) ? t.subjects : ['English for Kids', 'Phonics'];

            const p = photoUrl(t.photo);
            const leftPhoto = p
                ? `<img class="t-modal__photo-lg" src="${esc(p)}" alt="">`
                : `<div class="t-modal__photo-lg-ph" aria-hidden="true">👤</div>`;

            let videoHtml = '';
            const v = t.videoIntroduction;
            if (v && (String(v).startsWith('http') || String(v).startsWith('data:') || String(v).startsWith('/'))) {
                const vs = photoUrl(v) || v;
                videoHtml = `<div class="t-modal__video" style="padding:0;border-style:solid;border-color:rgba(28,167,231,0.2);"><video controls playsinline preload="metadata" src="${esc(vs)}"></video></div>`;
            } else {
                videoHtml = `<div class="t-modal__video">
                    <div class="t-modal__video-play" aria-hidden="true">▶</div>
                    <div>Intro video<br><span style="font-size:0.78rem;opacity:0.85">Your teacher may add a clip here soon.</span></div>
                </div>`;
            }

            const certPills = certs.length
                ? `<div class="t-modal__pills">${certs.map((c) => `<span class="t-modal__pill">${esc(c)}</span>`).join('')}</div>`
                : `<div class="t-modal__pills"><span class="t-modal__pill">TESOL</span><span class="t-modal__pill">TEYL</span></div>`;

            const subjHtml = subjects.map((s) => `<span class="t-modal__subject">${esc(s)}</span>`).join('');

            body.innerHTML = `
                <div class="t-modal__left">
                    ${leftPhoto}
                    ${videoHtml}
                </div>
                <div class="t-modal__right">
                    <h2 id="t-modal-title">${esc(display)}</h2>
                    <div class="t-rating">⭐️ ${esc(rating)} <span style="font-weight:500;color:#94a3b8;font-size:0.85rem;">(${t.reviewCount || 0} reviews)</span></div>
                    <div class="t-modal__section">
                        <h3>Full bio</h3>
                        <div class="t-modal__bio">${esc(intro)}</div>
                    </div>
                    <div class="t-modal__section">
                        <h3>Certifications</h3>
                        ${certPills}
                    </div>
                    <div class="t-modal__section">
                        <h3>Subjects taught</h3>
                        <div class="t-modal__subjects">${subjHtml}</div>
                    </div>
                </div>`;

            bookBtn.textContent = 'Book a Class with ' + display;
            overlay.classList.add('is-open');
            overlay.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            const overlay = document.getElementById('teacher-modal-overlay');
            if (!overlay) return;
            overlay.querySelectorAll('video').forEach((el) => {
                try { el.pause(); } catch (e) {}
            });
            overlay.classList.remove('is-open');
            overlay.setAttribute('aria-hidden', 'true');
            modalTeacher = null;
        }

        function goBookWithTeacher(t) {
            if (!t || !t.teacherId) return;
            try {
                sessionStorage.setItem('prefillPreferredTeacherId', String(t.teacherId).trim());
            } catch (e) {}
            window.location.href = 'student-book.html?preferredTeacher=' + encodeURIComponent(t.teacherId);
        }

        function renderGrid(teachers) {
            const grid = document.getElementById('teachers-grid');
            const status = document.getElementById('teachers-status');
            grid.innerHTML = '';
            teachers.forEach((t) => {
                const display = t.displayName || t.name || t.teacherId;
                const rating = t.rating != null ? Number(t.rating).toFixed(1) : '4.9';
                const bio = t.bioSnippet || t.intro || 'Phonics expert who makes learning fun!';
                const p = photoUrl(t.photo);

                const card = document.createElement('article');
                card.className = 'teacher-card';
                const imgWrap = document.createElement('div');
                imgWrap.className = 'teacher-card__photo-wrap';
                if (p) {
                    const img = document.createElement('img');
                    img.src = p;
                    img.alt = display;
                    img.loading = 'lazy';
                    imgWrap.appendChild(img);
                } else {
                    const ph = document.createElement('div');
                    ph.className = 'teacher-card__placeholder';
                    ph.textContent = '👤';
                    imgWrap.appendChild(ph);
                }
                const name = document.createElement('div');
                name.className = 'teacher-card__name';
                name.textContent = display;
                const rat = document.createElement('div');
                rat.className = 'teacher-card__rating';
                rat.textContent = '⭐️ ' + rating;
                const bioEl = document.createElement('p');
                bioEl.className = 'teacher-card__bio';
                bioEl.textContent = bio;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'teacher-card__btn';
                btn.textContent = 'View Full Profile';
                btn.addEventListener('click', () => openModal(t));

                card.appendChild(imgWrap);
                card.appendChild(name);
                card.appendChild(rat);
                card.appendChild(bioEl);
                card.appendChild(btn);
                grid.appendChild(card);
            });
            status.style.display = 'none';
            grid.style.display = 'grid';
        }

        async function loadTeachers() {
            const status = document.getElementById('teachers-status');
            try {
                const res = await fetch('/api/teacher/public/directory');
                if (!res.ok) throw new Error('Failed to load');
                const data = await res.json();
                directoryTeachers = data.teachers || [];
                if (directoryTeachers.length === 0) {
                    status.className = 'error-state';
                    status.textContent = 'No teachers to show yet. Please check back soon!';
                    return;
                }
                renderGrid(directoryTeachers);
            } catch (e) {
                console.error(e);
                status.className = 'error-state';
                status.textContent = 'We couldn’t load teachers. Please refresh or try again later.';
            }
        }

        document.getElementById('t-modal-close').addEventListener('click', closeModal);
        document.getElementById('teacher-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'teacher-modal-overlay') closeModal();
        });
        document.getElementById('t-modal-book').addEventListener('click', () => {
            if (modalTeacher) goBookWithTeacher(modalTeacher);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadTeachers();
    </script>
</body>
</html>
