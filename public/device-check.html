<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      /* Keep device-check styles local so modern-styles/style.css cannot skew sidebar spacing */
      body.page-device-check.teacher-portal {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f6fbff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      body.page-device-check .remoed-main {
        display: block;
        min-height: 100vh;
      }
      body.page-device-check .remoed-content {
        padding: 12px 16px;
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      body.page-device-check .device-check-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        padding: 1rem 1.25rem;
        width: 100%;
        max-width: 1100px;
        max-height: calc(100vh - 24px);
        display: flex;
        flex-direction: row;
        gap: 1.25rem;
        align-items: stretch;
        box-sizing: border-box;
        overflow: auto;
      }
      body.page-device-check .device-title {
        font-size: 1.15rem;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 0.75rem;
      }
      body.page-device-check .video-section {
        flex: 1.1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      body.page-device-check #video-preview {
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 360px;
        object-fit: cover;
        border-radius: 10px;
        background: #0f172a;
      }
      body.page-device-check .device-sysinfo {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
      }
      body.page-device-check .device-sysinfo-title {
        font-weight: 800;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
        color: #334155;
      }
      body.page-device-check .device-sysinfo-list { margin: 0; }
      body.page-device-check .device-sysinfo-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 0.35rem 0;
        border-bottom: 1px solid #e2e8f0;
      }
      body.page-device-check .device-sysinfo-row:last-of-type { border-bottom: none; }
      body.page-device-check .device-sysinfo-row dt {
        margin: 0;
        color: #64748b;
        font-size: 0.82rem;
        font-weight: 600;
      }
      body.page-device-check .device-sysinfo-row dd {
        margin: 0;
        color: #0f172a;
        font-size: 0.82rem;
        font-weight: 700;
        text-align: right;
      }
      body.page-device-check .device-sysinfo-note {
        margin: 0.5rem 0 0;
        font-size: 0.75rem;
        color: #94a3b8;
      }
      body.page-device-check .controls-section {
        flex: 0.9;
        min-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      body.page-device-check .dc-control-row,
      body.page-device-check .control-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      body.page-device-check .dc-control-row label,
      body.page-device-check .control-label {
        min-width: 110px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #475569;
      }
      body.page-device-check .dc-tip {
        font-size: 0.82rem;
        color: #64748b;
      }
      body.page-device-check #status-message {
        font-size: 0.88rem;
        color: #334155;
        font-weight: 600;
      }
      body.page-device-check #mic-level {
        height: 10px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }
      body.page-device-check #mic-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2E9A28, #47BC3E);
      }
      body.page-device-check .mute-btn,
      body.page-device-check .proceed-btn,
      body.page-device-check .back-btn {
        border: none;
        border-radius: 999px;
        padding: 0.55rem 1rem;
        font-weight: 800;
        cursor: pointer;
      }
      body.page-device-check .mute-btn { background: #27ae60; color: #fff; }
      body.page-device-check .proceed-btn {
        background: linear-gradient(90deg, #2E9A28, #47BC3E);
        color: #fff;
        margin-top: 0.35rem;
      }
      body.page-device-check .back-btn {
        background: #e2e8f0;
        color: #334155;
      }
      @media (max-width: 900px) {
        body.page-device-check .device-check-card {
          flex-direction: column;
          max-height: none;
        }
      }
    </style>
</head>
<body class="page-device-check teacher-portal">
    <div class="remoed-main">
        <div id="teacher-sidebar-root"></div>
        <script src="js/teacher-sidebar.js?v=logout-pin-2"></script>
        <script src="js/teacher-page-header.js?v=mint-forest-1"></script>
        <script>
          if (!window.RemoedTeacherSession || !RemoedTeacherSession.requireTeacher({ redirect: 'index.html' })) {
            throw new Error('Teachers only');
          }
          TeacherSidebar.render('teacher-sidebar-root', 'device-check');
          try { TeacherPageHeader.render('device-check'); } catch (e) {}
        </script>
    <div class="remoed-content">
        <div class="device-check-card">
            <div class="video-section">
                <div class="device-title">Check Your Camera & Microphone</div>
                <video id="video-preview" autoplay playsinline muted></video>
                <div class="device-sysinfo" id="device-sysinfo" aria-label="System information">
                    <div class="device-sysinfo-title">System Information</div>
                    <dl class="device-sysinfo-list">
                        <div class="device-sysinfo-row">
                            <dt>Date/Time</dt>
                            <dd id="sysinfo-datetime">Detecting…</dd>
                        </div>
                        <div class="device-sysinfo-row">
                            <dt>OS</dt>
                            <dd id="sysinfo-os">Detecting…</dd>
                        </div>
                        <div class="device-sysinfo-row">
                            <dt>Processor</dt>
                            <dd id="sysinfo-processor">Detecting…</dd>
                        </div>
                        <div class="device-sysinfo-row">
                            <dt>Memory</dt>
                            <dd id="sysinfo-memory">Detecting…</dd>
                        </div>
                    </dl>
                    <p class="device-sysinfo-note">Browser-reported readiness info (exact CPU model is private).</p>
                </div>
            </div>
            
            <div class="controls-section">
                <div class="dc-control-row">
                  <label for="brightness-slider">Brightness</label>
                  <input type="range" id="brightness-slider" min="0.5" max="2" step="0.01" value="1" style="flex:1;">
                </div>
                <div class="dc-control-row">
                  <label for="whiteness-slider">Whiteness</label>
                  <input type="range" id="whiteness-slider" min="0.5" max="2" step="0.01" value="1" style="flex:1;">
                </div>
                <div class="dc-control-row">
                  <label for="beautify-slider">Beautify</label>
                  <input type="range" id="beautify-slider" min="0" max="100" step="1" value="0" style="flex:1;">
                  <span id="beautify-value" style="font-size:0.8rem; color:#666; min-width:28px;">0%</span>
                </div>
                
                <!-- Audio Controls -->
                <div class="audio-controls">
                  <div class="control-row">
                    <label class="control-label">Volume</label>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" step="1" value="50">
                    <span id="volume-value" style="font-size:0.8rem; color:#666; min-width:28px;">50%</span>
                  </div>
                  <div class="control-row">
                    <label class="control-label">Microphone</label>
                    <button id="mute-btn" class="mute-btn unmuted">Unmuted</button>
                  </div>
                  <div class="control-row">
                    <label class="control-label">Audio Feedback</label>
                    <button id="feedback-btn" class="mute-btn" style="background: #6c757d;">Off</button>
                  </div>
                </div>
                <div id="mic-level"><div id="mic-bar"></div></div>
                <div id="status-message">Checking devices...</div>
                <div class="dc-tip">💡 Tip: Turn on Audio Feedback to hear yourself and test the mic.</div>
                <button class="proceed-btn" id="proceed-btn">Proceed to Practice Room</button>
                <button class="back-btn" id="back-dashboard-btn">Back to Dashboard</button>
            </div>
        </div>
        
        
        </div>
    </div>
        <script src="avatar-helper.js"></script>
        <script>
        // Sidebar (avatar, username, logout) is handled by TeacherSidebar component

        // --- System information under camera (browser-detectable fields) ---
        function formatSysDateTime(d) {
            try {
                return d.toLocaleString('en-PH', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true,
                    timeZone: 'Asia/Manila',
                }) + ' (PH)';
            } catch (e) {
                return d.toString();
            }
        }

        function detectOsFromUa(ua) {
            ua = String(ua || '');
            if (/Windows NT 10\.0/.test(ua)) {
                // Win10 and Win11 both report NT 10.0 in many UAs
                return 'Windows 10/11 (64-bit likely)';
            }
            if (/Windows NT 6\.3/.test(ua)) return 'Windows 8.1';
            if (/Windows NT 6\.1/.test(ua)) return 'Windows 7';
            if (/Mac OS X/.test(ua)) {
                var m = ua.match(/Mac OS X ([0-9_]+)/);
                return m ? 'macOS ' + m[1].replace(/_/g, '.') : 'macOS';
            }
            if (/Android/.test(ua)) {
                var a = ua.match(/Android ([0-9.]+)/);
                return a ? 'Android ' + a[1] : 'Android';
            }
            if (/iPhone|iPad|iPod/.test(ua)) return 'iOS / iPadOS';
            if (/CrOS/.test(ua)) return 'Chrome OS';
            if (/Linux/.test(ua)) return 'Linux';
            return navigator.platform || 'Unknown OS';
        }

        function detectBrowserLabel() {
            var ua = navigator.userAgent || '';
            if (/Edg\//.test(ua)) {
                var e = ua.match(/Edg\/([0-9.]+)/);
                return e ? 'Microsoft Edge ' + e[1] : 'Microsoft Edge';
            }
            if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) {
                var c = ua.match(/Chrome\/([0-9.]+)/);
                return c ? 'Chrome ' + c[1] : 'Chrome';
            }
            if (/Firefox\//.test(ua)) {
                var f = ua.match(/Firefox\/([0-9.]+)/);
                return f ? 'Firefox ' + f[1] : 'Firefox';
            }
            if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return 'Safari';
            return 'Browser';
        }

        async function collectSystemInfo() {
            var osLabel = detectOsFromUa(navigator.userAgent);
            var arch = '';
            var bitness = '';
            var platformVersion = '';

            try {
                if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                    var hints = await navigator.userAgentData.getHighEntropyValues([
                        'architecture',
                        'bitness',
                        'platform',
                        'platformVersion',
                        'model',
                    ]);
                    if (hints.platform) {
                        osLabel = hints.platform;
                        if (hints.platformVersion) {
                            platformVersion = String(hints.platformVersion);
                            // Windows 11 often reports platformVersion >= 13.0.0
                            if (/Windows/i.test(hints.platform) && platformVersion) {
                                var major = parseInt(platformVersion.split('.')[0], 10);
                                if (!isNaN(major) && major >= 13) {
                                    osLabel = 'Windows 11';
                                } else if (!isNaN(major)) {
                                    osLabel = 'Windows 10';
                                }
                                osLabel += ' (' + platformVersion + ')';
                            } else {
                                osLabel += ' ' + platformVersion;
                            }
                        }
                    }
                    if (hints.architecture) arch = hints.architecture;
                    if (hints.bitness) bitness = hints.bitness + '-bit';
                    if (hints.model) {
                        // Mobile device model when present
                        osLabel += osLabel.indexOf(hints.model) === -1 ? ' · ' + hints.model : '';
                    }
                } else if (navigator.userAgentData && navigator.userAgentData.platform) {
                    osLabel = navigator.userAgentData.platform;
                }
            } catch (e) {
                /* Client Hints may be denied */
            }

            if (bitness && osLabel.indexOf('bit') === -1) {
                osLabel += ' · ' + bitness;
            }

            var cores = navigator.hardwareConcurrency || 0;
            var processorParts = [];
            if (cores) processorParts.push(cores + ' logical CPU' + (cores === 1 ? '' : 's'));
            if (arch) processorParts.push(arch);
            var processorLabel = processorParts.length
                ? processorParts.join(', ')
                : 'Not reported';

            var memoryLabel = 'Not reported';
            if (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory > 0) {
                var gb = navigator.deviceMemory;
                memoryLabel = '~' + gb + ' GB RAM';
            }

            return {
                os: osLabel + ' · ' + detectBrowserLabel(),
                processor: processorLabel,
                memory: memoryLabel,
            };
        }

        function startSystemInfoPanel() {
            var dtEl = document.getElementById('sysinfo-datetime');
            var osEl = document.getElementById('sysinfo-os');
            var cpuEl = document.getElementById('sysinfo-processor');
            var memEl = document.getElementById('sysinfo-memory');
            if (!dtEl) return;

            function tickClock() {
                dtEl.textContent = formatSysDateTime(new Date());
            }
            tickClock();
            setInterval(tickClock, 1000);

            collectSystemInfo().then(function (info) {
                if (osEl) osEl.textContent = info.os;
                if (cpuEl) cpuEl.textContent = info.processor;
                if (memEl) memEl.textContent = info.memory;
            }).catch(function () {
                if (osEl) osEl.textContent = detectOsFromUa(navigator.userAgent);
                if (cpuEl) cpuEl.textContent = (navigator.hardwareConcurrency || '?') + ' logical CPUs';
                if (memEl) memEl.textContent = 'Not available';
            });
        }
        startSystemInfoPanel();
        
        // Back to dashboard button
        document.getElementById('back-dashboard-btn').onclick = function() {
            window.location.href = 'teacher-dashboard.html';
        };

        // Device check variables
        const statusMsg = document.getElementById('status-message');
        const video = document.getElementById('video-preview');
        const micBar = document.getElementById('mic-bar');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValue = document.getElementById('volume-value');
        const muteBtn = document.getElementById('mute-btn');
        const feedbackBtn = document.getElementById('feedback-btn');
        let stream;
        let audioTrack;
        let isMuted = false;
        let audioContext;
        let audioDestination;
        let isAudioFeedbackEnabled = false;
        
        

        // Camera and microphone check
        async function startMediaCheck() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                
                // Get audio track for volume and mute control
                audioTrack = stream.getAudioTracks()[0];
                
                statusMsg.textContent = 'Camera and microphone detected!';
                
                // Set up audio context for microphone level and feedback
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                audioDestination = audioContext.destination;
                
                // Connect to analyser for microphone level
                source.connect(analyser);
                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function updateMicLevel() {
                    if (!isMuted) {
                        analyser.getByteTimeDomainData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) {
                            const val = (dataArray[i] - 128) / 128;
                            sum += val * val;
                        }
                        const rms = Math.sqrt(sum / dataArray.length);
                        micBar.style.width = Math.min(100, rms * 400) + '%';
                    } else {
                        micBar.style.width = '0%';
                    }
                    requestAnimationFrame(updateMicLevel);
                }
                updateMicLevel();
            } catch (err) {
                statusMsg.textContent = 'Could not access camera or microphone. Please check your permissions.';
            }
        }
        
        startMediaCheck();
        
        // Brightness, whiteness, and beautify slider functionality
        const brightnessSlider = document.getElementById('brightness-slider');
        const whitenessSlider = document.getElementById('whiteness-slider');
        const beautifySlider = document.getElementById('beautify-slider');
        const beautifyValue = document.getElementById('beautify-value');
        
        function updateVideoFilter() {
            const brightness = brightnessSlider.value;
            const whiteness = whitenessSlider.value;
            const beautify = beautifySlider.value;
            
            // Beautify effects: blur for skin smoothing, contrast adjustment, and saturation
            const blurAmount = beautify > 0 ? (beautify / 100) * 0.5 : 0; // Max 0.5px blur
            const contrastAdjust = beautify > 0 ? 1 + (beautify / 100) * 0.3 : 1; // Increase contrast up to 30%
            const saturationAdjust = beautify > 0 ? 1 + (beautify / 100) * 0.2 : 1; // Increase saturation up to 20%
            
            // Apply filters with beautify effects
            video.style.filter = `
                brightness(${brightness}) 
                contrast(${whiteness * contrastAdjust}) 
                saturate(${saturationAdjust}) 
                blur(${blurAmount}px)
            `;
            
            // Update beautify value display
            beautifyValue.textContent = beautify + '%';
        }
        
        brightnessSlider.addEventListener('input', updateVideoFilter);
        whitenessSlider.addEventListener('input', updateVideoFilter);
        beautifySlider.addEventListener('input', updateVideoFilter);
        
        // Volume control
        volumeSlider.addEventListener('input', function() {
            const volume = this.value;
            volumeValue.textContent = volume + '%';
            
            // Set video volume (for any audio in the video stream)
            if (video) {
                video.volume = volume / 100;
            }
            
            // Update audio feedback volume if enabled
            if (isAudioFeedbackEnabled && audioContext) {
                // The gain node will be updated when audio feedback is re-enabled
                // For now, we'll just update the status message
                if (volume < 20) {
                    statusMsg.textContent = 'Audio feedback enabled! Speak to hear yourself. (Volume is low)';
                } else {
                    statusMsg.textContent = 'Audio feedback enabled! Speak to hear yourself.';
                }
            }
        });
        
        // Mute button functionality
        muteBtn.addEventListener('click', function() {
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                
                if (isMuted) {
                    this.textContent = 'Muted';
                    this.classList.remove('unmuted');
                    this.style.background = '#e74c3c';
                } else {
                    this.textContent = 'Unmuted';
                    this.classList.add('unmuted');
                    this.style.background = '#27ae60';
                }
            }
        });
        
        // Audio feedback button functionality
        feedbackBtn.addEventListener('click', function() {
            if (!audioContext || !audioDestination) {
                alert('Audio context not available. Please refresh the page.');
                return;
            }
            
            isAudioFeedbackEnabled = !isAudioFeedbackEnabled;
            
            if (isAudioFeedbackEnabled) {
                // Enable audio feedback - connect microphone to speakers
                const source = audioContext.createMediaStreamSource(stream);
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 0.8; // Increased volume for better audio feedback
                
                source.connect(gainNode);
                gainNode.connect(audioDestination);
                
                this.textContent = 'On';
                this.style.background = '#28a745';
                statusMsg.textContent = 'Audio feedback enabled! Speak to hear yourself.';
            } else {
                // Disable audio feedback
                this.textContent = 'Off';
                this.style.background = '#6c757d';
                statusMsg.textContent = 'Camera and microphone detected!';
            }
        });
        
        // Proceed to class button
        document.getElementById('proceed-btn').addEventListener('click', function() {
            // Check if user is a teacher
            const teacherId = localStorage.getItem('teacherId');
            const token = localStorage.getItem('token');
            
            if (!teacherId || !token) {
                alert('Please log in as a teacher to access the classroom.');
                window.location.href = '/login/';
                return;
            }
            
            // Generate a random 8-character room ID
            function generateRoomId() {
                return Math.random().toString(36).substr(2, 8);
            }
            const roomId = generateRoomId();
            
            // Store room ID and redirect to practice room
            localStorage.setItem('roomId', roomId);
            window.location.href = 'practice-room.html';
        });
    </script>
