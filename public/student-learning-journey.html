<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/security-guard.js?v=1"></script>
    <title>My Learning Journey - RemoEdPH</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="css/portal-chrome-compact.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/student-portal-layout.css?v=slide-match-1">
    <link rel="stylesheet" href="css/student-sidebar.css?v=slide-match-1">
    <link rel="stylesheet" href="css/student-learning-journey.css?v=path-char-1">
    <script src="js/user-session.js"></script>
</head>
<body class="student-portal page-student-learning-journey">
    <div class="remoed-main">
        <div id="student-sidebar-root"></div>
        <script src="js/student-lesson-progress-api.js"></script>
        <script src="js/student-sidebar.js?v=lb-nav-2"></script>
        <script src="js/student-page-header.js"></script>
        <script>
            StudentSidebar.render('student-sidebar-root', 'journey');
            StudentPageHeader.render('journey');
        </script>
        <div class="remoed-content">
            <div class="lj-page">
                <header class="lj-hero">
                    <div class="lj-hero-top">
                        <div>
                            <h1>My Learning Journey</h1>
                            <p>Walk the path with Remo. Each stop is one lesson. Remo stands on your next lesson — finished stops glow green. Fill the water drop as you grow!</p>
                        </div>
                        <div class="lj-drop-meter" id="lj-level-drop" aria-live="polite">
                            <div class="lj-drop" aria-hidden="true">
                                <div class="lj-drop__shape">
                                    <div class="lj-drop__fill" style="height: 0%"></div>
                                    <div class="lj-drop__shine"></div>
                                </div>
                            </div>
                            <div class="lj-drop-meta">
                                <strong id="lj-level-drop-count">0 / 220</strong>
                                <span id="lj-level-drop-label">Level progress</span>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="lj-back" onclick="window.location.href='student-dashboard.html'">← Back to dashboard</button>
                </header>
                <div class="lj-level-tabs" role="tablist" aria-label="Level">
                    <button type="button" class="lj-tab active" data-level="Little Seeds" role="tab" aria-selected="true">Little Seeds</button>
                    <button type="button" class="lj-tab" data-level="Sprouts" role="tab" aria-selected="false">Sprouts</button>
                    <button type="button" class="lj-tab" data-level="Saplings" role="tab" aria-selected="false">Saplings</button>
                    <button type="button" class="lj-tab" data-level="Young Stewards" role="tab" aria-selected="false">Young Stewards</button>
                </div>
                <div id="lj-trail-root" class="lj-trail-root" aria-busy="true">Loading your journey…</div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var userType = localStorage.getItem('userType');
            if (userType !== 'student') {
                alert('Access denied. This page is for students only.');
                window.location.href = 'index.html';
                return;
            }

            var LESSONS_PER_BATCH = 22;
            var BATCH_COUNT = 10;
            var LEVEL_TOTAL = BATCH_COUNT * LESSONS_PER_BATCH;
            var PATH_COLS = 6;
            var CHAR_SRC = 'images/remo-green.png';

            var LEVEL_META = {
                'Little Seeds': 'Little Seeds',
                'Sprouts': 'Sprouts',
                'Saplings': 'Saplings',
                'Young Stewards': 'Young Stewards'
            };

            var completedSet = null;
            var unlockCache = {};
            var activeBatchByLevel = {};
            var currentLevelKey = 'Little Seeds';

            var LOCK_SVG =
                '<svg class="lj-lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
                '<path d="M12 17a2 2 0 100-4 2 2 0 000 4z" fill="currentColor"/>' +
                '<path d="M18 9h-1V7a5 5 0 00-10 0v2H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2zm-8-2a3 3 0 016 0v2H10V7z" fill="currentColor"/>' +
                '</svg>';

            function getPortalToken() {
                if (window.RemoedUserSession && typeof window.RemoedUserSession.getUserToken === 'function') {
                    return window.RemoedUserSession.getUserToken() || '';
                }
                try {
                    return (
                        localStorage.getItem('remoed_user_token') ||
                        sessionStorage.getItem('remoed_user_token') ||
                        localStorage.getItem('token') ||
                        sessionStorage.getItem('token') ||
                        ''
                    );
                } catch (e) {
                    return '';
                }
            }

            function esc(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;')
                    .replace(/'/g, '&#39;');
            }

            function fetchUnlockBatches(levelKey) {
                if (unlockCache[levelKey]) {
                    return Promise.resolve(unlockCache[levelKey]);
                }
                var token = getPortalToken();
                if (!token) {
                    return Promise.resolve(null);
                }
                return fetch(
                    '/api/student/unlocked-batches?level=' + encodeURIComponent(levelKey),
                    { headers: { Authorization: 'Bearer ' + token }, credentials: 'include' }
                )
                    .then(function (res) {
                        return res.json().then(function (data) {
                            if (!res.ok || !data.success || !Array.isArray(data.batches)) {
                                return null;
                            }
                            unlockCache[levelKey] = data.batches;
                            return data.batches;
                        });
                    })
                    .catch(function () {
                        return null;
                    });
            }

            function isBatchLocked(batches, batchNum) {
                if (!batches || !batches.length) return false;
                var row = batches[batchNum - 1];
                return !!(row && row.locked);
            }

            function batchProgress(levelKey, batchNum) {
                var done = 0;
                for (var le = 1; le <= LESSONS_PER_BATCH; le++) {
                    if (completedSet.has(levelKey + ':' + batchNum + ':' + le)) done++;
                }
                return done;
            }

            function levelProgress(levelKey) {
                var done = 0;
                for (var b = 1; b <= BATCH_COUNT; b++) {
                    done += batchProgress(levelKey, b);
                }
                return done;
            }

            function pickDefaultBatch(levelKey, batches) {
                var firstIncompleteUnlocked = null;
                var firstUnlocked = null;
                for (var b = 1; b <= BATCH_COUNT; b++) {
                    var locked = isBatchLocked(batches, b);
                    if (locked) continue;
                    if (firstUnlocked == null) firstUnlocked = b;
                    var done = batchProgress(levelKey, b);
                    if (done < LESSONS_PER_BATCH && firstIncompleteUnlocked == null) {
                        firstIncompleteUnlocked = b;
                    }
                }
                return firstIncompleteUnlocked || firstUnlocked || 1;
            }

            function hereLessonIndex(levelKey, batchNum) {
                for (var le = 1; le <= LESSONS_PER_BATCH; le++) {
                    if (!completedSet.has(levelKey + ':' + batchNum + ':' + le)) return le;
                }
                return LESSONS_PER_BATCH;
            }

            function renderDropHtml(fillPct, countText, labelText, extraClass) {
                return (
                    '<div class="lj-drop-meter' + (extraClass ? ' ' + extraClass : '') + '">' +
                    '<div class="lj-drop" aria-hidden="true">' +
                    '<div class="lj-drop__shape">' +
                    '<div class="lj-drop__fill" style="height: ' + Math.max(0, Math.min(100, fillPct)) + '%"></div>' +
                    '<div class="lj-drop__shine"></div>' +
                    '</div></div>' +
                    '<div class="lj-drop-meta">' +
                    '<strong>' + esc(countText) + '</strong>' +
                    '<span>' + esc(labelText) + '</span>' +
                    '</div></div>'
                );
            }

            function updateLevelDrop(levelKey) {
                var done = levelProgress(levelKey);
                var pct = LEVEL_TOTAL ? Math.round((done / LEVEL_TOTAL) * 100) : 0;
                var fill = document.querySelector('#lj-level-drop .lj-drop__fill');
                var countEl = document.getElementById('lj-level-drop-count');
                var labelEl = document.getElementById('lj-level-drop-label');
                if (fill) fill.style.height = pct + '%';
                if (countEl) countEl.textContent = done + ' / ' + LEVEL_TOTAL;
                if (labelEl) labelEl.textContent = (LEVEL_META[levelKey] || levelKey) + ' progress';
            }

            function buildPathRows(levelKey, batchNum, hereIdx) {
                var label = LEVEL_META[levelKey] || levelKey;
                var lessons = [];
                for (var le = 1; le <= LESSONS_PER_BATCH; le++) {
                    lessons.push(le);
                }
                var rowsHtml = '';
                var rowIndex = 0;
                for (var i = 0; i < lessons.length; i += PATH_COLS) {
                    var slice = lessons.slice(i, i + PATH_COLS);
                    var rtl = rowIndex % 2 === 1;
                    var nodes = '';
                    for (var s = 0; s < slice.length; s++) {
                        var n = slice[s];
                        var ok = completedSet.has(levelKey + ':' + batchNum + ':' + n);
                        var isHere = n === hereIdx;
                        var tip =
                            'RemoEd ' + label + ' English — Batch ' + batchNum + ' — Lesson ' + n +
                            (ok ? ' (done)' : isHere ? ' (you are here)' : '');
                        var cls = 'lj-node';
                        if (ok) cls += ' lj-node--done';
                        if (isHere) cls += ' lj-node--here';
                        nodes +=
                            '<div class="' + cls + '" role="img" aria-label="' + esc(tip) + '" title="' + esc(tip) + '">' +
                            '<span>' + n + '</span>';
                        if (isHere) {
                            nodes +=
                                '<div class="lj-char" aria-hidden="true">' +
                                '<span class="lj-char__bubble">' + (ok && hereIdx === LESSONS_PER_BATCH ? 'Done!' : 'Next') + '</span>' +
                                '<img src="' + CHAR_SRC + '" alt="" width="56" height="56" decoding="async">' +
                                '</div>';
                        }
                        nodes += '</div>';
                    }
                    rowsHtml +=
                        '<div class="lj-path-row' + (rtl ? ' lj-path-row--rtl' : '') + '">' + nodes + '</div>';
                    rowIndex++;
                }
                return rowsHtml;
            }

            function renderLevel(levelKey, batches) {
                var root = document.getElementById('lj-trail-root');
                if (!root || !completedSet) return;

                updateLevelDrop(levelKey);

                if (!activeBatchByLevel[levelKey]) {
                    activeBatchByLevel[levelKey] = pickDefaultBatch(levelKey, batches);
                }
                var activeBatch = activeBatchByLevel[levelKey];
                if (activeBatch < 1 || activeBatch > BATCH_COUNT) activeBatch = 1;

                var chapters = '<div class="lj-chapters" role="tablist" aria-label="Batches">';
                for (var b = 1; b <= BATCH_COUNT; b++) {
                    var done = batchProgress(levelKey, b);
                    var locked = isBatchLocked(batches, b);
                    var complete = done === LESSONS_PER_BATCH;
                    var cls = 'lj-chapter';
                    if (b === activeBatch) cls += ' is-active';
                    if (complete) cls += ' is-complete';
                    if (locked) cls += ' is-locked';
                    var stat = locked ? 'Locked' : done + '/' + LESSONS_PER_BATCH;
                    chapters +=
                        '<button type="button" class="' + cls + '" data-batch="' + b + '" role="tab" aria-selected="' +
                        (b === activeBatch ? 'true' : 'false') + '">' +
                        '<span class="lj-chapter__label">Batch</span>' +
                        '<span class="lj-chapter__num">' + b + (complete ? ' ✓' : '') + '</span>' +
                        '<span class="lj-chapter__stat">' + esc(stat) + '</span>' +
                        '</button>';
                }
                chapters += '</div>';

                var doneActive = batchProgress(levelKey, activeBatch);
                var lockedActive = isBatchLocked(batches, activeBatch);
                var completeActive = doneActive === LESSONS_PER_BATCH;
                var fillPct = Math.round((doneActive / LESSONS_PER_BATCH) * 100);
                var hereIdx = hereLessonIndex(levelKey, activeBatch);

                var stageCls = 'lj-stage' + (lockedActive ? ' lj-stage--locked' : '');
                var html = chapters;
                html += '<section class="' + stageCls + '" aria-labelledby="lj-stage-title">';
                html += '<div class="lj-stage-head">';
                html += '<h2 class="lj-stage-title" id="lj-stage-title">';
                if (completeActive) html += '<span class="lj-trophy" aria-hidden="true">🏆</span> ';
                html += 'Batch ' + activeBatch;
                if (completeActive) html += ' <span class="lj-badge">Batch completed</span>';
                html += '</h2>';
                html += renderDropHtml(fillPct, doneActive + ' / ' + LESSONS_PER_BATCH, 'Batch water drop', 'lj-stage-drop');
                html += '</div>';

                html += '<div class="lj-path" aria-label="Lesson path for batch ' + activeBatch + '">';
                html += buildPathRows(levelKey, activeBatch, hereIdx);
                html += '</div>';

                if (lockedActive) {
                    html +=
                        '<div class="lj-lock-panel" role="region" aria-label="These lessons are locked">' +
                        '<div class="lj-lock-inner">' +
                        LOCK_SVG +
                        '<p>Purchase a plan to unlock more lessons</p>' +
                        '<a class="lj-batch-buy-btn" href="student-credits.html">Buy Now</a>' +
                        '</div></div>';
                }

                html +=
                    '<div class="lj-legend" aria-hidden="true">' +
                    '<span><i class="done"></i> Finished</span>' +
                    '<span><i class="here"></i> Remo is here</span>' +
                    '<span><i></i> Upcoming</span>' +
                    '</div>';
                html += '</section>';

                root.innerHTML = html;
                root.setAttribute('aria-busy', 'false');

                root.querySelectorAll('.lj-chapter').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var n = parseInt(btn.getAttribute('data-batch'), 10);
                        if (!Number.isFinite(n)) return;
                        activeBatchByLevel[levelKey] = n;
                        renderLevel(levelKey, batches);
                        var stage = root.querySelector('.lj-stage');
                        if (stage && stage.scrollIntoView) {
                            stage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    });
                });

                var activeChap = root.querySelector('.lj-chapter.is-active');
                if (activeChap && activeChap.scrollIntoView) {
                    activeChap.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }

            function activateTabUi(levelKey) {
                document.querySelectorAll('.lj-tab').forEach(function (btn) {
                    var on = btn.getAttribute('data-level') === levelKey;
                    btn.classList.toggle('active', on);
                    btn.setAttribute('aria-selected', on ? 'true' : 'false');
                });
            }

            function loadAndRender(levelKey) {
                var root = document.getElementById('lj-trail-root');
                if (!root || !completedSet) return;
                currentLevelKey = levelKey;
                root.setAttribute('aria-busy', 'true');
                root.textContent = 'Loading your journey…';
                fetchUnlockBatches(levelKey).then(function (batches) {
                    renderLevel(levelKey, batches);
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                var root = document.getElementById('lj-trail-root');
                if (!window.RemoEdLessonProgress) {
                    if (root) root.textContent = 'Progress script failed to load.';
                    return;
                }
                RemoEdLessonProgress.loadCompletedKeys()
                    .then(function (set) {
                        completedSet = set;
                        activateTabUi(currentLevelKey);
                        loadAndRender(currentLevelKey);
                    })
                    .catch(function (e) {
                        if (root) {
                            root.textContent = (e && e.message) ? e.message : 'Could not load your journey.';
                            root.setAttribute('aria-busy', 'false');
                        }
                    });

                document.querySelectorAll('.lj-tab').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var lk = btn.getAttribute('data-level');
                        activateTabUi(lk);
                        loadAndRender(lk);
                    });
                });
            });
        })();
    </script>
</body>
</html>
