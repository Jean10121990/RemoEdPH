<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Reset Password - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/student-portal-layout.css?v=notif-red-1">
  <script src="js/user-session.js"></script>
</head>
<body class="page-student-reset-password">
  <div class="reset-container">
    <img class="reset-logo" src="images/remoed-logo-new.png" alt="RemoEdPH" onerror="this.src='images/remoed-logo.png'">
    <div class="reset-title">Set a New Password</div>
    <p class="reset-lead">Choose a new password for your student account.</p>
    <form class="reset-form" id="student-reset-form">
      <label class="reset-label" for="student-reset-password">New password</label>
      <input type="password" id="student-reset-password" placeholder="Enter new password" required autocomplete="new-password">
      <button type="submit">Set New Password</button>
    </form>
    <div class="reset-message" id="student-reset-message"></div>
    <div class="reset-error" id="student-reset-error"></div>
    <a href="/login/" class="back-link">&larr; Back to Login</a>
  </div>
  <script>
    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    document.getElementById('student-reset-form').onsubmit = async function(e) {
      e.preventDefault();
      const token = getToken();
      const password = document.getElementById('student-reset-password').value;
      const msg = document.getElementById('student-reset-message');
      const err = document.getElementById('student-reset-error');
      msg.style.display = 'none';
      err.style.display = 'none';
      if (!token) {
        err.textContent = 'Invalid or missing reset token.';
        err.style.display = 'block';
        return;
      }
      const response = await fetch('/api/student-reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await response.json();
      if (data.success) {
        document.getElementById('student-reset-form').style.display = 'none';
        msg.textContent = 'Your password has been reset. You can now log in.';
        msg.style.display = 'block';
      } else {
        err.textContent = data.message || 'Failed to reset password.';
        err.style.display = 'block';
      }
    };
  </script>
</body>
</html>
