<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/admin-standalone-redirect.js"></script>
    <script src="js/admin-embed-init.js"></script>
    <title>Admin Payroll - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css?v=app-shell-3">
    <link rel="stylesheet" href="css/portal-chrome-compact.css?v=app-shell-3">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-admin-admin-payroll">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-sidebar.js?v=app-shell-14"></script>
        <script>if (!window.__ADMIN_EMBED__) { AdminSidebar.render('admin-sidebar-root', 'accounting-hub'); }</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Admin Fee Disbursement</div>
                <div style="margin: 6px 0 14px 0; color: #64748b; font-size: 0.85rem;">
                    Each eligible admin earns <strong>1%</strong> of subscription gross sales for the cutoff.
                    Eligible = at least one completed <strong>8-hour</strong> shift in the period.
                    Pay periods: <strong>1st–15th</strong> and <strong>16th–end</strong>.
                </div>

                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-primary" id="ap-prev">← Previous Period</button>
                    <div style="text-align: center; flex: 1; min-width: 200px;">
                        <strong>Selected Period:</strong> <span id="ap-period-label">Loading…</span>
                    </div>
                    <button type="button" class="btn btn-primary" id="ap-next">Next Period →</button>
                    <button type="button" class="btn btn-success" id="ap-current" style="background:#28a745;">📅 Current Period</button>
                </div>

                <button type="button" class="btn btn-success" id="ap-load">Load Admins</button>
                <button type="button" class="btn btn-danger" id="ap-dispense" style="display:none;">Dispense All Admin Fees</button>
                <div id="ap-status" style="margin-top:10px;font-weight:600;"></div>
                <div id="ap-summary" style="margin-top:12px;font-size:0.9rem;color:#475569;"></div>

                <div id="ap-table-wrap" style="margin-top:20px;display:none;overflow-x:auto;">
                    <h3 style="color:#1ca7e7;margin-bottom:12px;">Admin fees this period</h3>
                    <table style="width:100%;border-collapse:collapse;font-size:0.88rem;">
                        <thead>
                            <tr style="background:#f8fafc;text-align:left;">
                                <th style="padding:10px;border-bottom:1px solid #e2e8f0;">Admin</th>
                                <th style="padding:10px;border-bottom:1px solid #e2e8f0;">Role</th>
                                <th style="padding:10px;border-bottom:1px solid #e2e8f0;">Hours</th>
                                <th style="padding:10px;border-bottom:1px solid #e2e8f0;">8h shifts</th>
                                <th style="padding:10px;border-bottom:1px solid #e2e8f0;">Fee (1%)</th>
                                <th style="padding:10px;border-bottom:1px solid #e2e8f0;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="ap-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
(function () {
    var selectedPeriodKey = '';

    function adminApiFetch(url, init) {
        init = init || {};
        var headers = new Headers(init.headers || {});
        var token = (window.RemoedAdminSession && RemoedAdminSession.getAuthToken ? RemoedAdminSession.getAuthToken() : (localStorage.getItem('remoed_admin_token')||localStorage.getItem('remoed_admin_auth')||localStorage.getItem('adminToken')||''));
        if (token) headers.set('Authorization', 'Bearer ' + token);
        return fetch(url, Object.assign({}, init, { credentials: 'include', headers: headers }));
    }

    function getPeriodKeyForDate(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var half = d.getDate() <= 15 ? '1' : '2';
        return y + '-' + m + '-' + half;
    }

    function parsePeriodKey(key) {
        var m = String(key || '').match(/^(\d{4})-(\d{2})-(1|2)$/);
        if (!m) return null;
        return { y: +m[1], mo: +m[2], half: +m[3] };
    }

    function boundsLabel(key) {
        var p = parsePeriodKey(key);
        if (!p) return key;
        if (p.half === 1) return p.mo + '/' + p.y + ' · 1–15';
        var last = new Date(p.y, p.mo, 0).getDate();
        return p.mo + '/' + p.y + ' · 16–' + last;
    }

    function shiftPeriod(deltaHalf) {
        var p = parsePeriodKey(selectedPeriodKey) || parsePeriodKey(getPeriodKeyForDate(new Date()));
        var half = p.half;
        var mo = p.mo;
        var y = p.y;
        if (deltaHalf > 0) {
            if (half === 1) half = 2;
            else { half = 1; mo += 1; if (mo > 12) { mo = 1; y += 1; } }
        } else {
            if (half === 2) half = 1;
            else { half = 2; mo -= 1; if (mo < 1) { mo = 12; y -= 1; } }
        }
        selectedPeriodKey = y + '-' + String(mo).padStart(2, '0') + '-' + half;
        document.getElementById('ap-period-label').textContent = boundsLabel(selectedPeriodKey);
    }

    function peso(n) {
        return '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }

    async function loadAdmins() {
        var status = document.getElementById('ap-status');
        status.textContent = 'Loading…';
        status.style.color = '#64748b';
        try {
            var r = await adminApiFetch('/api/admin/admin-fee/payroll?period=' + encodeURIComponent(selectedPeriodKey));
            var d = await r.json().catch(function () { return {}; });
            if (!r.ok || !d.success) throw new Error(d.message || d.error || 'Load failed');
            document.getElementById('ap-period-label').textContent = d.weekPeriod || boundsLabel(selectedPeriodKey);
            document.getElementById('ap-summary').textContent =
                'Gross subscription sales: ' + peso(d.grossSales) +
                ' · 1% pool per eligible admin: ' + peso(d.commissionPool) +
                ' · Purchases: ' + (d.purchaseCount || 0);
            var body = document.getElementById('ap-tbody');
            var rows = d.admins || [];
            if (!rows.length) {
                body.innerHTML = '<tr><td colspan="6" style="padding:12px;color:#64748b;">No admins found.</td></tr>';
            } else {
                body.innerHTML = rows.map(function (a) {
                    var stColor = a.paymentStatus === 'Paid' ? '#15803d' : a.paymentStatus === 'Pending' ? '#b45309' : '#94a3b8';
                    return '<tr>' +
                        '<td style="padding:10px;border-bottom:1px solid #f1f5f9;"><strong>' + esc(a.name) + '</strong><br><span style="color:#94a3b8;font-size:0.75rem;">' + esc(a.username) + '</span></td>' +
                        '<td style="padding:10px;border-bottom:1px solid #f1f5f9;">' + esc(a.role) + '</td>' +
                        '<td style="padding:10px;border-bottom:1px solid #f1f5f9;">' + esc(a.totalHours) + '</td>' +
                        '<td style="padding:10px;border-bottom:1px solid #f1f5f9;">' + esc(a.completedShifts) + '/' + esc(a.totalShifts) + '</td>' +
                        '<td style="padding:10px;border-bottom:1px solid #f1f5f9;">' + peso(a.feeAmount) + '</td>' +
                        '<td style="padding:10px;border-bottom:1px solid #f1f5f9;font-weight:700;color:' + stColor + ';">' + esc(a.paymentStatus) + '</td>' +
                        '</tr>';
                }).join('');
            }
            document.getElementById('ap-table-wrap').style.display = 'block';
            var pending = rows.filter(function (a) { return a.paymentStatus === 'Pending'; }).length;
            var btn = document.getElementById('ap-dispense');
            btn.style.display = pending ? 'inline-block' : 'none';
            btn.disabled = !pending;
            btn.textContent = pending ? 'Dispense All Admin Fees' : 'All fees dispensed';
            status.textContent = 'Loaded ' + rows.length + ' admin(s).';
            status.style.color = '#15803d';
        } catch (e) {
            status.textContent = e.message || 'Failed to load';
            status.style.color = '#b91c1c';
        }
    }

    async function dispense() {
        if (!confirm('Dispense admin fees for this period to all eligible admins? This cannot be undone.')) return;
        var status = document.getElementById('ap-status');
        try {
            var r = await adminApiFetch('/api/admin/admin-fee/dispense', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ period: selectedPeriodKey })
            });
            var d = await r.json().catch(function () { return {}; });
            if (!r.ok || !d.success) throw new Error(d.message || d.error || 'Dispense failed');
            status.textContent = 'Dispensed to ' + (d.dispensedAdmins || []).length + ' admin(s).';
            status.style.color = '#15803d';
            await loadAdmins();
        } catch (e) {
            alert(e.message || 'Dispense failed');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        selectedPeriodKey = getPeriodKeyForDate(new Date());
        document.getElementById('ap-period-label').textContent = boundsLabel(selectedPeriodKey);
        document.getElementById('ap-prev').onclick = function () { shiftPeriod(-1); };
        document.getElementById('ap-next').onclick = function () { shiftPeriod(1); };
        document.getElementById('ap-current').onclick = function () {
            selectedPeriodKey = getPeriodKeyForDate(new Date());
            document.getElementById('ap-period-label').textContent = boundsLabel(selectedPeriodKey);
        };
        document.getElementById('ap-load').onclick = loadAdmins;
        document.getElementById('ap-dispense').onclick = dispense;
        loadAdmins();
    });
})();
    </script>
</body>
</html>
