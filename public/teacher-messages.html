<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/security-guard.js?v=1"></script>
    <title>Messages - RemoEdPH</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="css/global-portal.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/portal-chrome-compact.css">
    <script src="js/user-session.js"></script>
</head>
<body class="page-teacher-messages">
    <div class="remoed-main">
        <div id="teacher-sidebar-root"></div>
        <script src="js/teacher-sidebar.js"></script>
        <script src="js/teacher-page-header.js"></script>
        <script>
            TeacherSidebar.render('teacher-sidebar-root', 'messages');
            TeacherPageHeader.render('messages');
        </script>

        <main class="remoed-content">
            <div class="messenger" id="messenger">
                <aside class="chat-list">
                    <div class="chat-list-header">
                        <div class="chat-list-header-text">
                            
                            <p class="chat-list-subtitle">Recent chats</p>
                        </div>
                    </div>
                    <div class="chat-search">
                        <input id="chat-filter" type="search" placeholder="Filter recent chats…" autocomplete="off" />
                    </div>
                    <div class="chat-search" style="margin-top:8px;">
                        <input id="user-search" type="search" placeholder="Search teachers or admins…" autocomplete="off" />
                    </div>
                    <div class="chat-items" id="chat-items">
                        <div style="padding:16px;color:#64748b;">Loading chats...</div>
                    </div>
                </aside>

                <section class="chat-pane">
                    <div class="chat-pane-header">
                        <button class="back-btn" id="back-btn">←</button>
                        <div class="avatar" id="pane-avatar">?</div>
                        <div class="pane-title">
                            <div class="name" id="pane-name">Select a chat</div>
                            <div class="sub" id="pane-sub"></div>
                        </div>
                    </div>
                    <div class="chat-scroll" id="chat-scroll">
                        <div class="empty-pane">Choose a conversation on the left to start chatting.</div>
                    </div>
                    <div class="composer" id="composer" style="display:none;">
                        <button class="attach-btn" title="Attach (coming soon)" aria-label="Attach">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.2a2 2 0 11-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>
                        <textarea id="composer-text" placeholder="Type a message..."></textarea>
                        <button class="send-btn" id="send-btn">Send</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>
    <script src="timezone-utils.js"></script>
    <script>
        (function () {
            const token = localStorage.getItem('token');
            const me = localStorage.getItem('teacherId');
            const messengerEl = document.getElementById('messenger');
            const chatItemsEl = document.getElementById('chat-items');
            const chatScrollEl = document.getElementById('chat-scroll');
            const paneAvatarEl = document.getElementById('pane-avatar');
            const paneNameEl = document.getElementById('pane-name');
            const paneSubEl = document.getElementById('pane-sub');
            const composerEl = document.getElementById('composer');
            const composerTextEl = document.getElementById('composer-text');
            const sendBtnEl = document.getElementById('send-btn');
            const chatFilterEl = document.getElementById('chat-filter');
            const userSearchEl = document.getElementById('user-search');
            const backBtnEl = document.getElementById('back-btn');

            let chats = [];
            let userSearchHits = [];
            let userSearchTimer = null;
            let activePeerId = null;
            const seenMessageIds = new Set();
            const threadCursor = { hasMore: false, nextBefore: null, loadingOlder: false };
            const __skTok = (window.RemoedSecurityGuard && typeof window.RemoedSecurityGuard.getToken === 'function')
                ? window.RemoedSecurityGuard.getToken()
                : (localStorage.getItem('remoed_user_token') || localStorage.getItem('token') || '');
            const socket = (typeof io !== 'undefined')
                ? io(window.location.origin, {
                    transports: ['websocket', 'polling'],
                    reconnection: true,
                    auth: { token: __skTok },
                  })
                : null;

            function esc(s) { return String(s || '').replace(/</g, '&lt;'); }
            function fmtTime(ts) {
                if (!ts) return '';
                const TU = window.TimezoneUtils || {};
                const d = new Date(ts);
                return TU.formatDateTimePhilippines ? TU.formatDateTimePhilippines(d) : d.toLocaleString();
            }
            function fmtShort(ts) {
                if (!ts) return '';
                const TU = window.TimezoneUtils || {};
                const d = new Date(ts);
                return TU.formatTime12hPhilippines ? TU.formatTime12hPhilippines(d) : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            function scrollToBottom() { chatScrollEl.scrollTop = chatScrollEl.scrollHeight; }
            function normalizeImg(src) {
                const s = String(src || '').trim();
                if (!s) return '';
                if (s.startsWith('http://') || s.startsWith('https://') || s.startsWith('data:')) return s;
                if (s.startsWith('/')) return s;
                return '/' + s;
            }
            function lastSeenText(lastAt) {
                if (!lastAt) return 'Offline';
                const d = new Date(lastAt);
                if (Number.isNaN(d.getTime())) return 'Offline';
                const TU = window.TimezoneUtils || {};
                return `Last seen ${TU.formatDateTimePhilippines ? TU.formatDateTimePhilippines(d) : d.toLocaleString()}`;
            }

            function renderChatList() {
                const f = (chatFilterEl && chatFilterEl.value) ? chatFilterEl.value.trim().toLowerCase() : '';
                const rows = chats.filter(c => !f || (c.name || '').toLowerCase().includes(f));
                const hits = userSearchHits.filter(h => !rows.some(r => String(r.peerId) === String(h.peerId)));
                let html = '';
                if (rows.length === 0 && hits.length === 0) {
                    chatItemsEl.innerHTML = '<div style="padding:16px;color:#64748b;">No chats match. Try &quot;Search teachers&quot; below to find someone new.</div>';
                    return;
                }
                if (rows.length) {
                    html += rows.map(c => {
                        const active = String(c.peerId) === String(activePeerId) ? 'active' : '';
                        const initial = (c.name || 'T')[0].toUpperCase();
                        const img = normalizeImg(c.profilePicture);
                        const avatar = img ? `<img src="${img}" alt="${esc(c.name)}">` : initial;
                        const unread = c.unreadCount > 0 ? `<span class="unread-pill">${c.unreadCount}</span>` : '';
                        return `
                        <div class="chat-item ${active}" data-peer-id="${String(c.peerId).replace(/"/g, '&quot;')}" data-hit="0">
                            <div class="avatar">${avatar}</div>
                            <div class="chat-item-main">
                                <div class="chat-item-top">
                                    <div class="chat-name">${esc(c.name)} ${unread}</div>
                                    <div class="chat-time">${fmtShort(c.lastAt)}</div>
                                </div>
                                <div class="chat-snippet">${esc(c.lastMessage || '')}</div>
                            </div>
                        </div>`;
                    }).join('');
                }
                if (hits.length) {
                    html += `<div style="padding:8px 16px 4px;font-size:0.75rem;font-weight:600;color:#64748b;text-transform:uppercase;">Search results</div>`;
                    html += hits.map(h => {
                        const active = String(h.peerId) === String(activePeerId) ? 'active' : '';
                        const initial = (h.name || 'T')[0].toUpperCase();
                        const img = normalizeImg(h.profilePicture);
                        const avatar = img ? `<img src="${img}" alt="${esc(h.name)}">` : initial;
                        return `
                        <div class="chat-item ${active}" data-peer-id="${String(h.peerId).replace(/"/g, '&quot;')}" data-hit="1">
                            <div class="avatar">${avatar}</div>
                            <div class="chat-item-main">
                                <div class="chat-item-top">
                                    <div class="chat-name">${esc(h.name)}</div>
                                </div>
                                <div class="chat-snippet" style="font-size:0.8rem;color:#94a3b8;">Tap to start a conversation</div>
                            </div>
                        </div>`;
                    }).join('');
                }
                chatItemsEl.innerHTML = html;
                chatItemsEl.querySelectorAll('.chat-item').forEach(el => {
                    el.addEventListener('click', () => openChat(el.getAttribute('data-peer-id')));
                });
            }

            async function runUserSearch() {
                const q = (userSearchEl && userSearchEl.value) ? userSearchEl.value.trim() : '';
                if (q.length < 2) {
                    userSearchHits = [];
                    renderChatList();
                    return;
                }
                try {
                    const res = await fetch('/api/teacher/peer-chats/user-search?q=' + encodeURIComponent(q), { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Search failed');
                    userSearchHits = data.users || [];
                    renderChatList();
                } catch (e) {
                    console.warn(e);
                    userSearchHits = [];
                    renderChatList();
                }
            }

            function renderMessages(messages) {
                if (!messages || messages.length === 0) {
                    chatScrollEl.innerHTML = '<div class="empty-pane">No messages yet. Say hi!</div>';
                    return;
                }
                seenMessageIds.clear();
                chatScrollEl.innerHTML = messages.map(m => {
                    if (m.id) seenMessageIds.add(String(m.id));
                    const isMe = String(m.senderId || '') === String(me || '');
                    const bubbleClass = isMe ? 'message-sent' : 'message-received';
                    const metaClass = isMe ? 'meta-sent' : 'meta-received';
                    return `
                        <div class="message-wrap">
                            <div class="bubble ${bubbleClass}">${esc(m.message)}</div>
                            <div class="bubble-meta ${metaClass}">${fmtTime(m.createdAt)}</div>
                        </div>
                    `;
                }).join('');
                scrollToBottom();
            }

            function appendSingleMessage(m) {
                if (!m) return;
                const id = m.id ? String(m.id) : '';
                if (id && seenMessageIds.has(id)) return;
                if (id) seenMessageIds.add(id);
                const empty = chatScrollEl.querySelector('.empty-pane');
                if (empty) empty.remove();
                const isMe = String(m.senderId || '') === String(me || '');
                const bubbleClass = isMe ? 'message-sent' : 'message-received';
                const metaClass = isMe ? 'meta-sent' : 'meta-received';
                const row = document.createElement('div');
                row.className = 'message-wrap';
                row.innerHTML = `<div class="bubble ${bubbleClass}">${esc(m.message)}</div><div class="bubble-meta ${metaClass}">${fmtTime(m.createdAt)}</div>`;
                chatScrollEl.appendChild(row);
                scrollToBottom();
            }

            function upsertChatFromIncoming(m) {
                const peerId = String(m.senderId) === String(me) ? String(m.recipientId) : String(m.senderId);
                const current = chats.find(c => String(c.peerId) === peerId);
                if (current) {
                    current.lastMessage = m.message;
                    current.lastAt = m.createdAt || new Date().toISOString();
                    if (String(m.senderId) !== String(me) && peerId !== String(activePeerId || '')) {
                        current.unreadCount = (Number(current.unreadCount) || 0) + 1;
                    } else if (peerId === String(activePeerId || '')) {
                        current.unreadCount = 0;
                    }
                } else {
                    chats.unshift({
                        peerId,
                        name: peerId,
                        profilePicture: null,
                        lastMessage: m.message,
                        lastAt: m.createdAt || new Date().toISOString(),
                        unreadCount: String(m.senderId) !== String(me) ? 1 : 0
                    });
                }
                chats.sort((a, b) => new Date(b.lastAt || 0) - new Date(a.lastAt || 0));
                renderChatList();
            }

            async function loadChats() {
                const res = await fetch('/api/teacher/peer-chats', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to load chats');
                chats = data.chats || [];
                renderChatList();
            }

            function mergePeerIntoChats(peerId, partial) {
                const id = String(peerId);
                const idx = chats.findIndex(c => String(c.peerId) === id);
                if (idx >= 0) {
                    chats[idx] = { ...chats[idx], ...partial };
                } else {
                    chats.unshift({
                        peerId: id,
                        name: partial.name || id,
                        profilePicture: partial.profilePicture || null,
                        lastMessage: partial.lastMessage || '',
                        lastAt: partial.lastAt || new Date().toISOString(),
                        unreadCount: partial.unreadCount != null ? partial.unreadCount : 0,
                    });
                }
            }

            async function openChat(peerId) {
                activePeerId = peerId;
                const fromHit = userSearchHits.find(h => String(h.peerId) === String(peerId));
                const peer = chats.find(c => String(c.peerId) === String(peerId)) || fromHit || { peerId, name: peerId };
                if (fromHit && !chats.some(c => String(c.peerId) === String(peerId))) {
                    mergePeerIntoChats(peerId, { name: fromHit.name, profilePicture: fromHit.profilePicture, lastMessage: '', lastAt: new Date().toISOString(), unreadCount: 0 });
                }
                paneNameEl.textContent = peer.name || peerId;
                paneSubEl.textContent = lastSeenText(peer.lastAt);
                const initial = (peer.name || 'T')[0].toUpperCase();
                const img = normalizeImg(peer.profilePicture);
                paneAvatarEl.innerHTML = img ? `<img src="${img}" alt="${esc(peer.name)}">` : initial;
                composerEl.style.display = '';
                messengerEl.classList.add('show-chat');
                renderChatList();

                threadCursor.hasMore = false;
                threadCursor.nextBefore = null;
                threadCursor.loadingOlder = false;
                const res = await fetch(`/api/teacher/peer-messages/${encodeURIComponent(peerId)}?limit=20`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to load messages');
                threadCursor.hasMore = !!data.hasMore;
                threadCursor.nextBefore = data.nextBefore || null;
                renderMessages(data.messages || []);

                chats = chats.map(c => String(c.peerId) === String(peerId) ? { ...c, unreadCount: 0 } : c);
                renderChatList();
            }

            function prependMessages(older) {
                if (!older || !older.length) return;
                const frag = document.createDocumentFragment();
                const prevHeight = chatScrollEl.scrollHeight;
                older.forEach(m => {
                    if (m.id) seenMessageIds.add(String(m.id));
                    const isMe = String(m.senderId || '') === String(me || '');
                    const bubbleClass = isMe ? 'message-sent' : 'message-received';
                    const metaClass = isMe ? 'meta-sent' : 'meta-received';
                    const wrap = document.createElement('div');
                    wrap.className = 'message-wrap';
                    wrap.innerHTML = `<div class="bubble ${bubbleClass}">${esc(m.message)}</div><div class="bubble-meta ${metaClass}">${fmtTime(m.createdAt)}</div>`;
                    frag.appendChild(wrap);
                });
                chatScrollEl.insertBefore(frag, chatScrollEl.firstChild);
                chatScrollEl.scrollTop = chatScrollEl.scrollHeight - prevHeight;
            }

            async function loadOlderMessages() {
                if (!activePeerId || threadCursor.loadingOlder || !threadCursor.hasMore || !threadCursor.nextBefore) return;
                threadCursor.loadingOlder = true;
                try {
                    const u = `/api/teacher/peer-messages/${encodeURIComponent(activePeerId)}?limit=20&before=${encodeURIComponent(threadCursor.nextBefore)}`;
                    const res = await fetch(u, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to load older');
                    threadCursor.hasMore = !!data.hasMore;
                    threadCursor.nextBefore = data.nextBefore || null;
                    prependMessages(data.messages || []);
                } catch (e) {
                    console.warn(e);
                } finally {
                    threadCursor.loadingOlder = false;
                }
            }

            async function sendMessage() {
                const msg = (composerTextEl.value || '').trim();
                if (!msg || !activePeerId) return;
                sendBtnEl.disabled = true;
                const res = await fetch('/api/teacher/peer-message', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipientId: activePeerId, message: msg })
                });
                const data = await res.json();
                sendBtnEl.disabled = false;
                if (!res.ok || !data.success) throw new Error(data.error || 'Failed to send');

                composerTextEl.value = '';
                if (data.peerMessage) {
                    appendSingleMessage(data.peerMessage);
                    upsertChatFromIncoming(data.peerMessage);
                } else {
                    // Fallback: keep legacy behavior if payload shape changes
                    await openChat(activePeerId);
                }
            }

            if (!token || !me) {
                chatItemsEl.innerHTML = '<div style="padding:16px;color:#64748b;">Please log in to view messages.</div>';
                return;
            }

            chatFilterEl.addEventListener('input', () => renderChatList());
            userSearchEl.addEventListener('input', () => {
                clearTimeout(userSearchTimer);
                userSearchTimer = setTimeout(runUserSearch, 320);
            });
            chatScrollEl.addEventListener('scroll', () => {
                if (chatScrollEl.scrollTop < 64) loadOlderMessages();
            });
            sendBtnEl.addEventListener('click', () => sendMessage().catch(e => alert(e.message)));
            composerTextEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage().catch(err => alert(err.message)); }
            });
            backBtnEl.addEventListener('click', () => messengerEl.classList.remove('show-chat'));

            if (socket) {
                socket.on('connect', () => {
                    if (me) socket.emit('join-teacher-messages', { teacherId: me });
                });
                socket.on('peer-message:new', (m) => {
                    if (!m || (!m.senderId && !m.recipientId)) return;
                    const peerId = String(m.senderId) === String(me) ? String(m.recipientId) : String(m.senderId);
                    upsertChatFromIncoming(m);
                    if (peerId === String(activePeerId || '')) {
                        appendSingleMessage(m);
                        fetch(`/api/teacher/peer-messages/${encodeURIComponent(peerId)}?limit=20`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        }).catch(() => {});
                    }
                });
            }

            const params = new URLSearchParams(window.location.search);
            const peerIdFromUrl = params.get('peerId');

            loadChats().then(() => {
                if (peerIdFromUrl) openChat(peerIdFromUrl);
            }).catch(err => {
                console.error(err);
                chatItemsEl.innerHTML = '<div style="padding:16px;color:#64748b;">Failed to load chats.</div>';
            });
        })();
    </script>
</body>
</html>
