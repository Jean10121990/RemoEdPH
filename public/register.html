<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher registration — RemoEdPH</title>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f4f5; color: #18181b; }
    .box { background: #fff; padding: 1.5rem 2rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); max-width: 28rem; text-align: center; }
    p { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <p>Redirecting to secure teacher signup…</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var invitation = (params.get('invitation') || '').trim();
      var appId = (params.get('appId') || '').trim();

      function goTeacherSignup(inv, aid) {
        var q = new URLSearchParams();
        q.set('invitation', inv);
        if (aid) q.set('appId', aid);
        window.location.replace('/teacher-signup?' + q.toString());
      }

      if (invitation) {
        goTeacherSignup(invitation, appId);
        return;
      }

      if (!appId) {
        document.querySelector('.box p').textContent =
          'This sign-up link is missing an invitation. Please use the link from your email.';
        return;
      }

      fetch('/api/auth/teacher-signup/invitation-by-application?appId=' + encodeURIComponent(appId))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.success && data.invitation) {
            goTeacherSignup(String(data.invitation).trim(), appId);
          } else {
            document.querySelector('.box p').textContent =
              (data && data.message) || 'This invitation is invalid or expired. Ask admin to resend your sign-up email.';
          }
        })
        .catch(function () {
          document.querySelector('.box p').textContent =
            'Could not verify this invitation. Please try again or ask admin to resend your email.';
        });
    })();
  </script>
</body>
</html>
