<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Signup - RemoEdPH</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f6f8fc;
      color: #0f172a;
    }
    .card {
      width: min(780px, 92vw);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(2, 6, 23, 0.08);
      overflow: hidden;
    }
    .head {
      padding: 18px 20px;
      border-bottom: 1px solid #eef2f7;
      background: #f8fafc;
    }
    .head h1 { margin: 0; font-size: 1.35rem; }
    .head p { margin: 6px 0 0; color: #64748b; font-size: .92rem; }
    .body { padding: 18px 20px 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 6px; font-size: .85rem; color: #334155; font-weight: 600; }
    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .92rem;
      box-sizing: border-box;
      background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    .actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .status { margin: 10px 0 0; font-size: .9rem; }
    .status.error { color: #dc2626; }
    .status.success { color: #15803d; }
    .readonly {
      background: #f8fafc;
      color: #475569;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>Complete Teacher Signup</h1>
      <p>Invite-only signup. This link is valid only for approved applicants.</p>
    </div>
    <div class="body">
      <form id="teacher-signup-form" novalidate>
        <div class="grid">
          <div class="full">
            <label for="email">Applicant Email</label>
            <input id="email" type="email" class="readonly" readonly />
          </div>
          <div>
            <label for="firstName">First Name</label>
            <input id="firstName" type="text" required />
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input id="lastName" type="text" required />
          </div>
          <div>
            <label for="middleName">Middle Name (optional)</label>
            <input id="middleName" type="text" />
          </div>
          <div>
            <label for="username">Username</label>
            <input id="username" type="text" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" minlength="6" required />
          </div>
          <div>
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" minlength="6" required />
          </div>
          <div>
            <label for="contact">Contact Number</label>
            <input id="contact" type="text" />
          </div>
          <div class="full">
            <label for="address">Address</label>
            <textarea id="address"></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">Activate Teacher Account</button>
        </div>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const invitation = params.get('invitation');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    function setStatus(message, type) {
      statusEl.textContent = message || '';
      statusEl.className = `status ${type || ''}`.trim();
    }

    async function validateToken() {
      if (!invitation) {
        window.location.href = '/';
        return null;
      }
      try {
        const res = await fetch(`/api/auth/teacher-signup/validate?token=${encodeURIComponent(invitation)}`);
        const data = await res.json();
        if (!res.ok || !data.success) {
          window.location.href = '/';
          return null;
        }
        return data.applicant;
      } catch (e) {
        window.location.href = '/';
        return null;
      }
    }

    document.getElementById('cancel-btn').addEventListener('click', () => {
      window.location.href = '/';
    });

    document.getElementById('teacher-signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      setStatus('');

      const firstName = document.getElementById('firstName').value.trim();
      const middleName = document.getElementById('middleName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const contact = document.getElementById('contact').value.trim();
      const address = document.getElementById('address').value.trim();

      if (!username || !password || !firstName || !lastName) {
        setStatus('Please complete required fields.', 'error');
        return;
      }
      if (password.length < 6) {
        setStatus('Password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirmPassword) {
        setStatus('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Activating...';
      try {
        const res = await fetch('/api/auth/teacher-signup/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: invitation,
            firstName,
            middleName,
            lastName,
            username,
            password,
            contact,
            address
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          setStatus(data.message || 'Failed to activate teacher account.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Activate Teacher Account';
          return;
        }
        setStatus('Account activated successfully. Redirecting to teacher login...', 'success');
        setTimeout(() => { window.location.href = '/teacher-login.html'; }, 1200);
      } catch (error) {
        setStatus('Server error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Activate Teacher Account';
      }
    });

    (async function init() {
      const applicant = await validateToken();
      if (!applicant) return;
      document.getElementById('email').value = applicant.email || '';
      const parts = String(applicant.fullName || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 1) document.getElementById('firstName').value = parts[0];
      if (parts.length >= 2) document.getElementById('lastName').value = parts.slice(1).join(' ');
    })();
  </script>
</body>
</html>
