<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/password-strength.css">
</head>
<body class="page-reset-password">
  <div class="reset-container">
    <div class="reset-title">Set a New Password</div>
    <p class="reset-lead">Choose your password now. You can log in with it right after you save.</p>
    <form class="reset-form" id="reset-form">
      <div class="pw-field">
        <label class="reset-label" for="reset-password">New password</label>
        <div class="pw-wrap">
          <input type="password" id="reset-password" placeholder="New password" required autocomplete="new-password">
          <button type="button" class="pw-toggle" id="reset-password-toggle" aria-label="Show password">Show</button>
        </div>
        <div class="pw-meter" id="pw-meter" data-level="idle" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="pw-meter-label" id="pw-meter-label"></p>
        <ul class="pw-reqs" id="pw-reqs">
          <li data-rule="length">At least 8 characters</li>
          <li data-rule="lower">At least 1 lowercase letter</li>
          <li data-rule="upper">At least 1 uppercase letter</li>
          <li data-rule="number">At least 1 number</li>
        </ul>
        <p class="pw-hint" id="pw-hint" hidden></p>
      </div>
      <label class="reset-label" for="reset-password-confirm">Confirm password</label>
      <input type="password" id="reset-password-confirm" placeholder="Re-enter new password" required autocomplete="new-password">
      <button type="submit">Save New Password</button>
    </form>
    <div class="reset-message" id="reset-message"></div>
    <div class="reset-error" id="reset-error"></div>
    <a href="/login/" class="back-link">&larr; Back to Login</a>
  </div>
  <script src="js/password-strength.js"></script>
  <script>
    RemoedPasswordStrength.wire({
      inputId: 'reset-password',
      meterId: 'pw-meter',
      meterLabelId: 'pw-meter-label',
      listId: 'pw-reqs',
      hintId: 'pw-hint',
      toggleId: 'reset-password-toggle'
    });
    function getToken() {
      return new URLSearchParams(window.location.search).get('token');
    }
    document.getElementById('reset-form').onsubmit = async function(e) {
      e.preventDefault();
      const token = getToken();
      const password = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-password-confirm').value;
      const msg = document.getElementById('reset-message');
      const err = document.getElementById('reset-error');
      msg.style.display = 'none';
      err.style.display = 'none';
      if (!token) {
        err.textContent = 'Invalid or missing reset link. Use Forgot Password again.';
        err.style.display = 'block';
        return;
      }
      var strength = RemoedPasswordStrength.analyze(password);
      if (!strength.serverOk) {
        document.getElementById('reset-password').reportValidity();
        return;
      }
      if (password !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return;
      }
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('reset-form').style.display = 'none';
          msg.textContent = data.message || 'Your password has been saved. You can now log in.';
          msg.style.display = 'block';
        } else {
          err.textContent = data.message || 'Failed to save password.';
          err.style.display = 'block';
        }
      } catch (fetchErr) {
        err.textContent = 'Failed to connect to server. Please try again later.';
        err.style.display = 'block';
      }
    };
  </script>
</body>
</html>
