<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/remoed-gtag.js?v=ga-2"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free skill check - RemoEdPH</title>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1ca7e7;
      --blue-deep: #008fc4;
      --blue-soft: #5cb3ff;
      --gold: #ffd700;
      --ink: #1e3a5f;
      --mint: #e8f8ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Nunito, "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 215, 0, 0.28), transparent 28%),
        radial-gradient(circle at 92% 0%, rgba(28, 167, 231, 0.22), transparent 32%),
        linear-gradient(180deg, #f3fbff 0%, #fffdf6 100%);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 56px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--blue-deep);
      font-weight: 800;
      margin-bottom: 16px;
    }
    .brand img { width: 42px; height: 42px; }
    .hero {
      background: linear-gradient(135deg, var(--blue), var(--blue-soft));
      color: #fff;
      text-align: center;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 8px 24px rgba(28, 167, 231, 0.3);
      border: 3px solid rgba(255, 215, 0, 0.85);
    }
    .hero h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.4rem); color: #fff; }
    .hero p { margin: 0; font-size: 1.05rem; }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      margin-top: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    label { display: block; font-weight: 800; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      min-height: 48px;
      border: 3px solid #e8f4fd;
      border-radius: 16px;
      padding: 10px 14px;
      font: inherit;
      color: var(--ink);
      background: #f8fbff;
    }
    .yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    button { font: inherit; cursor: pointer; }
    .choice, .primary, .ghost {
      min-height: 48px;
      border-radius: 16px;
      font-weight: 800;
    }
    .choice {
      border: 3px solid #e8f4fd;
      background: linear-gradient(135deg, #f0f8ff, #fffbf0);
      color: var(--ink);
      padding: 14px;
    }
    .choice.is-selected, .choice:hover {
      border-color: var(--gold);
      background: linear-gradient(135deg, var(--blue), var(--blue-soft));
      color: #fff;
    }
    .primary {
      display: block;
      width: min(100%, 320px);
      margin: 22px auto 0;
      border: 3px solid var(--gold);
      background: linear-gradient(135deg, var(--blue), var(--blue-soft));
      color: #fff;
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(28, 167, 231, 0.35);
      font-size: 1.15rem;
    }
    .primary:hover { transform: translateY(-2px); }
    .q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .pill {
      background: linear-gradient(135deg, var(--blue), var(--blue-soft));
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .bar { flex: 1; height: 12px; background: #e8f4fd; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--blue-soft), var(--gold)); }
    .skill {
      display: inline-block;
      background: var(--mint);
      color: #0b5a22;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    #prompt { font-size: 1.35rem; font-weight: 800; line-height: 1.4; margin: 0 0 8px; }
    .hint { color: #4a6575; margin: 0 0 8px; }
    .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .focus-picks { grid-template-columns: 1fr 1fr; }
    .cam-wrap { display: flex; justify-content: center; margin: 8px 0 4px; }
    .cam-wrap video {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--gold);
      background: #e8f7fc;
    }
    .cam-note { text-align: center; color: #4a6575; font-size: 0.85rem; margin: 0 0 8px; }
    .say-word { text-align: center; font-size: 2.2rem; font-weight: 800; margin: 8px 0; color: var(--ink); }
    .heard { text-align: center; color: var(--blue-deep); font-weight: 800; min-height: 1.4em; margin: 0 0 8px; }
    #my-turn { margin: 0 auto; display: block; }
    .pic {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 148px;
      text-align: center;
    }
    .pic img { width: 96px; height: 96px; object-fit: contain; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .ghost {
      background: #fff;
      color: var(--blue-deep);
      border: 3px solid rgba(0, 143, 196, 0.35);
      padding: 10px 16px;
    }
    .ghost:disabled { opacity: 0.45; cursor: not-allowed; }
    .band {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      background: linear-gradient(135deg, #f0f8ff, #fffbf0);
      border: 3px solid #e8f4fd;
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 10px;
      font-weight: 800;
    }
    .marks { letter-spacing: 3px; color: var(--blue-deep); }
    .result-level {
      text-align: center;
      background: #e8f7fc;
      color: var(--blue-deep);
      border-radius: 16px;
      padding: 14px;
      margin: 16px 0;
      font-weight: 800;
    }
    button:focus, input:focus, select:focus { outline: 3px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }
    @media (max-width: 768px) {
      .choices, .yesno, .focus-picks { grid-template-columns: 1fr; }
      .q-top { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/"><img src="/images/remoed-favicon.png" alt="" /> RemoEdPH</a>
    <header class="hero">
      <h1>Free skill check</h1>
      <p>About 4 minutes. Listening, speaking, pronunciation, and reading. We show bands, not a score.</p>
    </header>

    <section id="start-step" class="card">
      <label for="age-band">Child's age</label>
      <select id="age-band">
        <option value="3-4">3–4 years</option>
        <option value="5-6">5–6 years</option>
      </select>
      <label for="child-first">Child's first name</label>
      <input id="child-first" autocomplete="given-name" maxlength="40" />
      <p id="focus-q"><strong>What should we practice more? Pick any.</strong></p>
      <div class="choices focus-picks" role="group" aria-labelledby="focus-q">
        <button type="button" class="choice" data-skill="listening" aria-pressed="false">Listening</button>
        <button type="button" class="choice" data-skill="speaking" aria-pressed="false">Speaking</button>
        <button type="button" class="choice" data-skill="pronunciation" aria-pressed="false">Pronunciation</button>
        <button type="button" class="choice" data-skill="reading" aria-pressed="false">Reading</button>
      </div>
      <p class="hint" id="start-status" role="status"></p>
      <button type="button" class="primary" id="start-btn">Let's start</button>
    </section>

    <section id="question-step" class="card" hidden>
      <div class="q-top">
        <span class="pill" id="progress">Question 1 of 12</span>
        <div class="bar" aria-hidden="true"><span id="progress-fill"></span></div>
      </div>
      <p class="skill" id="skill-name"></p>
      <p id="prompt"></p>
      <div id="speak-stage" hidden>
        <div class="cam-wrap" id="cam-wrap" hidden>
          <video id="cam" autoplay muted playsinline></video>
        </div>
        <p class="cam-note" id="cam-note" hidden>The camera is only so your child can see their face. We do not save the video.</p>
        <p class="say-word" id="say-word"></p>
        <p class="heard" id="heard-line" aria-live="polite"></p>
        <button type="button" class="primary" id="my-turn">My turn</button>
      </div>
      <div id="choices" class="choices"></div>
      <div class="actions">
        <button type="button" class="ghost" id="play-again">Hear it again</button>
        <button type="button" class="ghost" id="skip-btn">Skip</button>
      </div>
    </section>

    <section id="result-step" class="card" hidden>
      <h2 id="headline"></h2>
      <div id="bands"></div>
      <div class="result-level">
        <p id="level-line"></p>
        <p id="focus-line"></p>
      </div>
      <p class="hint" id="disclaimer"></p>
      <form id="book-form">
        <label for="parent-email">Parent email</label>
        <input id="parent-email" type="email" required autocomplete="email" />
        <label for="contact-number">Contact number</label>
        <input id="contact-number" type="tel" autocomplete="tel" />
        <button type="submit" class="primary" id="book-btn">Book the free lesson</button>
      </form>
      <p id="book-status" role="status"></p>
    </section>
  </main>
  <script>
    (function () {
      var ageBand = '3-4';
      var focusSkills = [];
      var questions = [];
      var index = 0;
      var answers = [];
      var profile = null;
      var voice = null;
      var camStream = null;
      var camGen = 0;
      var recognizer = null;
      var listenGen = 0;
      var PREFERRED = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Karen', 'Moira'];

      function track(name, params) {
        if (typeof remoedTrack === 'function') remoedTrack(name, params || {});
      }
      function show(id) {
        ['start-step', 'question-step', 'result-step'].forEach(function (step) {
          document.getElementById(step).hidden = step !== id;
        });
      }
      function firstName() {
        return String(document.getElementById('child-first').value || '').trim().split(/\s+/)[0];
      }
      function esc(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
      function pickVoice() {
        if (!window.speechSynthesis) return;
        var voices = window.speechSynthesis.getVoices() || [];
        var i, j;
        for (i = 0; i < PREFERRED.length; i += 1) {
          for (j = 0; j < voices.length; j += 1) {
            if (voices[j].name.indexOf(PREFERRED[i]) !== -1) { voice = voices[j]; return; }
          }
        }
        voice = voices.filter(function (item) { return /^en(-|_)US/i.test(item.lang); })[0] ||
          voices.filter(function (item) { return /^en/i.test(item.lang); })[0] || null;
      }
      if (window.speechSynthesis) {
        pickVoice();
        window.speechSynthesis.onvoiceschanged = pickVoice;
      }
      function speak(text, onend) {
        var gen = listenGen;
        if (!window.speechSynthesis || !text) {
          if (onend) setTimeout(function () { if (gen === listenGen && onend) onend(); }, 300);
          return;
        }
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.15;
        if (voice) utterance.voice = voice;
        utterance.onend = function () { if (gen === listenGen && onend) onend(); };
        utterance.onerror = function () { if (gen === listenGen && onend) onend(); };
        setTimeout(function () {
          if (gen !== listenGen || !window.speechSynthesis) return;
          window.speechSynthesis.speak(utterance);
        }, 60);
      }
      function lineFor(q) {
        if (!q) return '';
        if (q.skill === 'listening') return q.sayText || '';
        if (q.kind === 'speak') return q.sayText ? ('Can you say ' + q.sayText + '?') : '';
        if (q.skill === 'reading') return 'Tap the picture for the word you see.';
        return q.prompt || '';
      }
      function wordsOf(value) {
        return String(value || '').toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(function (word) {
          return word.length > 1;
        });
      }
      function heardEnough(transcript, expected) {
        var heard = wordsOf(transcript);
        var want = wordsOf(expected);
        if (!want.length || !heard.length) return false;
        return want.every(function (word) { return heard.indexOf(word) !== -1; });
      }
      function stopMic() {
        listenGen += 1;
        if (recognizer) {
          try { recognizer.onend = function () {}; recognizer.onresult = function () {}; recognizer.abort(); } catch (e) {}
          recognizer = null;
        }
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
      }
      function stopCamera() {
        camGen += 1;
        if (camStream) {
          camStream.getTracks().forEach(function (track) { track.stop(); });
          camStream = null;
        }
        var video = document.getElementById('cam');
        if (video) video.srcObject = null;
        var note = document.getElementById('cam-note');
        if (note) note.hidden = true;
      }
      function startCamera() {
        var wrap = document.getElementById('cam-wrap');
        var video = document.getElementById('cam');
        stopCamera();
        var gen = camGen;
        if (!video || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          if (wrap) wrap.hidden = true;
          return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }).then(function (stream) {
          if (gen !== camGen) {
            stream.getTracks().forEach(function (track) { track.stop(); });
            return;
          }
          camStream = stream;
          video.srcObject = stream;
          if (wrap) wrap.hidden = false;
          var note = document.getElementById('cam-note');
          if (note) note.hidden = false;
          video.play().catch(function () {});
        }).catch(function () {
          if (wrap) wrap.hidden = true;
        });
      }
      function listenFor(q, attempt) {
        var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        var heardLine = document.getElementById('heard-line');
        if (!Rec) {
          if (heardLine) heardLine.textContent = 'Use Chrome so we can hear you. You can skip this one.';
          return;
        }
        var gen = listenGen;
        var last = '';
        try { recognizer = new Rec(); } catch (e) {
          if (heardLine) heardLine.textContent = 'Use Chrome so we can hear you. You can skip this one.';
          return;
        }
        recognizer.lang = 'en-US';
        recognizer.interimResults = true;
        recognizer.maxAlternatives = 5;
        recognizer.onresult = function (ev) {
          if (gen !== listenGen) return;
          var i, j, text = '';
          for (i = 0; i < ev.results.length; i += 1) {
            for (j = 0; j < ev.results[i].length; j += 1) {
              text = ev.results[i][j].transcript || text;
              if (heardEnough(text, q.sayText)) {
                if (heardLine) heardLine.textContent = 'Yes!';
                stopMic();
                choose({ transcript: String(text).slice(0, 200) });
                return;
              }
            }
          }
          last = text;
          if (heardLine && text) heardLine.textContent = 'I heard "' + text + '".';
        };
        recognizer.onerror = function () {};
        recognizer.onend = function () {
          if (gen !== listenGen) return;
          if (attempt < 1) {
            if (heardLine) heardLine.textContent = "Let's try one more time.";
            speak('Try again. Can you say ' + q.sayText + '?', function () { listenFor(q, attempt + 1); });
            return;
          }
          if (!last) {
            if (heardLine) heardLine.textContent = "We didn't hear that. Tap My turn, or Skip.";
            return;
          }
          choose({ transcript: String(last).slice(0, 200) });
        };
        if (heardLine) heardLine.textContent = 'Listening…';
        try { recognizer.start(); } catch (e) {}
      }
      document.querySelectorAll('[data-skill]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var skill = btn.getAttribute('data-skill');
          var at = focusSkills.indexOf(skill);
          if (at === -1) focusSkills.push(skill);
          else focusSkills.splice(at, 1);
          var on = at === -1;
          btn.classList.toggle('is-selected', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          document.getElementById('start-status').textContent = '';
        });
      });

      document.getElementById('start-btn').addEventListener('click', async function () {
        if (!firstName()) {
          document.getElementById('child-first').focus();
          return;
        }
        if (!focusSkills.length) {
          document.getElementById('start-status').textContent = 'Pick at least one skill.';
          return;
        }
        if (window.speechSynthesis) {
          var unlock = new SpeechSynthesisUtterance(' ');
          unlock.volume = 0;
          window.speechSynthesis.speak(unlock);
        }
        ageBand = document.getElementById('age-band').value === '5-6' ? '5-6' : '3-4';
        var res = await fetch('/api/public/skill-assessment/questions?ageBand=' + ageBand);
        var data = await res.json();
        questions = (data.questions || []).slice(0, 12);
        if (!questions.length) {
          alert('The skill check is not available right now.');
          return;
        }
        answers = [];
        index = 0;
        track('assessment_started', { age_band: ageBand });
        show('question-step');
        renderQuestion();
      });

      function renderQuestion() {
        stopMic();
        stopCamera();
        var q = questions[index];
        document.getElementById('progress').textContent = 'Question ' + (index + 1) + ' of ' + questions.length;
        document.getElementById('progress-fill').style.width = Math.round(((index + 1) / questions.length) * 100) + '%';
        var skill = String(q.skill || '');
        document.getElementById('skill-name').textContent = skill ? skill.charAt(0).toUpperCase() + skill.slice(1) : '';
        document.getElementById('prompt').textContent = q.prompt || '';
        var speaking = q.kind === 'speak';
        document.getElementById('speak-stage').hidden = !speaking;
        document.getElementById('play-again').onclick = function () { speak(lineFor(q)); };
        var box = document.getElementById('choices');
        box.innerHTML = '';
        box.className = 'choices';
        if (speaking) {
          document.getElementById('say-word').textContent = q.sayText || '';
          document.getElementById('heard-line').textContent = '';
          startCamera();
          document.getElementById('my-turn').onclick = function () {
            stopMic();
            speak(lineFor(questions[index]), function () { listenFor(questions[index], 0); });
          };
          speak(lineFor(q), function () { listenFor(q, 0); });
          return;
        }
        speak(lineFor(q));
        (q.options || []).forEach(function (label, i) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'choice pic';
          btn.setAttribute('aria-label', label);
          var src = q.imageUrls && q.imageUrls[i] ? q.imageUrls[i] : '';
          btn.innerHTML = src
            ? '<img alt="' + esc(label) + '" src="' + esc(src) + '">'
            : '<span>' + esc(label) + '</span>';
          btn.addEventListener('click', function () { choose({ choiceIndex: i }); });
          box.appendChild(btn);
        });
      }

      function choose(extra) {
        var q = questions[index];
        answers.push(Object.assign({ questionId: q.questionId, skipped: false }, extra));
        next();
      }

      document.getElementById('skip-btn').addEventListener('click', function () {
        stopMic();
        var q = questions[index];
        answers.push({ questionId: q.questionId, skipped: true });
        track('assessment_question_skipped', { question_id: q.questionId });
        next();
      });

      async function next() {
        stopMic();
        stopCamera();
        index += 1;
        if (index < questions.length) {
          renderQuestion();
          return;
        }
        track('assessment_completed');
        var res = await fetch('/api/public/skill-assessment/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ageBand: ageBand,
            focusSkills: focusSkills,
            childFirstName: firstName(),
            answers: answers
          })
        });
        profile = await res.json();
        if (!res.ok) {
          alert(profile.error || 'Could not score the skill check.');
          return;
        }
        track('result_viewed');
        document.getElementById('headline').textContent = profile.headline || '';
        var bandBox = document.getElementById('bands');
        bandBox.innerHTML = '';
        ['listening', 'speaking', 'pronunciation', 'reading'].forEach(function (name) {
          var marks = profile.marks && profile.marks[name] ? profile.marks[name] : 0;
          var label = profile.bands && profile.bands[name] ? profile.bands[name] : 'Not enough information';
          var filled = '';
          for (var i = 1; i <= 3; i += 1) filled += i <= marks ? '●' : '○';
          var row = document.createElement('p');
          row.className = 'band';
          row.innerHTML = '<span>' + esc(name.charAt(0).toUpperCase() + name.slice(1)) + '</span><span><span class="marks" aria-hidden="true">' + filled + '</span> ' + esc(label) + '</span>';
          bandBox.appendChild(row);
        });
        document.getElementById('level-line').textContent = 'Suggested level: ' + (profile.suggestedLevel || '');
        document.getElementById('focus-line').textContent = (profile.practiceLine ? profile.practiceLine + ' ' : '') + 'Suggested focus: ' + (profile.suggestedFocus === 'reading' ? 'Reading Focus' : 'Balanced');
        document.getElementById('disclaimer').textContent = profile.disclaimer || '';
        show('result-step');
      }

      document.getElementById('book-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        track('book_free_lesson_clicked');
        var status = document.getElementById('book-status');
        status.textContent = 'Saving…';
        var res = await fetch('/api/student/send-assessment-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            parentEmail: document.getElementById('parent-email').value,
            childName: firstName(),
            contactNumber: document.getElementById('contact-number').value,
            ageBand: ageBand,
            focusSkills: focusSkills,
            skillAnswers: answers
          })
        });
        var data = await res.json().catch(function () { return {}; });
        if (res.status === 409 && data.trialToken) {
          location.href = '/student-register.html?trial=' + encodeURIComponent(data.trialToken) + '&email=' + encodeURIComponent(document.getElementById('parent-email').value);
          return;
        }
        if (!res.ok || !data.trialToken) {
          status.textContent = data.error || data.message || 'Could not save the skill check.';
          return;
        }
        location.href = '/student-register.html?trial=' + encodeURIComponent(data.trialToken) + '&email=' + encodeURIComponent(document.getElementById('parent-email').value);
      });
    })();
  </script>
</body>
</html>
