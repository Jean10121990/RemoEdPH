<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/user-session.js"></script>
  <script src="js/remoed-auth-token.js"></script>
  <script src="js/security-guard.js?v=3"></script>
  <title>Change Password - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/password-strength.css?v=2">
  <link rel="stylesheet" href="css/password-toggle.css?v=2">
</head>
<body class="page-change-password">
  <div class="change-password-container">
    <div class="remoed-logo">
      <img src="remoed-logo.png" alt="RemoEdPH Logo" style="height: 50px;">
      <span class="remoed-title">RemoEdPH</span>
    </div>
    <div class="welcome-message" id="welcome-message">Set your personal password</div>
    <div class="change-password-title" id="change-password-title">Change Password</div>
    <form class="change-password-form" id="change-password-form">
      <div class="form-group">
        <label for="current-password">Current Password</label>
        <div class="password-input-container">
          <input type="password" id="current-password" class="password-input" placeholder="Enter your current password" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="current-password-toggle" aria-label="Show password"></button>
        </div>
      </div>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="password-input-container">
          <input type="password" id="new-password" class="password-input" placeholder="Enter your new password" required autocomplete="new-password">
          <button type="button" class="password-toggle" id="new-password-toggle" aria-label="Show password"></button>
        </div>
        <div class="pw-meter" id="pw-meter" data-level="idle" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="pw-meter-label" id="pw-meter-label"></p>
        <ul class="pw-reqs" id="pw-reqs">
          <li data-rule="length">At least 8 characters</li>
          <li data-rule="lower">At least 1 lowercase letter</li>
          <li data-rule="upper">At least 1 uppercase letter</li>
          <li data-rule="number">At least 1 number</li>
          <li data-rule="symbol">At least 1 symbol (e.g. ! @ # $ %)</li>
        </ul>
        <p class="pw-hint" id="pw-hint" hidden></p>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <div class="password-input-container">
          <input type="password" id="confirm-password" class="password-input" placeholder="Confirm your new password" required autocomplete="new-password">
          <button type="button" class="password-toggle" id="confirm-password-toggle" aria-label="Show password"></button>
        </div>
      </div>
      <button type="submit" class="change-password-btn" id="change-password-btn">Update Password</button>
    </form>
    <div class="message" id="message"></div>
  </div>
  <script src="js/password-strength.js?v=2"></script>
  <script src="js/password-toggle.js?v=2"></script>
  <script>
    function parseJwtPayload(token) {
      try {
        var parts = String(token || '').split('.');
        if (parts.length < 2) return null;
        var json = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (json.length % 4) json += '=';
        return JSON.parse(atob(json));
      } catch (_e) {
        return null;
      }
    }

    function getChangePasswordToken() {
      if (window.RemoedUserSession && typeof RemoedUserSession.getUserToken === 'function') {
        var t = RemoedUserSession.getUserToken();
        if (t) return t;
      }
      if (window.RemoedAuthToken && typeof RemoedAuthToken.resolveClassroomToken === 'function') {
        var a = RemoedAuthToken.resolveClassroomToken();
        if (a) return a;
      }
      var keys = [
        'remoed_teacher_token',
        'remoed_student_token',
        'remoed_user_token',
        'remoed_teacher_auth',
        'remoed_student_auth',
        'token'
      ];
      for (var i = 0; i < keys.length; i++) {
        try {
          var v = localStorage.getItem(keys[i]) || sessionStorage.getItem(keys[i]);
          if (v) return v;
        } catch (_e2) {}
      }
      return '';
    }

    function resolveUserType(token) {
      var payload = parseJwtPayload(token) || {};
      var fromJwt = String(payload.userType || payload.userRole || payload.role || '').toLowerCase();
      if (fromJwt === 'teacher' || fromJwt === 'student' || fromJwt === 'admin') return fromJwt;
      try {
        var stored = String(localStorage.getItem('userType') || localStorage.getItem('userRole') || '').toLowerCase();
        if (stored === 'teacher' || stored === 'student' || stored === 'admin') return stored;
      } catch (_e) {}
      if (payload.teacherId || payload.teacherMongoId) return 'teacher';
      if (payload.studentId) return 'student';
      return '';
    }

    document.addEventListener('DOMContentLoaded', function() {
      var token = getChangePasswordToken();
      var userType = resolveUserType(token);
      if (!token || !userType) {
        window.location.replace('/login/');
        return;
      }
      try {
        localStorage.setItem('userType', userType);
        localStorage.setItem('userRole', userType);
      } catch (_e) {}
      var welcomeMessage = document.getElementById('welcome-message');
      var changePasswordTitle = document.getElementById('change-password-title');
      if (userType === 'student') {
        welcomeMessage.textContent = 'Set your student password';
        changePasswordTitle.textContent = 'Student Change Password';
      } else if (userType === 'admin') {
        welcomeMessage.textContent = 'Set your admin password';
        changePasswordTitle.textContent = 'Admin Change Password';
      } else {
        welcomeMessage.textContent = 'Set your teacher password';
        changePasswordTitle.textContent = 'Teacher Change Password';
      }
      if (window.RemoedPasswordStrength) {
        RemoedPasswordStrength.wire({
          inputId: 'new-password',
          meterId: 'pw-meter',
          meterLabelId: 'pw-meter-label',
          listId: 'pw-reqs',
          hintId: 'pw-hint'
        });
      }
    });

    document.getElementById('change-password-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var currentPassword = document.getElementById('current-password').value;
      var newPassword = document.getElementById('new-password').value;
      var confirmPassword = document.getElementById('confirm-password').value;
      var submitBtn = document.getElementById('change-password-btn');
      var token = getChangePasswordToken();
      var userType = resolveUserType(token);

      if (window.RemoedPasswordStrength) {
        var strength = RemoedPasswordStrength.analyze(newPassword);
        if (!strength.serverOk) {
          document.getElementById('new-password').reportValidity();
          return;
        }
      }
      if (newPassword !== confirmPassword) {
        showMessage('New passwords do not match.', 'error');
        return;
      }
      if (newPassword === currentPassword) {
        showMessage('New password must be different from current password.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      try {
        var response = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            currentPassword: currentPassword,
            newPassword: newPassword,
            userType: userType
          })
        });
        var data = await response.json().catch(function () { return {}; });
        if (data.success) {
          showMessage('Password updated successfully. Redirecting...', 'success');
          submitBtn.textContent = 'Success';
          setTimeout(function () {
            if (userType === 'teacher') {
              window.location.replace('teacher-dashboard.html');
            } else if (userType === 'admin') {
              window.location.replace('/');
            } else {
              window.location.replace('student-dashboard.html');
            }
          }, 1200);
        } else {
          showMessage(data.message || 'Failed to update password. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      } catch (_err) {
        showMessage('An error occurred. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });

    function showMessage(text, type) {
      var messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
