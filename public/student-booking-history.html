<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜 My Classes - RemoEdPH</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="child-friendly-styles.css">
<link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="style.css">
</head>
<body  class="student-portal page-student-booking-history">
    <div class="remoed-main">
        <div id="student-sidebar-root"></div>
        <script src="js/student-sidebar.js"></script>
        <script>StudentSidebar.render('student-sidebar-root', 'classes');</script>
        <div class="remoed-content">
            <div class="booking-history-container">
                <div class="booking-history-header">
                    <div>
                        <h1 class="booking-history-title" style="font-size: 2rem; font-weight: 800; color: #1CA7E7; text-shadow: 2px 2px 4px rgba(28, 167, 231, 0.2); display: flex; align-items: center; gap: 12px;">
                            <span>📚📶</span>
                            <span>📜 My Classes</span>
                        </h1>
                        <div class="booking-count" id="booking-count">Loading...</div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px;">
                    <div class="filter-tabs">
                        <div class="filter-tab active" data-filter="all">All Bookings</div>
                        <div class="filter-tab" data-filter="upcoming">Upcoming</div>
                        <div class="filter-tab" data-filter="completed">Completed</div>
                        <div class="filter-tab" data-filter="finished">Finished</div>
                        <div class="filter-tab" data-filter="cancelled">Cancelled</div>
                        <div class="filter-tab" data-filter="student-absent">Student Absent</div>
                        <div class="filter-tab" data-filter="teacher-absent">Teacher Absent</div>
                    </div>
                    
                    <div class="view-controls">
                        <span style="font-size: 0.875rem; color: #666; margin-right: 8px;">View:</span>
                        <div class="view-selector">
                            <button class="view-btn active" data-view="all">All</button>
                            <button class="view-btn" data-view="daily">Daily</button>
                            <button class="view-btn" data-view="weekly">Weekly</button>
                            <button class="view-btn" data-view="monthly">Monthly</button>
                        </div>
                    </div>
                </div>

                <div id="bookings-container">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Loading your booking history...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

         <script>
         // Role-based access control
         const userType = localStorage.getItem('userType');
         if (userType !== 'student') {
           alert('Access denied. This page is for students only.');
           window.location.href = 'index.html';
         }
         
         let allBookings = [];
         let currentFilter = 'all';

         // Load booking history on page load
         document.addEventListener('DOMContentLoaded', function() {
             const username = localStorage.getItem('remoedUsername');
             const studentId = localStorage.getItem('studentId');
             
             if (username) {
                 document.getElementById('remoed-username').textContent = username;
                 document.getElementById('avatar-text').textContent = username[0].toUpperCase();
             }
             
             // Load profile picture if available
             if (studentId) {
                 loadProfilePicture(studentId);
             }
             
             document.getElementById('logout-nav').onclick = function() {
                 localStorage.clear();
                 window.location.href = 'student-login.html';
             };
             
             loadBookingHistory();
             setupFilterTabs();
         });

        // Helper function to get Monday of a week
        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Adjust when day is Sunday
            const monday = new Date(d.setDate(diff));
            return monday.getFullYear() + '-' + 
                   String(monday.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(monday.getDate()).padStart(2, '0');
        }
        
        // Load booking history from API
        async function loadBookingHistory() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    console.error('No authentication token found');
                    showError('Please log in to view your booking history');
                    return;
                }

                // Fetch bookings for multiple weeks to get all history
                // Get bookings from the past 6 months
                const allBookingsData = [];
                const today = new Date();
                const weeksToFetch = 26; // 6 months = ~26 weeks
                
                // Fetch bookings in parallel batches to speed up loading
                const fetchPromises = [];
                for (let i = 0; i < weeksToFetch; i++) {
                    const weekDate = new Date(today);
                    weekDate.setDate(today.getDate() - (i * 7));
                    const weekString = getWeekStart(weekDate);
                    
                    fetchPromises.push(
                        fetch(`/api/student/bookings?week=${weekString}`, {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json',
                                'Cache-Control': 'no-cache',
                                'Pragma': 'no-cache'
                            }
                        }).then(async response => {
                            if (response.ok) {
                                const data = await response.json();
                                return data.bookings || [];
                            }
                            return [];
                        }).catch(err => {
                            console.log(`Skipping week ${weekString}:`, err.message);
                            return [];
                        })
                    );
                }
                
                // Wait for all requests to complete
                const results = await Promise.all(fetchPromises);
                results.forEach(bookings => {
                    if (bookings && bookings.length > 0) {
                        allBookingsData.push(...bookings);
                    }
                });
                
                console.log('📋 Total bookings loaded:', allBookingsData.length);
                allBookings = allBookingsData;
                
                // Remove duplicates based on _id
                const uniqueBookings = [];
                const seenIds = new Set();
                allBookings.forEach(booking => {
                    if (booking._id && !seenIds.has(booking._id.toString())) {
                        seenIds.add(booking._id.toString());
                        uniqueBookings.push(booking);
                    }
                });
                allBookings = uniqueBookings;
                
                console.log('📋 Unique bookings after deduplication:', allBookings.length);
                displayBookings(allBookings);
                updateBookingCount(allBookings.length);
            } catch (error) {
                console.error('Error loading booking history:', error);
                if (error.name === 'AbortError') {
                    showError('Request timed out. Please check your connection and try again.');
                } else {
                    showError('Network error. Please check your connection and try again.');
                }
            }
        }

        // Helper: parse booking date/time as UTC then convert to local
        function parseBookingDateTime(booking) {
            const dateStr = booking.date || '';
            const timeStr = booking.time || '00:00';
            const hasTZInfo = /[zZ]|[+-]\d\d:?\d\d$/.test(timeStr) || /[zZ]$/.test(dateStr) || /[+-]\d\d:?\d\d$/.test(dateStr);
            const isoString = hasTZInfo ? `${dateStr}T${timeStr}` : `${dateStr}T${timeStr}Z`;
            return new Date(isoString);
        }
        
        function formatLocalTime(dateObj) {
            return dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }
        
        function getTimeZoneAbbr(dateObj) {
            try {
                const parts = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(dateObj);
                const tz = parts.find(p => p.type === 'timeZoneName');
                return tz ? tz.value : '';
            } catch (e) {
                return '';
            }
        }
        
        // Display bookings based on current filter
        function displayBookings(bookings) {
            const container = document.getElementById('bookings-container');
            
            if (bookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-title">No bookings found</div>
                        <div class="empty-state-text">
                            ${currentFilter === 'all' ? 
                                'You haven\'t made any bookings yet.' : 
                                `No ${currentFilter} bookings found.`
                            }
                        </div>
                        ${currentFilter === 'all' ? 
                            '<a href="student-book.html" class="book-first-class-btn">Book Your First Class</a>' : 
                            ''
                        }
                    </div>
                `;
                return;
            }

            // Sort bookings by date and time (newest first)
            const sortedBookings = [...bookings].sort((a, b) => {
                const dateA = parseBookingDateTime(a);
                const dateB = parseBookingDateTime(b);
                return dateB - dateA;
            });

            container.innerHTML = createBookingsTable(sortedBookings);
        }
        
        // Create Excel-like table
        function createBookingsTable(bookings) {
            const tableRows = bookings.map(booking => {
                const status = getBookingStatus(booking);
                const statusClass = `status-${status.toLowerCase().replace(/\s+/g, '-')}`;
                const date = new Date(booking.date);
                const formattedDate = date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                const localDateTime = parseBookingDateTime(booking);
                const time = `${formatLocalTime(localDateTime)} ${getTimeZoneAbbr(localDateTime)}`;
                const duration = calculateDuration(booking);
                const lesson = booking.lesson || 'N/A';
                const teacherName = getTeacherName(booking);
                
                return `
                    <tr>
                        <td>${formattedDate}</td>
                        <td>${time}</td>
                        <td>${duration}</td>
                        <td>${lesson}</td>
                        <td>${teacherName}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                        <td>
                            <div class="table-actions">
                                ${getTableActions(booking, status)}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            
            return `
                <div class="bookings-table-container">
                    <table class="bookings-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Duration</th>
                                <th>Class/Lesson</th>
                                <th>Teacher</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        // Calculate duration
        function calculateDuration(booking) {
            if (booking.finishedAt && booking.date && booking.time) {
                const startTime = parseBookingDateTime(booking);
                const endTime = new Date(booking.finishedAt);
                const diffMs = endTime - startTime;
                const diffMins = Math.round(diffMs / 60000);
                return diffMins > 0 ? `${diffMins} min` : '25 min';
            }
            return '25 min';
        }
        
        // Get teacher name
        function getTeacherName(booking) {
            if (booking.teacherId) {
                if (typeof booking.teacherId === 'object') {
                    if (booking.teacherId.firstName && booking.teacherId.lastName) {
                        return `${booking.teacherId.firstName} ${booking.teacherId.lastName}`;
                    }
                    return booking.teacherId.username || 'Unknown';
                }
            }
            if (booking.teacherName) return booking.teacherName;
            if (booking.teacher && booking.teacher.name) return booking.teacher.name;
            return 'Unknown Teacher';
        }
        
        // Get table actions
        function getTableActions(booking, status) {
            const actions = [];
            
            if (status === 'Upcoming') {
                if (booking.classroomId) {
                    actions.push(`<a href="live-classroom.html?bookingId=${booking._id}&room=${booking.classroomId}&userType=student" class="action-link">Join</a>`);
                }
            } else if (status === 'Completed' || status === 'Finished') {
                actions.push(`<a href="student-class-table.html" class="action-link">View</a>`);
            } else if (status === 'Past' && booking.status !== 'completed' && booking.status !== 'cancelled') {
                actions.push(`<a href="student-class-table.html" class="action-link">View</a>`);
            }
            
            return actions.join('') || '-';
        }

        // Get booking status
        function getBookingStatus(booking) {
            const now = new Date();
            const bookingDate = parseBookingDateTime(booking);
            const endTime = new Date(bookingDate.getTime() + 25 * 60000); // 25 minutes
            
            // Check for cancelled status
            if (booking.status === 'cancelled') {
                return 'Cancelled';
            }
            
            // Check for absent status
            if (booking.absentType === 'student') {
                return 'Student Absent';
            }
            if (booking.absentType === 'teacher') {
                return 'Teacher Absent';
            }
            
            // Check if class is finished (has finishedAt timestamp)
            if (booking.finishedAt) {
                return 'Finished';
            }
            
            // Check for completed status
            if (booking.status === 'completed') {
                return 'Completed';
            }
            
            // Check if booking is in the future
            if (now < bookingDate) {
                return 'Upcoming';
            }
            
            // Check if booking time has passed
            if (now > endTime) {
                return 'Past';
            }
            
            // Default to in progress if class is currently happening
            return 'In Progress';
        }


        let currentView = 'all';
        
        // Setup filter tabs
        function setupFilterTabs() {
            const filterTabs = document.querySelectorAll('.filter-tab');
            
            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active class from all tabs
                    filterTabs.forEach(t => t.classList.remove('active'));
                    
                    // Add active class to clicked tab
                    tab.classList.add('active');
                    
                    // Update current filter
                    currentFilter = tab.dataset.filter;
                    
                    // Filter and display bookings
                    applyFilters();
                });
            });
            
            // Setup view buttons
            const viewButtons = document.querySelectorAll('.view-btn');
            viewButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    viewButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentView = btn.dataset.view;
                    applyFilters();
                });
            });
        }
        
        // Apply both status and view filters
        function applyFilters() {
            let filtered = filterBookings(allBookings, currentFilter);
            filtered = applyViewFilter(filtered, currentView);
            displayBookings(filtered);
            updateBookingCount(filtered.length);
        }

        // Filter bookings based on selected filter
        function filterBookings(bookings, filter) {
            if (filter === 'all') {
                return bookings;
            }
            
            return bookings.filter(booking => {
                const status = getBookingStatus(booking);
                const statusKey = status.toLowerCase().replace(/\s+/g, '-');
                return statusKey === filter;
            });
        }
        
        // Apply view filter (daily, weekly, monthly)
        function applyViewFilter(bookings, view) {
            if (view === 'all') {
                return bookings;
            }
            
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            return bookings.filter(booking => {
                const bookingDateStr = booking.date;
                if (!bookingDateStr) return false;
                
                const bookingDate = new Date(bookingDateStr + 'T00:00:00');
                const bookingDateOnly = new Date(bookingDate.getFullYear(), bookingDate.getMonth(), bookingDate.getDate());
                
                if (view === 'daily') {
                    return bookingDateOnly.getTime() === today.getTime();
                } else if (view === 'weekly') {
                    const weekStart = new Date(today);
                    const dayOfWeek = today.getDay();
                    const daysToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
                    weekStart.setDate(today.getDate() - daysToMonday);
                    const weekEnd = new Date(weekStart);
                    weekEnd.setDate(weekStart.getDate() + 6);
                    return bookingDateOnly >= weekStart && bookingDateOnly <= weekEnd;
                } else if (view === 'monthly') {
                    return bookingDateOnly.getMonth() === today.getMonth() && 
                           bookingDateOnly.getFullYear() === today.getFullYear();
                }
                
                return true;
            });
        }

        // Update booking count
        function updateBookingCount(count) {
            const countElement = document.getElementById('booking-count');
            countElement.textContent = `${count} booking${count !== 1 ? 's' : ''}`;
        }

        // Request cancellation
        async function requestCancellation(bookingId) {
            if (!confirm('Are you sure you want to request cancellation for this class?')) {
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/student/booking/${bookingId}/request-cancellation`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showSuccess('Cancellation request submitted successfully');
                    loadBookingHistory(); // Reload to update status
                } else {
                    showError('Failed to submit cancellation request');
                }
            } catch (error) {
                console.error('Error requesting cancellation:', error);
                showError('Error requesting cancellation');
            }
        }

        // View feedback
        function viewFeedback(bookingId) {
            // This would open a modal or navigate to feedback page
            alert('Feedback feature coming soon!');
        }

        // Show success message
        function showSuccess(message) {
            // You can implement a proper notification system here
            alert(message);
        }

                 // Show error message
         function showError(message) {
             // You can implement a proper notification system here
             alert('Error: ' + message);
         }
         
         // Load profile picture from backend
         async function loadProfilePicture(studentId) {
             try {
                 const token = localStorage.getItem('token');
                 if (!token) {
                     console.log('🔍 No token found for profile picture');
                     return;
                 }
                 
                 const username = localStorage.getItem('remoedUsername') || 'Student';
                 console.log('🔍 Loading profile picture for studentId:', studentId);
                 console.log('🔍 Username from localStorage:', username);
                 
                 // Add timeout to prevent hanging
                 const controller = new AbortController();
                 const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout
                 
                 const response = await fetch(`/api/student/profile`, {
                     method: 'GET',
                     headers: {
                         'Authorization': `Bearer ${token}`,
                         'Cache-Control': 'no-cache',
                         'Pragma': 'no-cache'
                     },
                     signal: controller.signal
                 });
                 
                 clearTimeout(timeoutId);
                 
                 if (response.ok) {
                     const data = await response.json();
                     console.log('🔍 Profile data for picture:', data);
                    if (data.profile && data.profile.profilePicture && data.profile.profilePicture.trim() !== '') {
                        setAvatar({
                            imageUrl: data.profile.profilePicture,
                            displayName: username,
                            imgSelector: '#profile-image',
                            textSelector: '#avatar-text'
                        });
                    } else {
                        setAvatar({
                            imageUrl: '',
                            displayName: username,
                            imgSelector: '#profile-image',
                            textSelector: '#avatar-text'
                        });
                    }
                 } else {
                     console.log('❌ Failed to load profile data for picture');
                     // Ensure avatar text is visible
                     const profileImage = document.getElementById('profile-image');
                     const avatarText = document.getElementById('avatar-text');
                     if (profileImage && avatarText) {
                         profileImage.style.display = 'none';
                         avatarText.style.display = 'block';
                     }
                 }
             } catch (error) {
                 console.error('❌ Error loading profile picture:', error);
                 // Ensure avatar text is visible on error
                 const profileImage = document.getElementById('profile-image');
                 const avatarText = document.getElementById('avatar-text');
                 if (profileImage && avatarText) {
                     profileImage.style.display = 'none';
                     avatarText.style.display = 'block';
                 }
             }
         }
     </script>
    <script src="avatar-helper.js"></script>
</body>
</html>
