<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/admin-standalone-redirect.js"></script>
    <script src="js/admin-embed-init.js"></script>
    <title>Assessment Answer Key - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="css/portal-chrome-compact.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-admin-assessment-answer-key .answer-key-intro {
            margin: 0 0 20px;
            color: #64748b;
            line-height: 1.5;
        }
        .page-admin-assessment-answer-key .answer-key-banner {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .page-admin-assessment-answer-key .answer-key-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-admin-assessment-answer-key .answer-key-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .page-admin-assessment-answer-key .answer-key-tab {
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .page-admin-assessment-answer-key .answer-key-tab.is-active {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }
        .page-admin-assessment-answer-key .answer-key-panel { display: none; }
        .page-admin-assessment-answer-key .answer-key-panel.is-active { display: block; }
        .page-admin-assessment-answer-key .key-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .page-admin-assessment-answer-key .key-card h3 {
            margin: 0 0 8px;
            color: #1e3a5f;
        }
        .page-admin-assessment-answer-key .key-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        .page-admin-assessment-answer-key .key-table th,
        .page-admin-assessment-answer-key .key-table td {
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            vertical-align: top;
            text-align: left;
        }
        .page-admin-assessment-answer-key .key-table th {
            background: #f8fafc;
            color: #334155;
        }
        .page-admin-assessment-answer-key .key-correct {
            color: #166534;
            font-weight: 700;
        }
        .page-admin-assessment-answer-key .personality-section-title {
            margin: 18px 0 10px;
            color: #4338ca;
            font-size: 1.05rem;
        }
        .page-admin-assessment-answer-key .mapping-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        .page-admin-assessment-answer-key .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .page-admin-assessment-answer-key .chip-list li {
            background: #eef2ff;
            color: #3730a3;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.9rem;
        }
        @media print {
            .page-admin-assessment-answer-key #admin-sidebar-root,
            .page-admin-assessment-answer-key .answer-key-toolbar,
            .page-admin-assessment-answer-key .answer-key-tabs { display: none !important; }
            .page-admin-assessment-answer-key .answer-key-panel { display: block !important; }
            .page-admin-assessment-answer-key .key-card { break-inside: avoid; }
        }
    </style>
</head>
<body class="page-admin-assessment-answer-key page-admin-teacher-assessments">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-sidebar.js"></script>
        <script>if (!window.__ADMIN_EMBED__) { AdminSidebar.render('admin-sidebar-root', 'hr-hub'); }</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Assessment Answer Key</div>
                <p class="answer-key-intro">Trainer reference for grammar, vocabulary, and personality assessments. Use this when reviewing teacher submissions and coaching improvements.</p>
                <div class="answer-key-banner"><strong>Admin only.</strong> Do not share this page with applicants or teachers.</div>

                <div class="answer-key-toolbar">
                    <a href="admin-teacher-assessments.html" class="btn btn-secondary">← Back to Teacher Assessments</a>
                    <button type="button" class="btn btn-primary" id="print-answer-key">Print / Save PDF</button>
                </div>

                <div class="answer-key-tabs" role="tablist" aria-label="Answer key sections">
                    <button type="button" class="answer-key-tab is-active" data-panel="grammar">Grammar</button>
                    <button type="button" class="answer-key-tab" data-panel="vocabulary">Vocabulary</button>
                    <button type="button" class="answer-key-tab" data-panel="personality">Personality</button>
                    <button type="button" class="answer-key-tab" data-panel="performance">Performance tests</button>
                    <button type="button" class="answer-key-tab" data-panel="mappings">H.E.A.R.T. &amp; Code of Honor</button>
                </div>

                <div id="panel-grammar" class="answer-key-panel is-active"></div>
                <div id="panel-vocabulary" class="answer-key-panel"></div>
                <div id="panel-personality" class="answer-key-panel"></div>
                <div id="panel-performance" class="answer-key-panel"></div>
                <div id="panel-mappings" class="answer-key-panel"></div>
            </div>
        </div>
    </div>

    <script src="js/assessment-answer-key-data.js"></script>
    <script>
        (function () {
            if (localStorage.getItem('userType') !== 'admin') {
                alert('Access denied. This page is for admins only.');
                window.location.href = 'index.html';
                return;
            }

            var AK = window.AssessmentAnswerKey;
            if (!AK) return;

            function esc(s) { return AK.escHtml(s); }

            function renderMcqPanel(questions, panelId, title) {
                var panel = document.getElementById(panelId);
                if (!panel) return;
                var rows = questions.map(function (q, idx) {
                    var optionsHtml = q.options.map(function (opt, optIdx) {
                        var cls = optIdx === q.correctIndex ? 'key-correct' : '';
                        var letter = ['A', 'B', 'C', 'D'][optIdx] || String(optIdx + 1);
                        return '<span class="' + cls + '">' + letter + '. ' + esc(opt) + '</span>';
                    }).join('<br>');
                    return '<tr><td>' + (idx + 1) + '</td><td>' + esc(q.question) + '</td><td>' + optionsHtml + '</td></tr>';
                }).join('');

                panel.innerHTML =
                    '<div class="key-card"><h3>' + esc(title) + '</h3>' +
                    '<p style="margin:0 0 12px;color:#64748b;">Green option is the correct answer.</p>' +
                    '<table class="key-table"><thead><tr><th>#</th><th>Question</th><th>Options (correct in green)</th></tr></thead><tbody>' +
                    rows + '</tbody></table></div>';
            }

            function renderPersonalityPanel() {
                var panel = document.getElementById('panel-personality');
                if (!panel) return;
                var html = '<div class="key-card"><h3>Personality scenarios</h3>' +
                    '<p style="margin:0 0 12px;color:#64748b;">Scenarios are mixed within each section. The correct choice depends on the scenario content, not the section number.</p>';

                AK.PERSONALITY_RUBRIC.forEach(function (section, sectionIndex) {
                    var sectionTitle = section.title || ('Section ' + (sectionIndex + 1));
                    html += '<div class="personality-section-title">' + esc(sectionTitle) + '</div>';
                    html += '<table class="key-table"><thead><tr><th>#</th><th>Scenario</th><th>Correct category</th></tr></thead><tbody>';
                    section.items.forEach(function (item, qIndex) {
                        html += '<tr><td>' + (sectionIndex + 1) + '.' + (qIndex + 1) + '</td><td>' + esc(item.text) + '</td><td class="key-correct">' + esc(item.correct) + '</td></tr>';
                    });
                    html += '</tbody></table>';
                });
                html += '</div>';
                panel.innerHTML = html;
            }

            function renderPerformancePanel() {
                var panel = document.getElementById('panel-performance');
                if (!panel) return;
                panel.innerHTML =
                    '<div class="key-card"><h3>Performance-based tests (no fixed MCQ key)</h3>' +
                    '<p style="color:#64748b;">Review recordings and typing metrics manually in Teacher Assessments.</p>' +
                    '<table class="key-table"><tbody>' +
                    '<tr><th>Listening</th><td>Teacher repeats: <span class="key-correct">' + esc(AK.LISTENING_SENTENCE) + '</span></td></tr>' +
                    '<tr><th>Typing</th><td>Speed (WPM) and accuracy — compare to rubric bands in Teacher Assessments.</td></tr>' +
                    '<tr><th>Reading</th><td>Read-aloud recording — assess fluency and clarity.</td></tr>' +
                    '<tr><th>Pronunciation</th><td>Words to record: <span class="key-correct">' + esc(AK.PRONUNCIATION_WORDS.join(', ')) + '</span></td></tr>' +
                    '</tbody></table></div>';
            }

            function renderMappingsPanel() {
                var panel = document.getElementById('panel-mappings');
                if (!panel) return;
                var heartRows = AK.HEART_METERS.map(function (row) {
                    return '<tr><td>' + esc(row.label) + '</td><td class="key-correct">' + esc(row.category) + '</td></tr>';
                }).join('');
                var honorRows = AK.HONOR_METERS.map(function (row) {
                    return '<tr><td>' + esc(row.label) + '</td><td class="key-correct">' + esc(row.category) + '</td></tr>';
                }).join('');
                panel.innerHTML =
                    '<div class="mapping-grid">' +
                    '<div class="key-card"><h3>H.E.A.R.T. mapping</h3><p style="color:#64748b;">Pass threshold: ' + AK.COMMITMENT_PASS_PERCENT + '%+ per value.</p>' +
                    '<table class="key-table"><thead><tr><th>Value</th><th>Personality category</th></tr></thead><tbody>' + heartRows + '</tbody></table></div>' +
                    '<div class="key-card"><h3>Code of Honor mapping</h3><p style="color:#64748b;">Pass threshold: ' + AK.COMMITMENT_PASS_PERCENT + '%+ per value.</p>' +
                    '<table class="key-table"><thead><tr><th>Value</th><th>Personality category</th></tr></thead><tbody>' + honorRows + '</tbody></table></div>' +
                    '</div>' +
                    '<div class="key-card"><h3>Personality categories</h3><ul class="chip-list">' +
                    AK.PERSONALITY_CATEGORIES.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') +
                    '</ul></div>';
            }

            renderMcqPanel(AK.GRAMMAR_QUESTIONS, 'panel-grammar', 'Grammar (5 questions)');
            renderMcqPanel(AK.VOCABULARY_QUESTIONS, 'panel-vocabulary', 'Vocabulary (5 questions)');
            renderPersonalityPanel();
            renderPerformancePanel();
            renderMappingsPanel();

            document.querySelectorAll('.answer-key-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    var panelId = 'panel-' + tab.getAttribute('data-panel');
                    document.querySelectorAll('.answer-key-tab').forEach(function (t) {
                        t.classList.toggle('is-active', t === tab);
                    });
                    document.querySelectorAll('.answer-key-panel').forEach(function (panel) {
                        panel.classList.toggle('is-active', panel.id === panelId);
                    });
                });
            });

            var printBtn = document.getElementById('print-answer-key');
            if (printBtn) {
                printBtn.addEventListener('click', function () { window.print(); });
            }
        })();
    </script>
</body>
</html>
