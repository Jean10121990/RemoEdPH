<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Schedule - RemoEdPH Admin</title>
    <script src="js/admin-embed-init.js"></script>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <link rel="stylesheet" href="css/portal-chrome-compact.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <style>
        .as-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
        .as-toolbar select, .as-toolbar button { padding:8px 12px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; cursor:pointer; }
        .as-hint { font-size:0.82rem; color:#64748b; margin:0 0 12px; }
        .as-legend { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; font-size:0.8rem; color:#475569; }
        .as-legend span { display:inline-flex; align-items:center; gap:6px; }
        .as-swatch { width:16px; height:16px; border-radius:4px; border:1px solid #cbd5e1; display:inline-block; }
        .as-grid { overflow:auto; border:1px solid #e2e8f0; border-radius:12px; background:#fff; }
        .as-grid table { border-collapse:collapse; min-width:100%; font-size:0.82rem; }
        .as-grid th, .as-grid td { border:1px solid #e2e8f0; padding:6px 8px; vertical-align:top; min-width:90px; }
        .as-grid th { background:#f8fafc; position:sticky; top:0; z-index:1; }
        .as-slot { border-radius:6px; padding:4px 6px; margin-bottom:4px; cursor:pointer; font-size:0.75rem; font-weight:600; }
        .as-slot--booked { background:#ffe85a; color:#4338ca; }
        .as-slot--booked:hover { background:#facc15; }
        .as-slot--open { background:#90EE90; color:#14532d; }
        .as-slot--open:hover { background:#86efac; }
        .as-slot--unbooked { background:#f8f9fa; color:#6c757d; font-weight:500; }
        .as-slot--closed { background:#fff; color:#94a3b8; border:1px dashed #cbd5e1; font-weight:500; }
        .as-slot--cancelled { background:#f1f5f9; color:#64748b; font-weight:500; }
        .as-drawer { position:fixed; right:0; top:0; bottom:0; width:min(400px,94vw); background:linear-gradient(180deg,#f8fbff 0%,#fff 120px); box-shadow:-8px 0 32px rgba(15,23,42,.14); padding:0; z-index:9000; transform:translateX(110%); transition:transform .22s ease; overflow:auto; border-left:1px solid #e2e8f0; }
        .as-drawer.open { transform:translateX(0); }
        .as-drawer-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 18px 14px; border-bottom:1px solid #e8f4fd; background:#fff; position:sticky; top:0; z-index:2; }
        .as-drawer-head h3 { margin:0; font-size:1.1rem; color:#0f172a; font-weight:800; }
        .as-drawer-head p { margin:4px 0 0; font-size:0.8rem; color:#64748b; }
        .as-drawer-close { border:none; background:#f1f5f9; width:36px; height:36px; border-radius:10px; font-size:1.25rem; line-height:1; cursor:pointer; color:#334155; flex-shrink:0; }
        .as-drawer-close:hover { background:#e2e8f0; }
        .as-drawer-body { padding:16px 18px 28px; }
        .as-status-pill { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:0.72rem; font-weight:800; text-transform:capitalize; letter-spacing:0.02em; }
        .as-status-pill--booked, .as-status-pill--pending, .as-status-pill--confirmed { background:#fef9c3; color:#854d0e; }
        .as-status-pill--completed { background:#dcfce7; color:#166534; }
        .as-status-pill--cancelled, .as-status-pill--cancelled_by_student_emergency { background:#fee2e2; color:#991b1b; }
        .as-status-pill--open { background:#dcfce7; color:#14532d; }
        .as-status-pill--unbooked { background:#f1f5f9; color:#64748b; }
        .as-status-pill--closed { background:#f8fafc; color:#94a3b8; border:1px dashed #cbd5e1; }
        .as-detail-card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(15,23,42,.04); }
        .as-detail-row { display:grid; grid-template-columns:92px 1fr; gap:8px 12px; align-items:start; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:0.88rem; }
        .as-detail-row:last-child { border-bottom:none; padding-bottom:0; }
        .as-detail-row:first-child { padding-top:0; }
        .as-detail-k { color:#64748b; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.03em; padding-top:2px; }
        .as-detail-v { color:#0f172a; font-weight:600; word-break:break-word; }
        .as-detail-v small { display:block; margin-top:2px; font-weight:500; color:#94a3b8; font-size:0.75rem; }
        .as-drawer-actions { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
        .as-drawer-actions a { display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:10px; font-size:0.85rem; font-weight:700; text-decoration:none; }
        .as-drawer-actions a.primary { background:linear-gradient(90deg,#008fc4,#1ca7e7); color:#fff; }
        .as-drawer-actions a.secondary { background:#f1f5f9; color:#334155; }
        .as-drawer-empty { color:#b91c1c; font-size:0.9rem; margin:0; }
    </style>
</head>
<body class="page-admin-schedule">
<div class="remoed-main">
    <div id="admin-sidebar-root"></div>
    <script src="js/admin-session.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script>AdminSidebar.render('admin-sidebar-root', 'hr-hub');</script>
    <div class="remoed-content">
        <div class="remoed-section">
            <div class="remoed-section-title">Teacher Schedule</div>
            <div class="as-toolbar">
                <select id="as-teacher"><option value="">All teachers</option></select>
                <select id="as-view">
                    <option value="day">Day</option>
                    <option value="week" selected>Week</option>
                    <option value="month">Month</option>
                </select>
                <button type="button" id="as-prev">←</button>
                <button type="button" id="as-today">Today</button>
                <button type="button" id="as-next">→</button>
                <button type="button" id="as-refresh">Refresh</button>
                <span id="as-range-label" style="font-weight:600;margin-left:8px;"></span>
            </div>
            <p class="as-hint">Same Open / Booked / Unbooked slots as the teacher schedule. Empty cells are closed (not opened). This grid refreshes automatically when teachers change availability.</p>
            <div class="as-legend" aria-label="Slot legend">
                <span><i class="as-swatch" style="background:#90EE90"></i> Open</span>
                <span><i class="as-swatch" style="background:#ffe85a"></i> Booked</span>
                <span><i class="as-swatch" style="background:#f8f9fa"></i> Unbooked</span>
                <span><i class="as-swatch" style="background:#fff;border-style:dashed"></i> Closed / not opened</span>
            </div>
            <div class="as-grid" id="as-grid"><p class="muted" style="padding:16px;">Loading…</p></div>
        </div>
    </div>
</div>
<div class="as-drawer" id="as-drawer" aria-hidden="true">
    <div class="as-drawer-head">
        <div>
            <h3 id="as-drawer-title">Details</h3>
            <p id="as-drawer-subtitle">Teacher schedule</p>
        </div>
        <button type="button" class="as-drawer-close" id="as-drawer-close" aria-label="Close">×</button>
    </div>
    <div class="as-drawer-body" id="as-drawer-body"></div>
</div>
<script>
(function(){
    const DateTime = luxon.DateTime;
    const ZONE = 'Asia/Manila';
    const REFRESH_MS = 30000;
    let anchor = DateTime.now().setZone(ZONE).startOf('day');
    let view = 'week';
    let teachers = [];
    let bookings = [];
    let slots = [];
    let selectedTeacher = '';
    function token(){ return (window.RemoedAdminSession && RemoedAdminSession.getAuthToken()) || localStorage.getItem('remoed_admin_token') || localStorage.getItem('adminToken') || ''; }
    function rangeForView(){
        if(view==='day') return { start: anchor, end: anchor };
        if(view==='month') return { start: anchor.startOf('month'), end: anchor.endOf('month') };
        return { start: anchor.startOf('week'), end: anchor.endOf('week') };
    }
    function padTime(t){
        const parts = String(t || '').split(':');
        const h = parseInt(parts[0], 10);
        const m = parts[1] != null ? parseInt(parts[1], 10) : 0;
        const hh = Number.isFinite(h) ? h : 0;
        const mm = Number.isFinite(m) ? m : 0;
        return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }
    function normId(id){ return String(id || '').trim().toLowerCase(); }
    function teacherLabel(tid){
        const n = normId(tid);
        const t = teachers.find(x => normId(x.teacherId) === n || normId(x.name) === n || normId(x.email) === n);
        return (t && (t.name || t.teacherId)) || tid || '';
    }
    function isCancelled(status){ return String(status || '').toLowerCase().startsWith('cancelled'); }
    function isPastSlot(dateStr, timeStr){
        const slot = DateTime.fromISO(String(dateStr).slice(0, 10) + 'T' + padTime(timeStr), { zone: ZONE });
        if (!slot.isValid) return false;
        return slot < DateTime.now().setZone(ZONE);
    }
    function showAllTeachers(){ return !selectedTeacher; }
    async function load(){
        const r = rangeForView();
        document.getElementById('as-range-label').textContent = r.start.toFormat('MMM d') + ' – ' + r.end.toFormat('MMM d, yyyy');
        selectedTeacher = document.getElementById('as-teacher').value;
        const qs = new URLSearchParams({ start: r.start.toISODate(), end: r.end.toISODate(), view, t: String(Date.now()) });
        if(selectedTeacher) qs.set('teacherId', selectedTeacher);
        const res = await fetch('/api/admin/schedule?' + qs, { headers:{ Authorization:'Bearer '+token() }, credentials:'include' });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Load failed');
        bookings = data.bookings || [];
        slots = data.slots || [];
        if(!teachers.length && data.teachers){
            teachers = data.teachers;
            const sel = document.getElementById('as-teacher');
            const cur = sel.value;
            sel.innerHTML = '<option value="">All teachers</option>' + teachers.map(t=>'<option value="'+esc(t.teacherId)+'">'+esc(t.name||t.teacherId)+'</option>').join('');
            if(cur) sel.value = cur;
            const urlT = new URLSearchParams(location.search).get('teacherId');
            if(urlT) sel.value = urlT;
            selectedTeacher = sel.value;
        }
        renderGrid(r);
    }
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function cellKey(date, time){ return String(date).slice(0, 10) + '|' + padTime(time); }
    function teacherSlotKey(date, time, teacherId){ return cellKey(date, time) + '|' + normId(teacherId); }
    function renderGrid(r){
        const days = [];
        let d = r.start;
        while(d <= r.end){ days.push(d); d = d.plus({ days:1 }); }
        const bookingsByCell = {};
        const activeBookedKeys = new Set();
        bookings.forEach(b=>{
            const k = cellKey(b.date, b.time);
            if(!bookingsByCell[k]) bookingsByCell[k]=[];
            bookingsByCell[k].push(b);
            if (!isCancelled(b.status)) activeBookedKeys.add(teacherSlotKey(b.date, b.time, b.teacherId));
        });
        const slotsByCell = {};
        slots.forEach(s=>{
            const k = cellKey(s.date, s.time);
            if(!slotsByCell[k]) slotsByCell[k]=[];
            slotsByCell[k].push(s);
        });
        const times = [];
        for (let h = 6; h < 24; h++) {
            times.push(String(h).padStart(2, '0') + ':00');
            times.push(String(h).padStart(2, '0') + ':30');
        }
        let html = '<table><thead><tr><th>Time</th>';
        days.forEach(day=>{ html += '<th>'+day.toFormat('EEE M/d')+'</th>'; });
        html += '</tr></thead><tbody>';
        times.forEach(slot=>{
            html += '<tr><th>'+slot+'</th>';
            days.forEach(day=>{
                const key = day.toISODate() + '|' + slot;
                html += '<td>';
                (bookingsByCell[key]||[]).forEach(b=>{
                    const cls = isCancelled(b.status) ? 'as-slot as-slot--cancelled' : 'as-slot as-slot--booked';
                    const who = showAllTeachers() ? esc(teacherLabel(b.teacherId)) + '<br>' : '';
                    html += '<div class="'+cls+'" data-kind="booking" data-id="'+esc(b._id)+'">'+who+'<small>'+esc(b.status)+'</small></div>';
                });
                (slotsByCell[key]||[]).forEach(s=>{
                    if (activeBookedKeys.has(teacherSlotKey(s.date, s.time, s.teacherId))) return;
                    const who = showAllTeachers() ? '<br><small>'+esc(teacherLabel(s.teacherId))+'</small>' : '';
                    if (s.available === false || String(s.slotStatus||'').toLowerCase() === 'booked') {
                        html += '<div class="as-slot as-slot--closed" data-kind="slot" data-id="'+esc(s._id)+'">Closed'+who+'</div>';
                        return;
                    }
                    if (isPastSlot(s.date, s.time)) {
                        html += '<div class="as-slot as-slot--unbooked" data-kind="slot" data-id="'+esc(s._id)+'">Unbooked'+who+'</div>';
                        return;
                    }
                    html += '<div class="as-slot as-slot--open" data-kind="slot" data-id="'+esc(s._id)+'">Open'+who+'</div>';
                });
                html += '</td>';
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('as-grid').innerHTML = html;
        document.querySelectorAll('.as-slot').forEach(el=>{
            el.addEventListener('click', ()=>{
                if (el.dataset.kind === 'slot') openSlotDrawer(el.dataset.id);
                else openDrawer(el.dataset.id);
            });
        });
    }
    function statusPillClass(status){
        const s = String(status || '').toLowerCase().replace(/\s+/g, '_');
        if (s.startsWith('cancelled')) return 'as-status-pill as-status-pill--cancelled';
        if (s === 'completed') return 'as-status-pill as-status-pill--completed';
        if (s === 'open') return 'as-status-pill as-status-pill--open';
        if (s === 'unbooked') return 'as-status-pill as-status-pill--unbooked';
        if (s === 'closed') return 'as-status-pill as-status-pill--closed';
        return 'as-status-pill as-status-pill--booked';
    }
    function formatScheduleDate(dateStr, timeStr){
        const datePart = String(dateStr || '').slice(0, 10);
        const timePart = padTime(timeStr || '');
        try {
            const dt = DateTime.fromISO(datePart + 'T' + timePart, { zone: ZONE });
            if (dt.isValid) return dt.toFormat("ccc, LLL d, yyyy · h:mm a");
        } catch (_e) {}
        return (datePart + (timePart ? ' ' + timePart : '')).trim() || '—';
    }
    function openDrawerShell(title, subtitle){
        document.getElementById('as-drawer-title').textContent = title || 'Details';
        document.getElementById('as-drawer-subtitle').textContent = subtitle || 'Teacher schedule';
        document.getElementById('as-drawer').classList.add('open');
        document.getElementById('as-drawer').setAttribute('aria-hidden', 'false');
    }
    function openSlotDrawer(id){
        const s = slots.find(x => String(x._id) === String(id));
        if (!s) return;
        const t = teachers.find(x => normId(x.teacherId) === normId(s.teacherId));
        const past = isPastSlot(s.date, s.time);
        const state = (s.available === false || String(s.slotStatus||'').toLowerCase() === 'booked')
            ? 'Closed'
            : (past ? 'Unbooked' : 'Open');
        openDrawerShell(state + ' slot', 'Availability details');
        document.getElementById('as-drawer-body').innerHTML =
            '<div class="as-detail-card">'+
            '<div style="margin-bottom:12px;"><span class="'+statusPillClass(state)+'">'+esc(state)+'</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">Teacher</span><span class="as-detail-v">'+esc(teacherLabel(s.teacherId))+'</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">When</span><span class="as-detail-v">'+esc(formatScheduleDate(s.date, s.time))+'</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">State</span><span class="as-detail-v">'+esc(state)+'</span></div>'+
            '</div>'+
            '<div class="as-drawer-actions">'+
            (t && t.mongoId
                ? '<a class="primary" href="/admin/admin-view-user-profile.html?type=teacher&id='+encodeURIComponent(t.mongoId)+'" target="_blank" rel="noopener">View teacher profile</a>'
                : '')+
            (s.teacherId
                ? '<a class="secondary" href="admin-teacher-schedule.html?teacherId='+encodeURIComponent(s.teacherId)+'">Filter schedule by teacher</a>'
                : '')+
            '</div>';
    }
    async function openDrawer(id){
        openDrawerShell('Booking', 'Loading class details…');
        document.getElementById('as-drawer-body').innerHTML = '<p class="as-hint" style="margin:0;">Loading…</p>';
        const res = await fetch('/api/admin/booking/'+id, { headers:{ Authorization:'Bearer '+token() } });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) {
            document.getElementById('as-drawer-subtitle').textContent = 'Could not load';
            document.getElementById('as-drawer-body').innerHTML =
                '<p class="as-drawer-empty">'+(esc(data.error)||'Could not load booking')+'</p>';
            return;
        }
        const b = data.booking || data;
        const dateStr = String(b.date || '').slice(0, 10);
        const timeStr = String(b.time || '');
        const status = String(b.status || 'Booked');
        const studentLabel = b.studentName || b.studentId || '—';
        const teacherDisplay = b.teacherName || teacherLabel(b.teacherId) || b.teacherId || '—';
        const t = teachers.find(x=>normId(x.teacherId)===normId(b.teacherId));
        const teacherProfileId = b.teacherMongoId || (t && t.mongoId) || '';
        const studentProfileId = b.studentMongoId || '';
        document.getElementById('as-drawer-subtitle').textContent = formatScheduleDate(dateStr, timeStr);
        document.getElementById('as-drawer-body').innerHTML =
            '<div class="as-detail-card">'+
            '<div style="margin-bottom:12px;"><span class="'+statusPillClass(status)+'">'+esc(status)+'</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">Student</span><span class="as-detail-v">'+esc(studentLabel)+
            (b.studentId && b.studentName && String(b.studentName) !== String(b.studentId)
                ? '<small>'+esc(b.studentId)+'</small>' : '')+
            '</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">Teacher</span><span class="as-detail-v">'+esc(teacherDisplay)+
            (b.teacherId ? '<small>'+esc(b.teacherId)+'</small>' : '')+
            '</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">When</span><span class="as-detail-v">'+esc(formatScheduleDate(dateStr, timeStr))+'</span></div>'+
            '<div class="as-detail-row"><span class="as-detail-k">Lesson</span><span class="as-detail-v">'+esc(b.lesson || '—')+'</span></div>'+
            (b.studentLevel
                ? '<div class="as-detail-row"><span class="as-detail-k">Level</span><span class="as-detail-v">'+esc(b.studentLevel)+'</span></div>'
                : '')+
            (b.classroomId
                ? '<div class="as-detail-row"><span class="as-detail-k">Room</span><span class="as-detail-v">'+esc(b.classroomId)+'</span></div>'
                : '')+
            '</div>'+
            '<div class="as-drawer-actions">'+
            (studentProfileId
                ? '<a class="primary" href="/admin/admin-view-user-profile.html?type=student&id='+encodeURIComponent(studentProfileId)+'" target="_blank" rel="noopener">View student profile</a>'
                : '')+
            (teacherProfileId
                ? '<a class="'+(studentProfileId ? 'secondary' : 'primary')+'" href="/admin/admin-view-user-profile.html?type=teacher&id='+encodeURIComponent(teacherProfileId)+'" target="_blank" rel="noopener">View teacher profile</a>'
                : (b.teacherId
                    ? '<a class="secondary" href="admin-teacher-schedule.html?teacherId='+encodeURIComponent(b.teacherId)+'">Filter by this teacher</a>'
                    : ''))+
            '</div>';
    }
    document.getElementById('as-view').onchange = e=>{ view=e.target.value; load().catch(console.error); };
    document.getElementById('as-teacher').onchange = ()=> load().catch(console.error);
    document.getElementById('as-prev').onclick = ()=>{ anchor = anchor.minus(view==='month'?{months:1}:view==='week'?{weeks:1}:{days:1}); load().catch(console.error); };
    document.getElementById('as-next').onclick = ()=>{ anchor = anchor.plus(view==='month'?{months:1}:view==='week'?{weeks:1}:{days:1}); load().catch(console.error); };
    document.getElementById('as-today').onclick = ()=>{ anchor = DateTime.now().setZone(ZONE).startOf('day'); load().catch(console.error); };
    document.getElementById('as-refresh').onclick = ()=> load().catch(console.error);
    document.getElementById('as-drawer-close').onclick = ()=> {
        document.getElementById('as-drawer').classList.remove('open');
        document.getElementById('as-drawer').setAttribute('aria-hidden', 'true');
    };
    setInterval(()=>{
        if (document.hidden) return;
        if (document.getElementById('as-drawer').classList.contains('open')) return;
        load().catch(console.error);
    }, REFRESH_MS);
    load().catch(e=>{ document.getElementById('as-grid').innerHTML='<p style="color:#b91c1c;padding:16px;">'+e.message+'</p>'; });
})();
</script>
</body>
</html>
