<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unique Link Commission - RemoEdPH Admin</title>
  <link rel="stylesheet" href="modern-styles.css">
  <link rel="stylesheet" href="css/teacher-sidebar.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6fbff; }
    .remoed-main { display: flex; min-height: calc(100vh - 70px); }
    .remoed-content { flex: 1; padding: 12px 16px; }
    .remoed-section { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(28,167,231,0.07); padding: 14px; margin-bottom: 12px; }
    .remoed-section-title { font-size: 1rem; font-weight: 700; color: #1ca7e7; margin-bottom: 12px; letter-spacing: 0.5px; display:flex; align-items:center; gap:10px; }
    .pill { display:inline-flex; align-items:center; gap:8px; padding:8px 10px; border-radius:999px; border:1px solid #e2e8f0; background:#f8fafc; font-weight:700; color:#0f172a; font-size:0.85rem; }
    .grid { display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap:10px; }
    .card { background:#ffffff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; }
    .card h3 { margin:0 0 8px 0; font-size:0.95rem; color:#0f172a; }
    .big { font-size:1.6rem; font-weight:800; color:#0f172a; }
    .muted { color:#64748b; font-size:0.85rem; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
    label { font-size:0.8rem; font-weight:700; color:#334155; display:block; margin-bottom:4px; }
    select, input { padding:8px 10px; border:1px solid #d1d5db; border-radius:8px; font-size:0.85rem; background:#fff; }
    button { padding:9px 14px; border:none; border-radius:8px; background:#1ca7e7; color:#fff; font-weight:800; cursor:pointer; }
    button.secondary { background:#64748b; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { padding:10px 8px; border-bottom:1px solid #e5e7eb; font-size:0.85rem; text-align:left; vertical-align:top; }
    th { background:#f8fafc; color:#0f172a; font-weight:800; position:sticky; top:0; z-index:1; }
    .linkbox { display:flex; flex-direction:column; gap:6px; }
    .linkbox a { color:#2563eb; text-decoration:none; font-weight:700; word-break:break-all; }
    .tag { display:inline-flex; padding:2px 8px; border-radius:999px; font-size:0.75rem; font-weight:800; border:1px solid #c7d2fe; background:#eef2ff; color:#3730a3; }
    .empty { padding:28px; text-align:center; color:#64748b; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="remoed-main">
    <div id="admin-sidebar-root"></div>
    <script src="js/admin-sidebar.js"></script>
    <script>AdminSidebar.render('admin-sidebar-root', 'unique-link-commission');</script>

    <div class="remoed-content">
      <div class="remoed-section">
        <div class="remoed-section-title">🔗 Unique Link Commission</div>

        <div class="controls" style="margin-bottom: 12px;">
          <div>
            <label>Teacher</label>
            <select id="teacher-filter">
              <option value="">All Teachers</option>
            </select>
          </div>
          <div>
            <label>From</label>
            <input type="date" id="from-date" />
          </div>
          <div>
            <label>To</label>
            <input type="date" id="to-date" />
          </div>
          <div>
            <button type="button" onclick="loadReferrals()">Load</button>
            <button type="button" class="secondary" onclick="loadTeachers()">Refresh teachers</button>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <h3>Total Commission</h3>
            <div class="big" id="total-commission">₱0</div>
            <div class="muted">25 pesos per successful enrollee</div>
          </div>
          <div class="card">
            <h3>Successful Enrollees</h3>
            <div class="big" id="total-enrollees">0</div>
            <div class="muted">Tracked from subscription activation</div>
          </div>
          <div class="card">
            <h3>Total Amount</h3>
            <div class="big" id="total-amount">₱0</div>
            <div class="muted">Subscription value (from planPrice)</div>
          </div>
        </div>
      </div>

      <div class="remoed-section">
        <div class="remoed-section-title">✅ Successful Enrollees</div>
        <div style="overflow:auto; max-height: 520px;">
          <table>
            <thead>
              <tr>
                <th>Teacher</th>
                <th>Student</th>
                <th>Contact</th>
                <th>Plan</th>
                <th>Amount</th>
                <th>Commission</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="referrals-tbody"></tbody>
          </table>
        </div>
        <div id="referrals-empty" class="empty" style="display:none;">No referrals found.</div>
      </div>
    </div>
  </div>

  <script>
    const userType = localStorage.getItem('userType');
    if (userType !== 'admin') {
      alert('Access denied. This page is for administrators only.');
      window.location.href = 'admin-login.html';
    }

    function getToken() {
      // IMPORTANT: Only accept adminToken here.
      // Some browsers/dev sessions may still have a teacher token in `token`,
      // which would cause 403 "Admin privileges required".
      return localStorage.getItem('adminToken') || '';
    }

    function fmtPeso(n) {
      const v = Number(n || 0) || 0;
      return '₱' + v.toLocaleString();
    }

    async function loadTeachers() {
      const token = getToken();
      if (!token) throw new Error('Missing admin token. Please log in again as admin.');
      const res = await fetch('/api/admin/referrals/teachers', { headers: { Authorization: 'Bearer ' + token }});
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.message || data.error || `Failed to load teachers (${res.status})`);

      const select = document.getElementById('teacher-filter');
      select.innerHTML = '<option value="">All Teachers</option>';
      data.teachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.teacherId;
        opt.textContent = t.teacherName;
        select.appendChild(opt);
      });
    }

    async function loadReferrals() {
      const token = getToken();
      if (!token) throw new Error('Missing admin token. Please log in again as admin.');
      const teacherId = document.getElementById('teacher-filter').value;
      const from = document.getElementById('from-date').value;
      const to = document.getElementById('to-date').value;

      const params = new URLSearchParams();
      if (teacherId) params.set('teacherId', teacherId);
      if (from) params.set('from', from);
      if (to) params.set('to', to);

      const url = '/api/admin/referrals' + (params.toString() ? ('?' + params.toString()) : '');
      const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token }});
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.message || data.error || `Failed to load referrals (${res.status})`);

      document.getElementById('total-commission').textContent = fmtPeso(data.totals?.totalCommission || 0);
      document.getElementById('total-enrollees').textContent = String(data.totals?.count || 0);
      document.getElementById('total-amount').textContent = fmtPeso(data.totals?.totalAmountPaid || 0);

      const tbody = document.getElementById('referrals-tbody');
      const empty = document.getElementById('referrals-empty');
      const rows = data.referrals || [];
      if (!rows.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><strong>${r.teacherName || r.teacherId}</strong><br><span class="muted">${r.teacherId}</span></td>
          <td><strong>${r.studentName || r.studentEmail || '—'}</strong><br><span class="muted">${r.studentEmail || ''}</span></td>
          <td>${r.studentContact || '—'}</td>
          <td>${r.subscriptionPlan || '—'}</td>
          <td>${fmtPeso(r.amountPaid || 0)}</td>
          <td>${fmtPeso(r.commissionAmount || 25)}</td>
          <td>${r.createdAt ? new Date(r.createdAt).toLocaleString() : ''}</td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await loadTeachers();
        await loadReferrals();
      } catch (e) {
        console.error(e);
        alert('Error loading commission data: ' + e.message);
      }
    });
  </script>
</body>
</html>
