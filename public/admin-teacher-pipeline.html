<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/admin-standalone-redirect.js"></script>
  <script src="js/admin-embed-init.js"></script>
  <title>TeacherPipeline - Admin</title>
  <link rel="stylesheet" href="css/teacher-sidebar.css" />
    <link rel="stylesheet" href="style.css">
  <style>
    .page-admin-teacher-pipeline .action-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .page-admin-teacher-pipeline .btn-delete {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .page-admin-teacher-pipeline .btn-delete:hover { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="page-admin-teacher-pipeline">
  <div class="layout">
    <div id="admin-sidebar-root"></div>
    <main class="content">
      <div class="card">
        <div class="head">
          <h1 class="title">TeacherPipeline</h1>
          <p class="sub">Review all applicants, watch demo lessons, and decide pass/fail.</p>
        </div>
        <div style="padding: 6px 0;">
          <table>
            <thead>
              <tr>
                <th>Applicant</th>
                <th>Email</th>
                <th>Stage</th>
                <th>Hiring Date</th>
                <th>Progress</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pipeline-body">
              <tr><td colspan="6" class="muted" style="padding: 18px;">Loading applicants...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="review-modal">
    <div class="modal">
      <div class="modal-head">
        <strong id="modal-name">Applicant Review</strong>
        <button class="btn" id="close-modal">Close</button>
      </div>
      <div class="modal-body">
        <div class="panel">
          <div class="muted">Lesson demo video</div>
          <video id="demo-video" controls style="width: 100%; margin-top: 8px; border-radius: 8px; background: #000;"></video>
          <a id="demo-video-link" href="#" target="_blank" rel="noopener" class="muted" style="display:block;margin-top:8px;">Open demo in new tab</a>
        </div>
        <div class="panel">
          <div class="muted">Text answers</div>
          <div id="answer-text" class="answers" style="margin-top: 8px;">No text answers.</div>
        </div>
        <div class="panel">
          <div class="muted">Video answer URLs</div>
          <div id="answer-videos" class="video-list" style="margin-top: 8px;"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-fail" id="modal-fail">Fail</button>
        <button class="btn btn-pass" id="modal-pass">Pass</button>
      </div>
    </div>
  </div>

  <script src="js/admin-session.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script>
    const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
    const userType = localStorage.getItem('userType');
    if (!token || (userType && userType !== 'admin')) {
      window.location.href = (function(){ try { var p = localStorage.getItem('remoedAdminEntryPath'); if (p && p.charAt(0) === '/') return p; } catch(e){} return 'index.html'; })();
    }

    if (!window.__ADMIN_EMBED__) { AdminSidebar.render('admin-sidebar-root', 'teacher-pipeline'); }

    const bodyEl = document.getElementById('pipeline-body');
    const modal = document.getElementById('review-modal');
    const modalName = document.getElementById('modal-name');
    const demoVideo = document.getElementById('demo-video');
    const demoVideoLink = document.getElementById('demo-video-link');
    const answerText = document.getElementById('answer-text');
    const answerVideos = document.getElementById('answer-videos');
    const passBtn = document.getElementById('modal-pass');
    const failBtn = document.getElementById('modal-fail');

    let selectedApplicantId = null;

    function stageProgress(stage) {
      const stages = ['applied', 'testing', 'interviewing', 'demo', 'documentation', 'passed', 'failed'];
      const idx = stages.indexOf(stage);
      if (idx < 0) return 0;
      if (stage === 'failed') return 100;
      return Math.round((idx / (stages.length - 2)) * 100);
    }

    function formatStageLabel(stage) {
      const s = (stage || 'applied').toString();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function canDeleteApplicant(stage) {
      const s = (stage || '').toString().toLowerCase();
      return s === 'passed' || s === 'failed';
    }

    function canPassOrFail(stage) {
      const s = (stage || '').toString().toLowerCase();
      return s !== 'passed' && s !== 'failed';
    }

    async function api(path, options = {}) {
      const headers = {
        'Authorization': `Bearer ${token}`,
        ...(options.headers || {})
      };
      if (options.body != null && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }
      const response = await fetch(path, { ...options, headers });
      const json = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(json.error || `Request failed (${response.status})`);
      return json;
    }

    async function deleteApplicant(applicantId, displayName) {
      const label = displayName && displayName !== applicantId ? displayName : 'this applicant';
      if (!confirm(`Permanently delete ${label} from the pipeline? This cannot be undone.`)) return;
      try {
        // POST avoids DELETE being blocked by some proxies/ngrok configs; server also accepts DELETE
        await api(`/api/admin/teacher-pipeline/applicants/${applicantId}/delete`, { method: 'POST', body: '{}' });
        await loadApplicants();
      } catch (error) {
        alert(error.message);
      }
    }

    async function loadApplicants() {
      bodyEl.innerHTML = '<tr><td colspan="6" class="muted" style="padding: 18px;">Loading applicants...</td></tr>';
      try {
        const data = await api('/api/admin/teacher-pipeline/applicants');
        const rows = data.applicants || [];
        if (!rows.length) {
          bodyEl.innerHTML = '<tr><td colspan="6" class="muted" style="padding: 18px;">No applicants found.</td></tr>';
          return;
        }
        bodyEl.innerHTML = rows.map((a) => {
          const st = a.currentStage || 'applied';
          const del = canDeleteApplicant(st)
            ? `<button type="button" class="btn-delete" data-delete="${a._id}">Delete</button>`
            : '';
          const pf = canPassOrFail(st)
            ? `<button type="button" class="btn btn-pass" data-pass-row="${a._id}" title="Pass applicant">Pass</button>
               <button type="button" class="btn btn-fail" data-fail-row="${a._id}" title="Fail applicant">Fail</button>`
            : '';
          const reapply =
            String(st).toLowerCase() === 'failed' && a.reapplyEligibleAt
              ? `<div class="muted" style="margin-top:4px;font-size:11px;">Re-apply after: ${new Date(a.reapplyEligibleAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</div>`
              : '';
          return `
          <tr>
            <td>${a.fullName || '-'}</td>
            <td>${a.email || '-'}</td>
            <td><span class="stage">${formatStageLabel(st)}</span>${reapply}</td>
            <td>${a.hiredAt ? new Date(a.hiredAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: '2-digit' }) : '-'}</td>
            <td>
              <div class="progress-track"><div class="progress-fill" style="width:${a.progress ?? stageProgress(a.currentStage)}%"></div></div>
              <div class="muted" style="margin-top:4px;">${a.progress ?? stageProgress(a.currentStage)}%</div>
            </td>
            <td class="action-btns">
              <button class="btn btn-review" data-review="${a._id}">Review</button>
              ${pf}
              ${del}
            </td>
          </tr>`;
        }).join('');

        Array.from(document.querySelectorAll('[data-review]')).forEach((btn) => {
          btn.addEventListener('click', () => openReview(btn.getAttribute('data-review')));
        });
        Array.from(document.querySelectorAll('[data-pass-row]')).forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-pass-row');
            const row = rows.find((r) => String(r._id) === String(id));
            const name = row ? (row.fullName || row.email || id) : id;
            passApplicantById(id, name);
          });
        });
        Array.from(document.querySelectorAll('[data-fail-row]')).forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-fail-row');
            const row = rows.find((r) => String(r._id) === String(id));
            const name = row ? (row.fullName || row.email || id) : id;
            failApplicantById(id, name);
          });
        });
        Array.from(document.querySelectorAll('[data-delete]')).forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-delete');
            const row = rows.find((r) => String(r._id) === String(id));
            const name = row ? (row.fullName || row.email || id) : id;
            deleteApplicant(id, name);
          });
        });
      } catch (error) {
        bodyEl.innerHTML = `<tr><td colspan="6" style="padding:18px;color:#dc2626;">${error.message}</td></tr>`;
      }
    }

    async function openReview(applicantId) {
      try {
        const data = await api(`/api/admin/teacher-pipeline/applicants/${applicantId}`);
        const applicant = data.applicant;
        selectedApplicantId = applicant._id;

        modalName.textContent = `Review: ${applicant.fullName || applicant.email || 'Applicant'}`;

        const demoUrl = applicant.demoVideoUrl || '';
        demoVideo.src = demoUrl;
        demoVideoLink.href = demoUrl || '#';
        demoVideoLink.textContent = demoUrl ? 'Open demo in new tab' : 'No demo video uploaded';

        const txt = applicant?.testAnswers?.text || '';
        answerText.textContent = txt || 'No text answers.';

        const vids = Array.isArray(applicant?.testAnswers?.videoUrls) ? applicant.testAnswers.videoUrls : [];
        answerVideos.innerHTML = vids.length
          ? vids.map((url, idx) => `<a href="${url}" target="_blank" rel="noopener">Video Answer ${idx + 1}</a>`).join('')
          : '<span class="muted">No video answer URLs.</span>';

        const stModal = String(applicant.currentStage || '').toLowerCase();
        const terminal = stModal === 'passed' || stModal === 'failed';
        passBtn.style.display = terminal ? 'none' : '';
        failBtn.style.display = terminal ? 'none' : '';

        modal.style.display = 'block';
      } catch (error) {
        alert(error.message);
      }
    }

    async function passApplicantById(applicantId, displayName, options = {}) {
      const label = displayName && displayName !== applicantId ? displayName : 'this applicant';
      if (!options.skipConfirm && !confirm(`Pass ${label}? An onboarding email with the sign-up link will be sent.`)) return;
      try {
        const result = await api(`/api/admin/teacher-pipeline/applicants/${applicantId}/pass`, { method: 'POST' });
        const info = result.emailResult?.success ? 'Invitation email sent.' : `Email issue: ${result.emailResult?.error || 'unknown'}`;
        alert(`Applicant passed. ${info}`);
        await loadApplicants();
      } catch (error) {
        alert(error.message);
      }
    }

    async function failApplicantById(applicantId, displayName, options = {}) {
      const label = displayName && displayName !== applicantId ? displayName : 'this applicant';
      if (!options.skipConfirm && !confirm(`Fail ${label}? They will be emailed and may re-apply after 3 months.`)) return;
      try {
        const result = await api(`/api/admin/teacher-pipeline/applicants/${applicantId}/fail`, { method: 'POST' });
        const info = result.emailResult?.success ? 'Notification email sent.' : `Email issue: ${result.emailResult?.error || 'unknown'}`;
        alert(`Applicant marked as failed. ${info}`);
        await loadApplicants();
      } catch (error) {
        alert(error.message);
      }
    }

    async function passApplicant() {
      if (!selectedApplicantId) return;
      passBtn.disabled = true;
      try {
        await passApplicantById(selectedApplicantId, modalName.textContent.replace(/^Review:\s*/, ''), {
          skipConfirm: true
        });
        closeModal();
      } finally {
        passBtn.disabled = false;
      }
    }

    async function failApplicant() {
      if (!selectedApplicantId) return;
      failBtn.disabled = true;
      try {
        await failApplicantById(selectedApplicantId, modalName.textContent.replace(/^Review:\s*/, ''), {
          skipConfirm: true
        });
        closeModal();
      } finally {
        failBtn.disabled = false;
      }
    }

    function closeModal() {
      modal.style.display = 'none';
      selectedApplicantId = null;
      demoVideo.pause();
      demoVideo.src = '';
      answerText.textContent = '';
      answerVideos.innerHTML = '';
      passBtn.style.display = '';
      failBtn.style.display = '';
    }

    document.getElementById('close-modal').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    passBtn.addEventListener('click', passApplicant);
    failBtn.addEventListener('click', failApplicant);

    loadApplicants();
  </script>
</body>
</html>
