<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6fbff; }
        .remoed-main { display: flex; min-height: calc(100vh - 70px); }
        .remoed-sidebar { width: 220px; background: #fff; box-shadow: 2px 0 8px rgba(0,0,0,0.05); padding: 32px 0 0 0; display: flex; flex-direction: column; }
        .remoed-logo { display: flex; align-items: center; gap: 14px; }
        .remoed-logo img { height: 48px; }
        .remoed-title { font-size: 1.7rem; font-weight: 700; color: #667eea; letter-spacing: 1px; }
        .remoed-user { display: flex; align-items: center; gap: 10px; }
        .remoed-avatar { width: 72px; height: 72px; border-radius: 50%; background: #667eea; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 2.2rem; }
        .remoed-username { color: #667eea; font-weight: 600; }
        .remoed-menu { list-style: none; padding: 0; margin: 0; }
        .remoed-menu li { padding: 14px 32px; color: #667eea; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 12px; border-left: 4px solid transparent; transition: all 0.2s; }
        .remoed-menu li.active, .remoed-menu li:hover { background: linear-gradient(90deg, #667eea 0%, #5a67d8 100%); border-left: 4px solid #667eea; color: white; transform: translateX(4px); }
        .remoed-menu svg { width: 20px; height: 20px; }
        .remoed-content { flex: 1; padding: 12px 16px; }
        .remoed-section { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(28,167,231,0.07); padding: 12px; margin-bottom: 12px; }
        .remoed-section-title { font-size: 1rem; font-weight: 700; color: #1ca7e7; margin-bottom: 10px; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.85rem; }
        .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.85rem; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-primary { background: #1ca7e7; color: #fff; }
        .btn-primary:hover { background: #168fc1; }
        .announcement-list { margin-top: 12px; }
        .announcement-item { background: #f8f9fa; border-radius: 6px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #1ca7e7; }
        .announcement-content { margin-bottom: 6px; font-size: 0.85rem; }
        .announcement-meta { font-size: 0.75rem; color: #666; }
        @media (max-width: 900px) {
            .remoed-main { flex-direction: column; }
            .remoed-sidebar { width: 100%; flex-direction: row; box-shadow: none; border-bottom: 1px solid #e0e6ed; }
            .remoed-menu li { padding: 12px 10px; font-size: 0.97rem; }
            .remoed-content { padding: 18px 6px; }
        }
    </style>
</head>
<body>
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-sidebar.js"></script>
        <script>AdminSidebar.render('admin-sidebar-root', 'announcements');</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Create Announcement</div>
                
                <form id="announcement-form">
                    <div class="form-group">
                        <label for="announcement-content">Announcement Message</label>
                        <textarea id="announcement-content" placeholder="Enter your announcement message here..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="announcement-audience">Target Audience</label>
                        <select id="announcement-audience" required>
                            <option value="all">All Users</option>
                            <option value="teachers">Teachers Only</option>
                            <option value="students">Students Only</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">📢 Post Announcement</button>
                </form>
                
                <div class="announcement-list">
                    <h3 style="color: #1ca7e7; margin-bottom: 20px;">Recent Announcements</h3>
                    <div id="announcements-container">
                        <!-- Announcements will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Role-based access control
        const userType = localStorage.getItem('userType');
        if (userType !== 'admin') {
            alert('Access denied. This page is for administrators only.');
            window.location.href = 'index.html';
        }

        let editingAnnouncementId = null;

        document.addEventListener('DOMContentLoaded', function() {
            if (window.AdminSidebar && typeof AdminSidebar.applyGreetingFromStorage === 'function') {
                AdminSidebar.applyGreetingFromStorage();
            }

            // Load existing announcements
            loadAnnouncements();
        });

        document.getElementById('announcement-form').onsubmit = async function(e) {
            e.preventDefault();
            
            const content = document.getElementById('announcement-content').value.trim();
            const audience = document.getElementById('announcement-audience').value;
            
            if (!content) {
                alert('Please enter an announcement message.');
                return;
            }
            
            try {
                const isEditing = !!editingAnnouncementId;
                const url = isEditing ? `/api/announcement/${editingAnnouncementId}` : '/api/announcement';
                const method = isEditing ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, audience })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(isEditing ? 'Announcement updated successfully!' : 'Announcement posted successfully!');
                    document.getElementById('announcement-content').value = '';
                    document.getElementById('announcement-audience').value = 'all';
                    editingAnnouncementId = null;
                    loadAnnouncements(); // Reload the list
                } else {
                    alert(data.message || 'Failed to save announcement.');
                }
            } catch (error) {
                console.error('Error saving announcement:', error);
                alert('Error saving announcement. Please try again.');
            }
        };

        async function loadAnnouncements() {
            try {
                const response = await fetch('/api/announcement');
                const announcements = await response.json();
                
                // Cache announcements globally so we can edit by ID without embedding content in onclick
                window.adminAnnouncements = announcements;

                const container = document.getElementById('announcements-container');
                
                if (!announcements.length) {
                    container.innerHTML = '<p style="color: #888; text-align: center;">No announcements yet.</p>';
                    return;
                }
                
                container.innerHTML = announcements.map(announcement => `
                    <div class="announcement-item">
                        <div class="announcement-content">${announcement.content}</div>
                        <div class="announcement-meta">
                            <strong>Audience:</strong> ${announcement.audience.charAt(0).toUpperCase() + announcement.audience.slice(1)} | 
                            <strong>Posted:</strong> ${new Date(announcement.updatedAt).toLocaleString()}
                        </div>
                        <div style="margin-top: 10px; display: flex; gap: 8px;">
                            <button class="btn" style="background:#3498db; color:#fff; padding:6px 12px; font-size:12px;" onclick="startEditAnnouncement('${announcement._id}')">Edit</button>
                            <button class="btn" style="background:#e74c3c; color:#fff; padding:6px 12px; font-size:12px;" onclick="deleteAnnouncement('${announcement._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading announcements:', error);
                document.getElementById('announcements-container').innerHTML = '<p style="color: #e74c3c; text-align: center;">Error loading announcements.</p>';
            }
        }

        // Start editing an announcement: load into the form
        function startEditAnnouncement(id) {
            const announcements = window.adminAnnouncements || [];
            const ann = announcements.find(a => a._id === id);
            if (!ann) {
                console.warn('Announcement not found for editing:', id);
                return;
            }

            editingAnnouncementId = id;
            document.getElementById('announcement-content').value = ann.content || '';
            document.getElementById('announcement-audience').value = ann.audience || 'all';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete an announcement
        async function deleteAnnouncement(id) {
            if (!confirm('Are you sure you want to delete this announcement?')) {
                return;
            }

            try {
                const response = await fetch('/api/announcement/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await response.json();

                if (data.success) {
                    alert('Announcement deleted successfully!');
                    // If we were editing this one, reset the form
                    if (editingAnnouncementId === id) {
                        editingAnnouncementId = null;
                        document.getElementById('announcement-content').value = '';
                        document.getElementById('announcement-audience').value = 'all';
                    }
                    loadAnnouncements();
                } else {
                    alert(data.message || 'Failed to delete announcement.');
                }
            } catch (error) {
                console.error('Error deleting announcement:', error);
                alert('Error deleting announcement. Please try again.');
            }
        }
    </script>
</body>
</html>
