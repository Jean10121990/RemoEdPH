<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css?v=app-shell-3">
    <link rel="stylesheet" href="css/portal-chrome-compact.css?v=icon-align-1">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-admin-announcements">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-sidebar.js?v=app-shell-16"></script>
        <script>AdminSidebar.render('admin-sidebar-root', 'announcements');</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Create Announcement</div>
                
                <form id="announcement-form">
                    <div class="form-group">
                        <label for="announcement-topic">Topic</label>
                        <select id="announcement-topic" required>
                            <option value="family-day">Family Day</option>
                            <option value="teachers-day">Teachers’ Day</option>
                            <option value="students-day">Students’ Day</option>
                            <option value="feeding-program">Feeding Program</option>
                            <option value="waste-management">Waste Management</option>
                            <option value="mental-health">Mental Health Support</option>
                            <option value="sustainability">Sustainability Projects</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                    <div class="form-group" id="announcement-topic-other-wrap" hidden>
                        <label for="announcement-topic-other">Other topic name</label>
                        <input id="announcement-topic-other" type="text" maxlength="80" placeholder="Name this announcement topic">
                    </div>
                    
                    <div class="form-group">
                        <label for="announcement-content">Announcement Message</label>
                        <textarea id="announcement-content" placeholder="Enter your announcement message here..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="announcement-audience">Target Audience</label>
                        <select id="announcement-audience" required>
                            <option value="all">All Users</option>
                            <option value="teachers">Teachers Only</option>
                            <option value="students">Students Only</option>
                            <option value="admins">Admins Only</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Post Announcement</button>
                </form>
                
                <div class="announcement-list">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
                        <h3 style="color: #1ca7e7; margin: 0;">Post history</h3>
                        <label style="font-size:0.9rem;color:#334155;display:flex;align-items:center;gap:8px;">
                            Topic
                            <select id="announcement-history-topic" style="padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;">
                                <option value="">All topics</option>
                                <option value="family-day">Family Day</option>
                                <option value="teachers-day">Teachers’ Day</option>
                                <option value="students-day">Students’ Day</option>
                                <option value="feeding-program">Feeding Program</option>
                                <option value="waste-management">Waste Management</option>
                                <option value="mental-health">Mental Health Support</option>
                                <option value="sustainability">Sustainability Projects</option>
                                <option value="others">Others</option>
                            </select>
                        </label>
                    </div>
                    <div id="announcements-container">
                        <!-- Announcements will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Role-based access control
        const userType = localStorage.getItem('userType');
        if (userType !== 'admin') {
            alert('Access denied. This page is for administrators only.');
            window.location.href = 'index.html';
        }

        let editingAnnouncementId = null;

        function formatAudienceLabel(audience) {
            const map = {
                all: 'All Users',
                teachers: 'Teachers Only',
                students: 'Students Only',
                admins: 'Admins Only'
            };
            return map[audience] || (audience ? audience.charAt(0).toUpperCase() + audience.slice(1) : '—');
        }

        const TOPIC_LABELS = {
            'family-day': 'Family Day',
            'teachers-day': "Teachers' Day",
            'students-day': "Students' Day",
            'feeding-program': 'Feeding Program',
            'waste-management': 'Waste Management',
            'mental-health': 'Mental Health Support',
            sustainability: 'Sustainability Projects',
            others: 'Others'
        };

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function formatTopicLabel(announcement) {
            const key = announcement && announcement.topic ? announcement.topic : 'others';
            const base = TOPIC_LABELS[key] || 'Others';
            if (key === 'others' && announcement && announcement.topicOther) {
                return 'Others · ' + announcement.topicOther;
            }
            return base;
        }

        function syncOtherTopicField() {
            const topic = document.getElementById('announcement-topic').value;
            const wrap = document.getElementById('announcement-topic-other-wrap');
            const input = document.getElementById('announcement-topic-other');
            const show = topic === 'others';
            if (wrap) wrap.hidden = !show;
            if (input) input.required = show;
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.AdminSidebar && typeof AdminSidebar.applyGreetingFromStorage === 'function') {
                AdminSidebar.applyGreetingFromStorage();
            }

            const params = new URLSearchParams(window.location.search);
            const preset = params.get('topic');
            if (preset && TOPIC_LABELS[preset]) {
                document.getElementById('announcement-topic').value = preset;
                document.getElementById('announcement-history-topic').value = preset;
            }
            syncOtherTopicField();
            document.getElementById('announcement-topic').addEventListener('change', syncOtherTopicField);
            document.getElementById('announcement-history-topic').addEventListener('change', function () {
                loadAnnouncements();
            });

            loadAnnouncements();
        });

        function adminApiFetchInit(init) {
            const cfg = Object.assign({ credentials: 'include' }, init || {});
            const headers = Object.assign({}, cfg.headers || {});
            const token =
                (window.RemoedAdminSession && RemoedAdminSession.getAuthToken
                    ? RemoedAdminSession.getAuthToken()
                    : (localStorage.getItem('remoed_admin_token') ||
                        localStorage.getItem('remoed_admin_auth') ||
                        localStorage.getItem('adminToken') ||
                        '')) || '';
            if (token && !headers.Authorization && !headers.authorization) {
                headers.Authorization = 'Bearer ' + token;
            }
            cfg.headers = headers;
            return cfg;
        }

        document.getElementById('announcement-form').onsubmit = async function(e) {
            e.preventDefault();
            
            const content = document.getElementById('announcement-content').value.trim();
            const audience = document.getElementById('announcement-audience').value;
            const topic = document.getElementById('announcement-topic').value;
            const topicOther = document.getElementById('announcement-topic-other').value.trim();
            
            if (!content) {
                alert('Please enter an announcement message.');
                return;
            }
            if (topic === 'others' && !topicOther) {
                alert('Enter a name for Other announcements.');
                return;
            }
            
            try {
                const isEditing = !!editingAnnouncementId;
                const url = isEditing ? `/api/announcement/${editingAnnouncementId}` : '/api/announcement';
                const method = isEditing ? 'PUT' : 'POST';

                const response = await fetch(url, adminApiFetchInit({
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, audience, topic, topicOther })
                }));
                
                const data = await response.json();
                
                if (data.success) {
                    alert(isEditing ? 'Announcement updated successfully!' : 'Announcement posted successfully!');
                    document.getElementById('announcement-content').value = '';
                    document.getElementById('announcement-audience').value = 'all';
                    document.getElementById('announcement-topic-other').value = '';
                    document.getElementById('announcement-history-topic').value = topic;
                    editingAnnouncementId = null;
                    syncOtherTopicField();
                    loadAnnouncements(); // Reload the list
                } else {
                    alert(data.message || data.error || 'Failed to save announcement.');
                }
            } catch (error) {
                console.error('Error saving announcement:', error);
                alert('Error saving announcement. Please try again.');
            }
        };

        async function loadAnnouncements() {
            try {
                const topic = document.getElementById('announcement-history-topic').value;
                const qs = topic ? ('?topic=' + encodeURIComponent(topic)) : '';
                const response = await fetch('/api/announcement' + qs, adminApiFetchInit());
                const announcements = await response.json();
                
                // Cache announcements globally so we can edit by ID without embedding content in onclick
                window.adminAnnouncements = announcements;

                const container = document.getElementById('announcements-container');
                
                if (!Array.isArray(announcements) || !announcements.length) {
                    container.innerHTML = '<p style="color: #888; text-align: center;">No announcements for this topic yet.</p>';
                    return;
                }
                
                container.innerHTML = announcements.map(announcement => `
                    <div class="announcement-item">
                        <div class="announcement-content">${escapeHtml(announcement.content)}</div>
                        <div class="announcement-meta">
                            <strong>Topic:</strong> ${escapeHtml(formatTopicLabel(announcement))} |
                            <strong>Audience:</strong> ${formatAudienceLabel(announcement.audience)} | 
                            <strong>Posted:</strong> ${new Date(announcement.updatedAt).toLocaleString()}
                        </div>
                        <div style="margin-top: 10px; display: flex; gap: 8px;">
                            <button class="btn" style="background:#3498db; color:#fff; padding:6px 12px; font-size:12px;" onclick="startEditAnnouncement('${announcement._id}')">Edit</button>
                            <button class="btn" style="background:#e74c3c; color:#fff; padding:6px 12px; font-size:12px;" onclick="deleteAnnouncement('${announcement._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading announcements:', error);
                document.getElementById('announcements-container').innerHTML = '<p style="color: #e74c3c; text-align: center;">Error loading announcements.</p>';
            }
        }

        // Start editing an announcement: load into the form
        function startEditAnnouncement(id) {
            const announcements = window.adminAnnouncements || [];
            const ann = announcements.find(a => a._id === id);
            if (!ann) {
                console.warn('Announcement not found for editing:', id);
                return;
            }

            editingAnnouncementId = id;
            document.getElementById('announcement-content').value = ann.content || '';
            document.getElementById('announcement-audience').value = ann.audience || 'all';
            document.getElementById('announcement-topic').value = ann.topic || 'others';
            document.getElementById('announcement-topic-other').value = ann.topicOther || '';
            syncOtherTopicField();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete an announcement
        async function deleteAnnouncement(id) {
            if (!confirm('Are you sure you want to delete this announcement?')) {
                return;
            }

            try {
                const response = await fetch('/api/announcement/delete', adminApiFetchInit({
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                }));
                const data = await response.json();

                if (data.success) {
                    alert('Announcement deleted successfully!');
                    // If we were editing this one, reset the form
                    if (editingAnnouncementId === id) {
                        editingAnnouncementId = null;
                        document.getElementById('announcement-content').value = '';
                        document.getElementById('announcement-audience').value = 'all';
                        document.getElementById('announcement-topic').value = 'family-day';
                        document.getElementById('announcement-topic-other').value = '';
                        syncOtherTopicField();
                    }
                    loadAnnouncements();
                } else {
                    alert(data.message || data.error || 'Failed to delete announcement.');
                }
            } catch (error) {
                console.error('Error deleting announcement:', error);
                alert('Error deleting announcement. Please try again.');
            }
        }
    </script>
</body>
</html>
