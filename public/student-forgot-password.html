<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Student Forgot Password - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css">
<link rel="stylesheet" href="css/student-sidebar-unified.css">
    <link rel="stylesheet" href="style.css">
</head>
<body  class="student-no-motion page-student-forgot-password">
  <!-- Floating educational elements -->
  <div class="floating-elements">
    <div class="floating-element">📚</div>
    <div class="floating-element">✏️</div>
    <div class="floating-element">🎨</div>
    <div class="floating-element">🔢</div>
    <div class="floating-element">🌍</div>
    <div class="floating-element">⭐</div>
  </div>

  <div class="forgot-container">
    <div class="remoed-logo">
      <img src="remoed-logo.png" alt="RemoEdPH Logo" style="height: 50px;">
      <span class="remoed-title">RemoEdPH</span>
      <div style="font-size: 0.9rem; color: #37517e; font-weight: 600;">Student Portal</div>
    </div>
    
    <div class="welcome-message">
      🔑 Reset Your Student Password 🔑
    </div>
    
    <div class="forgot-title">Student Forgot Password</div>
    <form class="forgot-form" id="student-forgot-form">
      <div class="form-group">
        <label for="student-forgot-email">📧 Email or Username</label>
        <input type="text" id="student-forgot-email" placeholder="Enter your email or username" required autocomplete="on">
      </div>
      <button type="submit" class="forgot-btn" id="forgot-btn">
        🔐 Reset Password
      </button>
    </form>
    <div class="forgot-message" id="student-forgot-message"></div>
    
    <div class="links-container">
      <div style="margin-bottom: 0.5rem; font-weight: 600; color: #667eea; font-size: 0.9rem;">📋 Quick Navigation</div>
      <a href="student-login.html">👈 Back to Student Login</a>
      <a href="student-register.html">📝 Don't have an account? Register here</a>
      <a href="index.html">🏠 Back to Home</a>
    </div>
  </div>
  
  <script>
    document.getElementById('student-forgot-form').onsubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('student-forgot-email').value;
      const submitBtn = document.getElementById('forgot-btn');
      const messageDiv = document.getElementById('student-forgot-message');
      
      // Clear previous messages
      messageDiv.style.display = 'none';
      
      // Show loading state
      submitBtn.textContent = '🔄 Processing...';
      submitBtn.disabled = true;
      
      try {
        const response = await fetch('/api/auth/student-forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          if (data.newPassword) {
            // Fallback mode - show the password
            messageDiv.innerHTML = `
              <div style="background: #d4edda; border: 1px solid #c3e6cb; border-radius: 12px; padding: 15px; margin: 10px 0;">
                <strong>✅ New Password Generated!</strong><br>
                <strong>Your new password is:</strong> <span style="font-family: monospace; background: #f8f9fa; padding: 4px 8px; border-radius: 6px; border: 1px solid #dee2e6;">${data.newPassword}</span><br>
                <small style="color: #6c757d; margin-top: 8px; display: block;">📧 Email service not configured. Please save this password and change it after logging in.</small>
              </div>
            `;
          } else {
            // Email configured - show success message
            messageDiv.innerHTML = `
              <div style="background: #d4edda; border: 1px solid #c3e6cb; border-radius: 12px; padding: 15px; margin: 10px 0;">
                <strong>✅ Password Reset Request Submitted!</strong><br>
                ${data.message}<br>
                <small style="color: #6c757d; margin-top: 8px; display: block;">📧 Please check your email inbox (and spam folder) for the new password.</small>
              </div>
            `;
          }
          messageDiv.className = 'forgot-message success';
          submitBtn.textContent = '✅ Success!';
        } else {
          messageDiv.textContent = data.message || 'An error occurred. Please try again.';
          messageDiv.className = 'forgot-message error';
          submitBtn.textContent = '🔐 Reset Password';
          submitBtn.disabled = false;
        }
        messageDiv.style.display = 'block';
      } catch (error) {
        console.error('Error:', error);
        messageDiv.textContent = 'An error occurred. Please try again.';
        messageDiv.className = 'forgot-message error';
        messageDiv.style.display = 'block';
        submitBtn.textContent = '🔐 Reset Password';
        submitBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
