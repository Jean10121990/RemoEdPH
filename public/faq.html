<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frequently Asked Questions - RemoEdPH</title>
  <link rel="stylesheet" href="modern-styles.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body.page-faq {
      background: #f4f7fb;
      margin: 0;
      min-height: 100vh;
    }
    .faq-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    .faq-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .faq-toolbar h1 {
      margin: 0;
      font-size: 1.55rem;
      color: #1e293b;
    }
    .faq-toolbar .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .faq-toolbar a,
    .faq-toolbar button {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .faq-toolbar a.primary {
      background: #1ca7e7;
      border-color: #1ca7e7;
      color: #fff;
    }
    .faq-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px 22px 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .faq-intro {
      color: #64748b;
      line-height: 1.55;
      margin: 0 0 8px;
      font-size: 0.95rem;
    }
    .faq-updated {
      color: #94a3b8;
      font-size: 0.8rem;
      margin: 0 0 18px;
    }
    .faq-section {
      margin-bottom: 22px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .faq-section:last-child {
      border-bottom: none;
    }
    .faq-section h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      color: #1ca7e7;
    }
    .faq-item {
      margin-bottom: 14px;
      border: 1px solid #eef2f7;
      border-radius: 10px;
      background: #fafcff;
      overflow: hidden;
    }
    .faq-item summary {
      cursor: pointer;
      list-style: none;
      padding: 12px 14px;
      font-weight: 600;
      color: #1e293b;
      font-size: 0.98rem;
    }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary::before {
      content: '▸';
      display: inline-block;
      margin-right: 8px;
      color: #667eea;
      transition: transform 0.15s ease;
    }
    .faq-item[open] summary::before { transform: rotate(90deg); }
    .faq-answer {
      padding: 0 14px 14px 28px;
      color: #475569;
      line-height: 1.55;
      font-size: 0.94rem;
      white-space: pre-line;
    }
    .faq-answer strong { color: #334155; }
    .faq-note {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #64748b;
    }
    @media print {
      .no-print { display: none !important; }
      body.page-faq { background: #fff; }
      .faq-item { break-inside: avoid; }
      .faq-item:not([open]) .faq-answer { display: block; }
    }
  </style>
</head>
<body class="page-faq">
  <div class="faq-wrap">
    <div class="faq-toolbar no-print">
      <h1 id="faq-page-title">Frequently Asked Questions</h1>
      <div class="actions">
        <a href="teacher-profile.html">← Back to Profile</a>
        <a class="primary" href="teacher-dashboard.html">Dashboard</a>
        <button type="button" id="faq-print-btn">Print</button>
      </div>
    </div>

    <div class="faq-card" id="faq-root">
      <p class="faq-intro">Loading FAQ…</p>
    </div>
  </div>

  <script src="js/remoed-faq-data.js?v=1"></script>
  <script>
    (function () {
      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /** Light markdown: **bold** only */
      function formatAnswer(text) {
        var escaped = escapeHtml(text);
        return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      }

      var data = window.RemoedFaqData;
      var root = document.getElementById('faq-root');
      if (!data || !root) {
        if (root) root.innerHTML = '<p class="faq-intro">FAQ data could not be loaded.</p>';
        return;
      }

      document.getElementById('faq-page-title').textContent = data.title || 'FAQ';
      document.title = (data.title || 'FAQ') + ' - RemoEdPH';

      var html = '';
      html += '<p class="faq-intro">' + escapeHtml(data.intro || '') + '</p>';
      if (data.updatedLabel) {
        html += '<p class="faq-updated">Last updated: ' + escapeHtml(data.updatedLabel) + '</p>';
      }

      (data.sections || []).forEach(function (section) {
        html += '<section class="faq-section" id="faq-sec-' + escapeHtml(section.id) + '">';
        html += '<h2>' + escapeHtml(section.title) + '</h2>';
        (section.items || []).forEach(function (item) {
          html += '<details class="faq-item" id="faq-' + escapeHtml(item.id) + '">';
          html += '<summary>' + escapeHtml(item.q) + '</summary>';
          html += '<div class="faq-answer">' + formatAnswer(item.a) + '</div>';
          html += '</details>';
        });
        html += '</section>';
      });

      html +=
        '<p class="faq-note no-print">Tip: Teachers can also ask Remo AI Assistant about these topics (HEART, plans, curriculum, mascots).</p>';
      root.innerHTML = html;

      document.getElementById('faq-print-btn').addEventListener('click', function () {
        document.querySelectorAll('.faq-item').forEach(function (el) {
          el.open = true;
        });
        window.print();
      });

      if (location.hash) {
        var target = document.querySelector(location.hash);
        if (target) {
          if (target.tagName === 'DETAILS') target.open = true;
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    })();
  </script>
</body>
</html>
