<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/remoed-gtag.js?v=ga-1"></script>

    <script src="js/security-guard.js?v=2"></script>
    <link rel="icon" href="/images/remoed-favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/images/remoed-favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Hub - RemoEdPH Admin</title>
    <link rel="stylesheet" href="modern-styles.css">
    <link rel="stylesheet" href="css/teacher-sidebar.css?v=app-shell-3">
    <link rel="stylesheet" href="css/portal-chrome-compact.css?v=icon-align-1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/admin-hub-shell.css">
</head>
<body class="admin-hub-page page-admin-marketing-hub">
    <div class="remoed-main">
        <div id="admin-sidebar-root"></div>
        <script src="js/admin-session.js"></script>
        <script src="js/admin-page-header.js?v=mark-all-2"></script>
        <script src="js/admin-sidebar.js?v=app-shell-17"></script>
        <script src="js/admin-hub-guard.js" data-hub="marketing"></script>
        <script>AdminSidebar.render('admin-sidebar-root', 'marketing');</script>
        <div class="remoed-content">
            <div class="remoed-section">
                <div class="remoed-section-title">Marketing Hub</div>
                <p class="muted" style="margin-top:0;margin-bottom:16px;">Unique link commissions, referral leaderboard, and Independent Growth Affiliates.</p>

                <div class="hub-tabs" role="tablist" aria-label="Marketing Hub sections">
                    <button type="button" class="hub-tab hub-tab--active" role="tab" id="mkt-tab-commissions" aria-selected="true" aria-controls="mkt-panel-commissions" data-tab="commissions">Unique Link Commissions</button>
                    <button type="button" class="hub-tab" role="tab" id="mkt-tab-leaderboard" aria-selected="false" aria-controls="mkt-panel-leaderboard" data-tab="leaderboard">Referral Leaderboard</button>
                    <button type="button" class="hub-tab" role="tab" id="mkt-tab-affiliates" aria-selected="false" aria-controls="mkt-panel-affiliates" data-tab="affiliates">Affiliates</button>
                </div>

                <div id="mkt-panel-commissions" class="hub-panel" role="tabpanel" aria-labelledby="mkt-tab-commissions">
                    <iframe id="iframe-mkt-commissions" class="hub-iframe" title="Unique Link Commissions"></iframe>
                </div>
                <div id="mkt-panel-leaderboard" class="hub-panel" role="tabpanel" aria-labelledby="mkt-tab-leaderboard" hidden>
                    <iframe id="iframe-mkt-leaderboard" class="hub-iframe" title="Referral Leaderboard"></iframe>
                </div>
                <div id="mkt-panel-affiliates" class="hub-panel" role="tabpanel" aria-labelledby="mkt-tab-affiliates" hidden>
                    <iframe id="iframe-mkt-affiliates" class="hub-iframe" title="Affiliates"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var IFRAMES = {
                commissions: { id: 'iframe-mkt-commissions', src: '/admin/admin-unique-link-commission.html?adminEmbed=1&embedVer=3' },
                leaderboard: { id: 'iframe-mkt-leaderboard', src: '/admin/admin-referral-leaderboard.html?adminEmbed=1&embedVer=1' },
                affiliates: { id: 'iframe-mkt-affiliates', src: '/admin/admin-affiliates.html?adminEmbed=1&embedVer=1' }
            };

            function checkAuth() {
                var token = (window.RemoedAdminSession && RemoedAdminSession.getAuthToken ? RemoedAdminSession.getAuthToken() : (localStorage.getItem('remoed_admin_token')||localStorage.getItem('remoed_admin_auth')||localStorage.getItem('adminToken')||''));
                if (!token) {
                    window.location.href = (function () {
                        try {
                            var p = localStorage.getItem('remoedAdminEntryPath');
                            if (p && p.charAt(0) === '/') return p;
                        } catch (e) {}
                        return 'index.html';
                    })();
                    return false;
                }
                if (window.AdminSidebar && typeof AdminSidebar.applyGreetingFromStorage === 'function') {
                    AdminSidebar.applyGreetingFromStorage();
                }
                return true;
            }

            function ensureIframe(key) {
                var cfg = IFRAMES[key];
                if (!cfg) return;
                var el = document.getElementById(cfg.id);
                if (!el || el.getAttribute('data-loaded')) return;
                el.src = cfg.src;
                el.setAttribute('data-loaded', '1');
            }

            function setHash(tab) {
                try {
                    var h = '#commissions';
                    if (tab === 'leaderboard') h = '#leaderboard';
                    else if (tab === 'affiliates') h = '#affiliates';
                    if (window.location.hash !== h) {
                        history.replaceState(null, '', 'admin-marketing-hub.html' + h);
                    }
                } catch (e) {}
            }

            function showTab(tab) {
                var key = 'commissions';
                if (tab === 'leaderboard') key = 'leaderboard';
                else if (tab === 'affiliates') key = 'affiliates';
                var map = [
                    { key: 'commissions', t: 'mkt-tab-commissions', p: 'mkt-panel-commissions' },
                    { key: 'leaderboard', t: 'mkt-tab-leaderboard', p: 'mkt-panel-leaderboard' },
                    { key: 'affiliates', t: 'mkt-tab-affiliates', p: 'mkt-panel-affiliates' }
                ];
                map.forEach(function (row) {
                    var on = row.key === key;
                    var tEl = document.getElementById(row.t);
                    var pEl = document.getElementById(row.p);
                    if (tEl) {
                        tEl.classList.toggle('hub-tab--active', on);
                        tEl.setAttribute('aria-selected', on ? 'true' : 'false');
                    }
                    if (pEl) pEl.hidden = !on;
                });
                ensureIframe(key);
                setHash(key);
            }

            function tabFromHash() {
                var h = String(window.location.hash || '').replace(/^#/, '').toLowerCase();
                if (h === 'leaderboard') return 'leaderboard';
                if (h === 'affiliates') return 'affiliates';
                return 'commissions';
            }

            document.addEventListener('DOMContentLoaded', function () {
                if (!checkAuth()) return;
                document.querySelectorAll('.hub-tab[data-tab]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        showTab(btn.getAttribute('data-tab') || 'commissions');
                    });
                });
                window.addEventListener('hashchange', function () {
                    showTab(tabFromHash());
                });
                showTab(tabFromHash());
            });
        })();
    </script>
</body>
</html>
