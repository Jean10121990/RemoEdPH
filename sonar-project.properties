# SonarQube / SonarCloud — RemoEd (Node.js + Express + static public)
# Project key (SonarCloud: must match the key in your project settings)
sonar.projectKey=RemoEd-Web-App
sonar.projectName=RemoEd Web App
sonar.projectVersion=1.0

# Source directories (comma-separated, relative to project base dir)
sonar.sources=server,public

# Exclude noise, build output, tests, and secrets
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,**/.env,**/.env.*,**/coverage/**

# Optional: test files location when you add a test suite (uncomment and adjust)
# sonar.tests=server
# sonar.test.inclusions=**/*.test.js,**/*.spec.js

# JavaScript / Node — LCOV when you add coverage (e.g. Jest: coverage/lcov.info)
# Generate with something like: npx jest --coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# --- SonarCloud only (uncomment and set if you use cloud.sonarqube.org) ---
# sonar.organization=your-org-key
# sonar.host.url=https://sonarcloud.io

# --- Self-hosted SonarQube (uncomment if you use your own server) ---
# sonar.host.url=https://your-sonarqube.example.com
