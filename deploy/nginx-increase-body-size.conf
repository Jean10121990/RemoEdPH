# Fix: 413 Request Entity Too Large on remoedph.com / Hostinger VPS
#
# Affects: admin portal video uploads (multipart, e.g. 6 MB MP4),
#          lesson JSON+base64 uploads, large profile documents.
# Express/multer already allow large bodies; Nginx default client_max_body_size is often 1m.
#
# Add ONE of the following inside the same server { } that proxies to Node.

# Option A — whole site
client_max_body_size 64M;

# Option B — API only (example; adjust proxy_pass port to your app)
