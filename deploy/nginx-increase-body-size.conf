# Fix: 413 Request Entity Too Large on lesson uploads (remoedph.com / Hostinger VPS)
#
# Lesson files are sent as JSON with base64 (POST /api/lessons/lesson/:id/upload-file).
# Express is already set to 50mb; Nginx default client_max_body_size is often 1m.
#
# Add ONE of the following inside the same server { } that proxies to Node.

# Option A — whole site
client_max_body_size 64M;

# Option B — API only (example; adjust proxy_pass port to your app)
